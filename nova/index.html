    if (!countType(s, 'market')) return { text: n + ' no food. Build a market near the homes.', btn: 'Market', act: { tool: 'market' } };
    const farms = s.b.filter((b) => BUILDINGS[b.type].food && BUILDINGS[b.type].makes);
    if (!farms.length) return { text: n + ' no food. Build a fishing hut or a fruit grove.', btn: 'Fishing hut', act: { tool: 'fishing' } };
    // A new market or farm gets a month before Rosa judges the food.

    const near = [...ids].map((id) => bById(s, id)).filter(Boolean), working = near.filter((m) => m.open && m.workers > 0);
    if (near.length && !working.length) {

        : { text: 'The market is shut down, so nobody gets food. Open it on its card.', btn: 'Show', act: { select: m.id } };
    }

      if (lost) return { text: 'Your markets have no food: the ' + BUILDINGS[lost.type].name.toLowerCase() + ' has no road to a market. Join its road to the town.', btn: 'Show', act: { select: lost.id, roads: true } };
      return { text: 'Your markets have no food: build a fruit grove or a fishing hut.', btn: 'Fruit grove', act: { tool: 'grove' } };
    }
    const far = hungry.filter((h) => !reach[h.id].markets.length);
    const cut = far.filter((h) => reach[h.id].cut.some((id) => (bById(s, id) || {}).type === 'market'));
    if (cut.length) return { text: plural(cut.length, 'home is', 'homes are') + ' near a market, but no road joins them. Join the roads (Show marks both).', btn: 'Show', act: { select: cut[0].id, roads: true } };
    if (far.length) return { text: plural(far.length, 'home is', 'homes are') + ' more than ' + TUNE.marketReach + ' tiles from a market. Build a market near them.', btn: 'Show', act: { select: far[0].id } };
    return { text: 'The markets run out of food: ' + n + ' none. Build another fishing hut or fruit grove.', btn: 'Fruit grove', act: { tool: 'grove' } };
  } },
  { key: 'landmark', check(s) {
    // Everything for the next stage is there but its landmark: say what it is and where it is bought.
    const { next, conds } = stageConds(s);
    if (!next || next.goal || !conds.length) return null;
    const lm = conds.find((c) => c.landmark);
    if (!lm || lm.ok || conds.some((c) => !c.landmark && !c.ok)) return null;
    const res = next.landmark.res ? RESIDENCE[next.landmark.res] : null;
    if (res) return { text: 'Everything is ready for ' + next.name + ' but its landmark: the ' + res.name + ', ' + money$(res.cost) + ', on the residence\'s card.', btn: 'Residence', act: { select: (s.b.find((b) => b.type === 'residence') || {}).id } };
    const t = next.landmark.b;
    return { text: 'Everything is ready for ' + next.name + ' but its landmark: a ' + BUILDINGS[t].name.toLowerCase() + ', ' + money$(BUILDINGS[t].cost) + '.', btn: toolLabel(t), act: { tool: t } };
  }, now: true },
  { key: 'input', check(s) {
    const b = s.b.find((o) => o.blocked === 'input' && o.workers > 0);
    if (!b) return null;
    const g = Object.keys(BUILDINGS[b.type].uses)[0];
    return { text: 'The ' + BUILDINGS[b.type].name.toLowerCase() + ' has no ' + GOODS[g].name.toLowerCase() + '. Build ' + inputSource(g) + ', connected by road.', btn: 'Show', act: { select: b.id } };
  } },
  { key: 'needs', check(s) {
    const t = topNeed(s, 'miss');
    if (!t || t.n < 2) return null;
    const fix = needFix(s, t.need);
    const lv = LEVELS[(homesOccupied(s).find((h) => (h.miss || []).includes(t.need)) || {}).level || 1];
    return { text: t.n + ' homes lack ' + NEED_NAMES[t.need] + ' · ' + fix.text + '. ' + lv.name + 's without it step down after ' + TUNE.levelDownMonths + ' months.',
      btn: toolLabel(fix.tool), act: { tool: fix.tool } };
  } },
  { key: 'yard', check(s) {

    const b = full.find((o) => !surplus(o)) || full[0];
    if (!b) return null;
    if (surplus(b)) return { text: yardText(s, b), btn: 'Home', act: { tool: 'casita' } };

  } },
  { key: 'workers', check(s) {
    const b = s.b.find((o) => BUILDINGS[o.type].jobs && o.open && o.workers === 0);
    if (!b) return null;
    return { text: 'The ' + BUILDINGS[b.type].name.toLowerCase() + ' has no workers. Half of the people work: build homes.', btn: 'Home', act: { tool: 'casita' } };
  } },
  { key: 'unhappy', check(s) {
    if (s.happy >= TUNE.happyArrive || !popCount(s)) return null;
    const worst = happyReasons(s).filter((p) => p.v < 0)[0];
    return { text: 'Happiness is ' + s.happy + ': no new settlers come below 50. Biggest reason: ' + (worst ? worst.label.toLowerCase() : 'unknown') + '.', btn: 'Desk', act: { desk: 1 } };
  } },
  { key: 'jobs', check(s) {
    if (!s.workforce || s.jobless / s.workforce <= 0.2) return null;
    const t = ['grove', 'cane', 'tobacco', 'finca', 'finca', 'finca'][s.stage];
    // Only goods she can make now (block 4: in Settlement she named rum, cigars and coffee, all locked).
    const sell = EXPORTABLE.filter((g) => GOODS[g].price >= 100 && makerOf(g) && BUILDINGS[makerOf(g)].stage <= s.stage && BUILDINGS.harbor.stage <= s.stage).map((g) => GOODS[g].name.toLowerCase());
    return { text: plural(s.jobless, 'person has', 'people have') + ' no work. ' + (sell.length ? 'Build a farm or a workshop: the ship buys ' + listAnd(sell) + '.' : 'Build a farm: more food lets more homes fill.'), btn: toolLabel(t), act: { tool: t } };
  } },
  { key: 'beds', check(s) {
    if (freeBeds(s) > 0 || s.happy < TUNE.happyArrive || countType(s, 'casita') < 3) return null;
    return { text: 'Every home is full. Build homes so more settlers can come.', btn: 'Home', act: { tool: 'casita' } };
  } },
  { key: 'grow', check(s) {
    const t = topNeed(s, 'missNext');
    if (!t || t.n < 3) return null;
    const h = homesOccupied(s).find((x) => (x.missNext || []).includes(t.need));
    const next = LEVELS[h.level + 1];
    const fix = needFix(s, t.need);
    return { text: t.n + ' homes need ' + NEED_NAMES[t.need] + ' to become ' + next.name + 's · ' + fix.text + '.', btn: toolLabel(fix.tool), act: { tool: fix.tool } };
  } },
];

// The button's label for a tool.
function toolLabel(t) { return t === 'paved' ? 'Paved road' : t === 'road' ? 'Road' : BUILDINGS[t] ? (BUILDINGS[t].short || BUILDINGS[t].name) : 'Show'; }

function guideMonth(state) {
  const g = state.guide;
  let say = null;
  // While her first three steps are on, only the urgent lines may interrupt them (block 4: a problem line replaced
  // "Build three homes" under her finger).
  const intro = g.step < GUIDE_INTRO.length;
  for (const p of GUIDE_PROBLEMS) {
    const m = p.check(state);
    g.cnt[p.key] = m ? (g.cnt[p.key] || 0) + 1 : 0;
    if (m && !say && (p.now || (!intro && g.cnt[p.key] >= TUNE.guideMonths)) && !(g.snooze[p.key] > state.month)) say = Object.assign({ key: p.key }, m);
  }
  // The first home that steps down: Rosa says it once (later ones: a toast and the mark on the map).
  if (g.pendDown) {
    if (!g.seen.down) {
      g.seen.down = 1;
      say = { key: 'hint-down', text: g.pendDown.text + ' A ↓ mark stays over it until you tap it; its card says what it needs.', btn: 'Show', act: { select: g.pendDown.id } };
    }
    g.pendDown = null;
  }
  if (say) guideSay(state, say);
  else if (g.msg && !g.msg.key.startsWith('i-') && !g.msg.key.startsWith('hint')) g.msg = null;
}

function guideStageHint(state) {
  const hints = {
    1: 'Village! Cane field → rum distillery → harbor: the ship pays $' + GOODS.rum.price + ' a barrel. Bread and a chapel turn homes into Houses. Save for the Governor\'s house (' + money$(RESIDENCE[1].cost) + '): Town needs it.',
    2: 'Town! Villas need rum, a school and a clinic. New: tobacco and cigars, lumber and planks. City needs the Governor\'s villa (' + money$(RESIDENCE[2].cost) + ').',
    3: 'City! Townhouses need meat, coffee, a park and a decoration nearby. Paved roads: carts twice as fast. Port city needs the Governor\'s mansion (' + money$(RESIDENCE[3].cost) + ').',
    4: 'Port city! Mansions need cigars and a paved street. The steamship quay (' + money$(BUILDINGS.quay.cost) + '): two ships a month, twice the settlers; Capital needs it.',
    5: 'Capital! The cathedral (+' + TUNE.cathedralHappy + ' happiness), the opera (+10 % rent nearby), and the last goal: the Governor\'s palace, ' + money$(TUNE.palaceCost) + '.',
  };
  if (hints[state.stage]) guideSay(state, { key: 'hint-stage' + state.stage, text: hints[state.stage], btn: 'OK', act: {} });
}

// ---- src/sim/desk.js
// The Governor's desk: rent, wages, exports, open/close. Every preview simulates the change on a copy of the island.

function deskApply(state, change) {
  if (change.lever) state.lev[change.lever] = change.value;
  if (change.exp) state.exp[change.exp] = !!change.on;
  if (change.close !== undefined) { const b = bById(state, change.close); if (b) b.open = !change.shut; }
}

// Run a copy to the end of this month and through one more; the second payday is the "a month" figure.
function previewRun(s) {
  simRunMonths(s, 1);
  simRunMonths(s, 1);
  return { result: s.lastReceipt.result, happy: s.happy };
}

function previewText(money, happy) {
  const parts = [];
  if (money) parts.push((money > 0 ? '+' : '−') + '$' + Math.abs(money) + ' a month');
  if (happy) parts.push('happiness ' + (happy > 0 ? '+' : '−') + Math.abs(happy));
  return parts.length ? parts.join(' · ') : 'no change';
}

// changes: [{ id, change }] -> { id: { money, happy, text } }, all against one shared baseline run.
function deskPreviews(state, changes) {
  const base = previewRun(simClone(state));
  const out = {};
  for (const c of changes) {
    const s = simClone(state);
    deskApply(s, c.change);
    const r = previewRun(s);
    const money = r.result - base.result, happy = r.happy - base.happy;
    out[c.id] = { money, happy, text: previewText(money, happy) };
  }
  return out;
}

function deskChanges(state) {
  const list = [];
  for (const v of ['low', 'fair', 'high']) list.push({ id: 'rent:' + v, change: { lever: 'rent', value: v } });
  for (const v of ['low', 'fair', 'high']) list.push({ id: 'wages:' + v, change: { lever: 'wages', value: v } });
  for (const g of EXPORTABLE) if (goodSeen(state, g)) list.push({ id: 'exp:' + g, change: { exp: g, on: !state.exp[g] } });
  return list;
}

// A good shows at the desk once a building on the island makes it.
function goodSeen(state, g) { return state.b.some((b) => BUILDINGS[b.type].makes === g); }

// ---- src/sim/save.js
// Save and load: the state is one plain JSON object. Caches (keys starting with "_"), events and walkers are not saved.

const SAVE_KEY = 'isla-nova-v1';

function saveGame(state) {
  const o = {};
  for (const k in state) if (k[0] !== '_' && k !== 'ev' && k !== 'walk') o[k] = state[k];
  return JSON.parse(JSON.stringify(o));
}

function loadGame(obj) {
  const s = typeof obj === 'string' ? JSON.parse(obj) : JSON.parse(JSON.stringify(obj));
  if (!s || s.v !== 1 || !Array.isArray(s.b)) throw new Error('Not an Isla Nueva (new) save');
  if (!s.mv) saveMigrate1(s);
  if (s.mv < 3) saveMigrate2(s);
  s.ev = [];
  s.walk = [];
  return s;
}

// Block 1 saves -> block 2: money ×10, six land regions, home needs split into rules (miss) and bubbles (lacks).
function saveMigrate1(s) {
  const x10 = (o, keys) => { if (o) for (const k of keys) if (typeof o[k] === 'number') o[k] *= 10; };
  x10(s, ['money']);
  for (const h of s.history || []) x10(h, ['money', 'result']);
  if (s.lastReceipt) { x10(s.lastReceipt, ['rent', 'exports', 'wagesUpkeep', 'imports', 'result']); for (const l of s.lastReceipt.lines || []) x10(l, ['n']); }
  for (const b of s.b) {
    x10(b, ['sold', 'bought', 'lastSold', 'lastBought']);
    if (b.type === 'casita') { b.miss = b.lacks || []; b.missNext = b.wants || []; }
  }
  s.region = mapGenerate(s.seed).region;
  s.palace = 0;
  s.mv = 2;
}

// Block 2 saves -> block 3: the residence grew by itself with each stage; now each level is bought and is the landmark
// of the next stage. An old island counts the landmarks of the stages it already reached as built (Town: the house;
// City: the villa; Port city and Capital: the mansion) and buys the next one like a new island.
function saveMigrate2(s) {
  const r = s.b.find((b) => b.type === 'residence');
  s.res = Math.max(0, Math.min(RESIDENCE.length - 1, (s.stage || 0) - 1));
  if (r && !s.palace) r.level = s.res;
  // The cleared passage to the Capital's land (map.js); only forest becomes grass, nothing built is touched.
  mapPassage(s.terrain, s.region, s.stub[0]);
  s.mv = 3;
}

// A detached copy for previews: no events, no walkers.
function simClone(state) {
  const s = loadGame(saveGame(state));
  s.ev = null;
  s.walk = null;
  return s;
}

// ---- src/sim/sim.js
// The island state, the tick and the month's end. Pure: no DOM; deterministic from the seed.

function newGame(seed) {
  seed = seed === undefined ? 1902 : seed;
  const map = mapGenerate(seed);
  const state = {
    v: 1, seed, rng: seed | 0, tick: 0, mt: 0, month: 0, money: TUNE.startMoney, stage: 0, ver: 1, nextId: 1,
    terrain: map.terrain, region: map.region, road: new Array(MAP_W * MAP_H).fill(0), stub: map.stub,
    b: [], carts: [], lev: { rent: 'fair', wages: 'fair' }, exp: Object.assign({}, EXPORT_DEFAULT),
    happy: 50, workforce: 0, jobs: 0, jobless: 0, exported: {}, monthExported: {}, monthImports: {},
    lastReceipt: null, history: [], log: [], stageMonth: { 0: 0 }, stats: { levelUps: 0 },
    guide: { step: 0, msg: null, cnt: {}, seen: {}, snooze: {} }, lastMoves: { came: 0, left: 0 },
    walk: [], ev: [], palace: 0, res: 0, mv: 3,
  };
  for (const i of map.stub) state.road[i] = 1;
  state.b.push(newBuilding(state, 'pier', map.pier.x, map.pier.y));
  state.b.push(Object.assign(newBuilding(state, 'residence', map.residence.x, map.residence.y), { level: 0 }));
  guideIntro(state);
  return state;
}

function simEvent(state, e) { if (state.ev) state.ev.push(e); }

function simLog(state, text) {
  state.log.push({ m: state.month, text });
  if (state.log.length > TUNE.logMax) state.log.shift();
  simEvent(state, { kind: 'log', text });
}

function dateLabel(month) { return MONTHS[month % 12] + ' ' + (TUNE.startYear + Math.floor(month / 12)); }

function simTick(state) {
  jobsAssign(state);
  if (state.mt % 10 === 0) for (const b of state.b) if (BUILDINGS[b.type].kind === 'harbor') harborOrder(state, b);
  if (state.mt === TUNE.ticksPerMonth / 2) shipSail(state, true);
  for (const b of state.b) if (BUILDINGS[b.type].kind === 'producer') prodTick(state, b);
  for (const c of state.carts) cartTick(state, c);
  for (const b of state.b) if (BUILDINGS[b.type].kind === 'market') marketTick(state, b);
  for (const b of state.b) if (b.type === 'casita') homeTick(state, b);
  walkersTick(state);
  state.tick++;
  state.mt++;
  if (state.mt >= TUNE.ticksPerMonth) monthEnd(state);
  if (state.tick % 5 === 0) guideIntro(state);
}

// The month's end, in a fixed order: homes, the ship, payday, happiness, people, the stage, the guide.
function monthEnd(state) {
  for (const b of state.b) if (b.type === 'casita') homeMonth(state, b);
  bubblesPick(state);
  shipSail(state);
  jobsAssign(state);
  paydayRun(state);
  state.monthExported = {};
  state.happy = happyCalc(state).value;
  peopleMonth(state);
  jobsAssign(state);
  stageCheck(state);
  guideMonth(state);
  state.monthImports = {};
  state.mt = 0;
  state.month++;
  if (state.month % 12 === 0) simEvent(state, { kind: 'year', year: TUNE.startYear + state.month / 12 - 1 });
}

function simRun(state, ticks) { for (let k = 0; k < ticks; k++) simTick(state); }

function simRunMonths(state, months) { simRun(state, months * TUNE.ticksPerMonth - state.mt); }

// The year in three lines, for the New Year card.
function yearSummary(state, year) {
  const h = state.history.filter((x) => TUNE.startYear + Math.floor(x.m / 12) === year);
  if (!h.length) return [];
  const sum = h.reduce((s, x) => s + x.result, 0);
  const before = state.history.find((x) => x.m === h[0].m - 1);
  const pop0 = before ? before.pop : 0;
  const last = h[h.length - 1];
  const reached = STAGES.filter((s, i) => i > 0 && state.stageMonth[i] !== undefined && TUNE.startYear + Math.floor(state.stageMonth[i] / 12) === year).map((s) => s.name);
  return [
    'People ' + pop0 + ' → ' + last.pop + ' · happiness ' + last.happy,
    'Paydays together: ' + money$(sum) + ' · money now ' + money$(last.money),
    reached.length ? 'Reached: ' + reached.join(', ') : 'Next: ' + (STAGES[state.stage + 1] ? STAGES[state.stage + 1].name : 'the next age'),
  ];
}

function guideDismiss(state) {
  const g = state.guide;
  if (g.msg) g.snooze[g.msg.key] = state.month + 3;
  g.msg = null;
}

const ICON_PATHS = {};

};

function flatCreate(canvas) {
  return { canvas, ctx: canvas.getContext('2d'), dpr: 1, w: 0, h: 0, terrain: null, terrainKey: '' };

function flatToScreen(R, view, tx, ty) { return { x: (tx - view.cx) * view.z + R.w / 2, y: (ty - view.cy) * view.z + R.h / 2 }; }
function flatToTile(R, view, sx, sy) { return { x: (sx - R.w / 2) / view.z + view.cx, y: (sy - R.h / 2) / view.z + view.cy }; }

function renderResize(R) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2), w = R.canvas.clientWidth, h = R.canvas.clientHeight;
  if (w === R.w && h === R.h && dpr === R.dpr) return;
  R.w = w; R.h = h; R.dpr = dpr;
  R.canvas.width = Math.round(w * dpr); R.canvas.height = Math.round(h * dpr);
}

// Terrain (and the locked-land shade) painted once per stage into an offscreen canvas.
function terrainPaint(R, state) {
  const key = state.seed + ':' + state.stage;
  if (R.terrain && R.terrainKey === key) return R.terrain;
  const c = document.createElement('canvas');
  c.width = MAP_W * CACHE_PX; c.height = MAP_H * CACHE_PX;
  const g = c.getContext('2d'), P = CACHE_PX;
  g.fillStyle = PAL.seaDeep; g.fillRect(0, 0, c.width, c.height);
  const T = (x, y) => (inMap(x, y) ? state.terrain[tileIdx(x, y)] : SEA);
  // Water bands: big soft circles around the land, then the land as tiles whose outer corners are rounded.
  const isLand = (x, y) => T(x, y) !== SEA;
  for (const [r, col] of [[2.6, PAL.sea], [1.45, PAL.shallow]]) {
    g.fillStyle = col;
    for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) if (isLand(x, y)) { g.beginPath(); g.arc((x + 0.5) * P, (y + 0.5) * P, r * P, 0, 7); g.fill(); }
  }
  const tilesRound = (test, colFn) => {
    for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
      if (!test(x, y)) continue;
      const out = (dx, dy) => !test(x + dx, y + dy);
      const r = P * 0.5;
      const radii = [out(-1, 0) && out(0, -1) ? r : 0, out(1, 0) && out(0, -1) ? r : 0, out(1, 0) && out(0, 1) ? r : 0, out(-1, 0) && out(0, 1) ? r : 0];
      g.fillStyle = colFn(x, y);
      g.beginPath(); g.roundRect(x * P - 0.5, y * P - 0.5, P + 1, P + 1, radii); g.fill();
    }
  };
  tilesRound(isLand, () => PAL.sand);
  const green = (x, y) => { const t = T(x, y); return t === GRASS || t === HILL || t === FOREST; };
  tilesRound(green, (x, y) => {
    const n = valueNoise(state.seed + 5, x, y, 6);
    if (T(x, y) === HILL) return 'rgb(' + Math.round(128 + n * 14) + ',' + Math.round(176 + n * 10) + ',' + Math.round(88 + n * 8) + ')';
    return 'rgb(' + Math.round(146 + n * 20) + ',' + Math.round(196 + n * 12) + ',' + Math.round(98 + n * 14) + ')';
  });
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    if (T(x, y) !== FOREST) continue;
    g.fillStyle = PAL.forest; g.fillRect(x * P, y * P, P, P);
    for (let k = 0; k < 3; k++) {
      const ox = hash2(state.seed + k, x, y), oy = hash2(state.seed + 9 + k, x, y);
      g.fillStyle = k === 1 ? '#5aa052' : PAL.tree;
      g.beginPath(); g.arc(x * P + P * (0.2 + ox * 0.6), y * P + P * (0.2 + oy * 0.6), P * 0.3, 0, 7); g.fill();
    }
  }
  // Locked land: shaded, with a dashed border and the stage that opens it.
  const labels = {};
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    const i = tileIdx(x, y);
    if (state.region[i] <= state.stage || T(x, y) === SEA) continue;
    g.fillStyle = PAL.locked; g.fillRect(x * P, y * P, P, P);
    const L = labels[state.region[i]] || (labels[state.region[i]] = { n: 0, sx: 0, sy: 0 });
    L.n++; L.sx += x; L.sy += y;
  }
  g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineWidth = 2; g.setLineDash([6, 5]);
  g.beginPath();
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    const i = tileIdx(x, y);
    if (state.region[i] > state.stage || T(x, y) === SEA) continue;
    if (x + 1 < MAP_W && state.region[i + 1] > state.stage && T(x + 1, y) !== SEA) { g.moveTo((x + 1) * P, y * P); g.lineTo((x + 1) * P, (y + 1) * P); }
    if (x > 0 && state.region[i - 1] > state.stage && T(x - 1, y) !== SEA) { g.moveTo(x * P, y * P); g.lineTo(x * P, (y + 1) * P); }
    if (y + 1 < MAP_H && state.region[i + MAP_W] > state.stage && T(x, y + 1) !== SEA) { g.moveTo(x * P, (y + 1) * P); g.lineTo((x + 1) * P, (y + 1) * P); }
    if (y > 0 && state.region[i - MAP_W] > state.stage && T(x, y - 1) !== SEA) { g.moveTo(x * P, y * P); g.lineTo((x + 1) * P, y * P); }
  }
  g.stroke(); g.setLineDash([]);
  R.lockLabels = Object.keys(labels).map((r) => ({ stage: +r, x: labels[r].sx / labels[r].n, y: labels[r].sy / labels[r].n }));
  R.terrain = c; R.terrainKey = key;
  return c;
}

// Roads as rounded ribbons: straight pieces, curved corners, round ends and junctions.
function roadsDraw(ctx, state, R, view, tiles, colFn) {
  const z = view.z;
  const has = (x, y) => tiles(x, y);
  for (const pass of [0, 1]) {
    ctx.strokeStyle = pass ? PAL.road : PAL.roadEdge;
    ctx.fillStyle = ctx.strokeStyle;
    ctx.lineWidth = z * (pass ? 0.56 : 0.72);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
      if (!has(x, y)) continue;
      if (colFn) { const c = colFn(x, y, pass); if (c) { ctx.strokeStyle = c; ctx.fillStyle = c; } }
      const p = flatToScreen(R, view, x + 0.5, y + 0.5);
      if (p.x < -z || p.y < -z || p.x > R.w + z || p.y > R.h + z) continue;
      const n = [has(x + 1, y), has(x, y + 1), has(x - 1, y), has(x, y - 1)];
      const cnt = n.filter(Boolean).length;
      const ends = [[z / 2, 0], [0, z / 2], [-z / 2, 0], [0, -z / 2]];
      ctx.beginPath();
      if (cnt === 2 && n[0] !== n[2]) {
        const a = n.indexOf(true), b = n.lastIndexOf(true);
        ctx.moveTo(p.x + ends[a][0], p.y + ends[a][1]);
        ctx.quadraticCurveTo(p.x, p.y, p.x + ends[b][0], p.y + ends[b][1]);
      } else if (cnt === 0) {
        ctx.moveTo(p.x - 0.01, p.y); ctx.lineTo(p.x + 0.01, p.y);
      } else {
        for (let k = 0; k < 4; k++) if (n[k]) { ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + ends[k][0], p.y + ends[k][1]); }
      }
      ctx.stroke();
    }
  }
}

function rr(ctx, x, y, w, h, r, fill, stroke) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}

function pileDraw(ctx, x, y, z, n, color, cap) {
  const s = z * 0.17;
  for (let k = 0; k < Math.min(n, cap || 6); k++) {
    const col = k % 3, row = Math.floor(k / 3);
    rr(ctx, x + col * (s + 1.5), y - row * (s * 0.8), s, s, s * 0.25, color, 'rgba(0,0,0,0.25)');
  }
}

function homeDraw(ctx, b, p, z) {
  const wall = WALLS[b.id % WALLS.length], roof = ROOFS[(b.id * 7) % ROOFS.length];
  if (b.level >= 3) rr(ctx, p.x + z * 0.04, p.y + z * 0.04, z * 0.92, z * 0.92, z * 0.18, '#b9dd8c');
  const ins = b.level === 1 ? 0.16 : b.level === 2 ? 0.08 : 0.2;
  const x = p.x + z * ins, y = p.y + z * ins, w = z * (1 - 2 * ins), h = z * (1 - 2 * ins);
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(x + z * 0.05, y + z * 0.06, w, h);
  rr(ctx, x, y + h * 0.55, w, h * 0.45, 2, wall);
  rr(ctx, x - 1, y, w + 2, h * 0.6, 2, roof);
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(x - 1, y, w + 2, h * 0.28);
  ctx.fillStyle = '#5b3a29'; ctx.fillRect(x + w * 0.42, y + h * 0.76, w * 0.16, h * 0.24);
  if (b.level >= 2) { ctx.fillStyle = '#4a6b74'; ctx.fillRect(x + w * 0.12, y + h * 0.66, w * 0.18, h * 0.12); ctx.fillRect(x + w * 0.7, y + h * 0.66, w * 0.18, h * 0.12); ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y + h * 0.58, w, 2); }
  if (!b.res) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x - 1, y, w + 2, h); }
}

function fieldDraw(ctx, b, x, y, w, h, z, col, dot) {
  rr(ctx, x + 2, y + 2, w - 4, h - 4, z * 0.12, '#c7a46b');
  const rows = Math.round(w / (z * 0.33));
  for (let k = 0; k < rows; k++) {
    const rx = x + z * 0.2 + k * (w - z * 0.4) / Math.max(1, rows - 1);
    ctx.strokeStyle = col; ctx.lineWidth = z * 0.16; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(rx, y + z * 0.25); ctx.lineTo(rx, y + h - z * 0.25); ctx.stroke();
    if (dot) for (let j = 0; j < h / z * 2; j++) { ctx.fillStyle = dot; ctx.beginPath(); ctx.arc(rx, y + z * 0.4 + j * z * 0.5, z * 0.07, 0, 7); ctx.fill(); }
  }
}

function buildingDraw(ctx, state, b, R, view) {
  const z = view.z, def = BUILDINGS[b.type];
  const p = flatToScreen(R, view, b.x, b.y), w = b.w * z, h = b.h * z;
  if (p.x > R.w + z || p.y > R.h + z || p.x + w < -z || p.y + h < -z) return;
  if (b.type === 'casita') { homeDraw(ctx, b, p, z); return; }
  if (b.type === 'pier') {
    rr(ctx, p.x, p.y + z * 0.2, w + z * 0.1, h * 0.6, 3, BCOL.pier, '#6e5234');
    ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1;
    for (let k = 1; k < 9; k++) { ctx.beginPath(); ctx.moveTo(p.x + k * w / 9, p.y + z * 0.2); ctx.lineTo(p.x + k * w / 9, p.y + z * 0.8); ctx.stroke(); }
    // The schooner at the pier.
    const sx = p.x - z * 0.2, sy = p.y + z * 0.95;
    ctx.fillStyle = '#7a4f2c'; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + z * 2.6, sy); ctx.lineTo(sx + z * 2.3, sy + z * 0.7); ctx.lineTo(sx + z * 0.3, sy + z * 0.7); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f5efe0'; rr(ctx, sx + z * 0.6, sy + z * 0.1, z * 0.5, z * 0.4, 2, '#f5efe0'); rr(ctx, sx + z * 1.5, sy + z * 0.1, z * 0.5, z * 0.4, 2, '#f5efe0');
    return;
  }
  ctx.fillStyle = 'rgba(0,0,0,0.16)'; ctx.fillRect(p.x + z * 0.12, p.y + z * 0.14, w - z * 0.1, h - z * 0.1);
  if (b.type === 'grove') fieldDraw(ctx, b, p.x, p.y, w, h, z, '#4e9a45', '#f29c38');
  else if (b.type === 'cane') fieldDraw(ctx, b, p.x, p.y, w, h, z, '#6fb84a');
  else if (b.type === 'tobacco') fieldDraw(ctx, b, p.x, p.y, w, h, z, '#8aa83e', '#c9b45a');
  else if (b.type === 'market') {
    rr(ctx, p.x + 2, p.y + 2, w - 4, h - 4, z * 0.15, '#efe4c8', '#cdbb94');
    const cols = ['#d9534f', '#2f8f8f', '#e0a33a', '#4f74b8'];
    for (let k = 0; k < 4; k++) {
      const sx = p.x + z * 0.18 + (k % 2) * z * 0.95, sy = p.y + z * 0.18 + Math.floor(k / 2) * z * 0.95;
      rr(ctx, sx, sy, z * 0.7, z * 0.55, 3, cols[k]);
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      for (let j = 0; j < 3; j++) ctx.fillRect(sx + z * (0.08 + j * 0.22), sy, z * 0.1, z * 0.55);
    }
  } else {
    const ins = z * 0.08;
    rr(ctx, p.x + ins, p.y + ins, w - 2 * ins, h - 2 * ins, z * 0.14, BCOL[b.type] || '#ccc', 'rgba(0,0,0,0.25)');
    ctx.fillStyle = 'rgba(255,255,255,0.16)'; ctx.fillRect(p.x + ins, p.y + ins, w - 2 * ins, (h - 2 * ins) * 0.42);
    if (b.type === 'distillery') { rr(ctx, p.x + w * 0.72, p.y + h * 0.1, z * 0.28, z * 0.28, 3, '#6b2f1f'); }
    if (b.type === 'residence') {
      ctx.fillStyle = ['#c8553d', '#b85042', '#9c3d2e', '#7e2f24'][Math.min(3, b.level || 0)];
      ctx.beginPath(); ctx.moveTo(p.x + w * 0.1, p.y + h * 0.55); ctx.lineTo(p.x + w * 0.5, p.y + h * 0.12); ctx.lineTo(p.x + w * 0.9, p.y + h * 0.55); ctx.closePath(); ctx.fill();
    }
    const icon = def.icon || (b.type === 'residence' ? 'home' : 'home');
    const light = ['chapel', 'clinic', 'residence'].includes(b.type);
    iconDraw(ctx, icon, p.x + w / 2, p.y + h * (b.type === 'residence' ? 0.72 : 0.5), Math.min(w, h) * 0.42, light ? '#8a6a4a' : 'rgba(255,255,255,0.92)');
  }
  // Stock you can see: the yard (output) at the bottom right, the inputs at the bottom left.
  if (def.kind === 'producer' && b.yard > 0) pileDraw(ctx, p.x + w - z * 0.72, p.y + h - z * 0.3, z, b.yard, GOODS[def.makes].color);
  if (def.uses) { const g = Object.keys(def.uses)[0]; if (b.inp[g] >= 1) pileDraw(ctx, p.x + z * 0.12, p.y + h - z * 0.3, z, Math.floor(b.inp[g]), GOODS[g].color); }
  if (def.kind === 'market') {
    let k = 0;
    for (const g of ['fish', 'fruit', 'bread', 'rum']) if (b.stock[g] >= 1) { pileDraw(ctx, p.x + z * 0.15 + k * z * 0.9, p.y + h - z * 0.28, z, Math.ceil(b.stock[g] / 2), GOODS[g].color, 3); k++; }
  }
  if (def.kind === 'harbor') {
    let k = 0;
    for (const g in b.stock) if (b.stock[g] >= 1) { pileDraw(ctx, p.x + z * 0.12 + k * z * 0.65, p.y + h - z * 0.3, z, Math.ceil(b.stock[g]), GOODS[g].color, 3); k++; }
  }
  if (!b.open) {
    ctx.fillStyle = 'rgba(60,60,60,0.45)'; ctx.fillRect(p.x, p.y, w, h);
    badgeDraw(ctx, p.x + w / 2, p.y + h / 2, 'Closed', z);
  }
}

function badgeDraw(ctx, x, y, text, z) {
  ctx.font = '600 ' + Math.max(10, Math.round(z * 0.3)) + 'px system-ui, sans-serif';
  const tw = ctx.measureText(text).width + 10, th = Math.max(16, z * 0.42);
  rr(ctx, x - tw / 2, y - th / 2, tw, th, th / 2, 'rgba(255,250,240,0.95)', 'rgba(0,0,0,0.2)');
  ctx.fillStyle = PAL.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y + 0.5);
}

// A small bubble above a building with an icon (and optional short text).
function bubbleDraw(ctx, x, y, icon, z, warn, text) {
  const s = Math.max(22, z * 0.62);
  ctx.font = '700 ' + Math.round(s * 0.42) + 'px system-ui, sans-serif';
  const tw = text ? ctx.measureText(text).width + 6 : 0;
  const bw = s + tw;
  rr(ctx, x - bw / 2, y - s, bw, s * 0.86, s * 0.3, warn ? '#fff4f0' : 'rgba(255,255,255,0.92)', warn ? '#d9534f' : 'rgba(0,0,0,0.2)');
  ctx.fillStyle = warn ? '#fff4f0' : 'rgba(255,255,255,0.92)';
  ctx.beginPath(); ctx.moveTo(x - 4, y - s * 0.15); ctx.lineTo(x + 4, y - s * 0.15); ctx.lineTo(x, y - s * 0.02); ctx.fill();
  iconDraw(ctx, icon, x - bw / 2 + s / 2, y - s * 0.57, s * 0.56, warn ? '#c0392b' : '#56707a');
  if (text) { ctx.fillStyle = warn ? '#c0392b' : PAL.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(text, x - bw / 2 + s - 2, y - s * 0.56); }
}

// What a workplace shows above itself when something is wrong.
function bProblemMark(state, b) {
  const def = BUILDINGS[b.type];
  if (!def.jobs || !b.open) return null;
  if (b.workers < def.jobs && state.workforce > 0) return { icon: 'worker', text: b.workers + '/' + def.jobs, warn: b.workers === 0 };
  if (def.kind === 'producer') {
    if (b.blocked === 'yard') return { icon: 'full', warn: takerState(state, b) !== 'full' };
    if (b.blocked === 'input') return { icon: NEED_ICONS[Object.keys(def.uses)[0]] || GOOD_ICON[Object.keys(def.uses)[0]] || 'full', warn: true };
  }
  return null;
}
const GOOD_ICON = { cane: 'cane', flour: 'bread', tobacco: 'leaf', logs: 'tree' };

function cartsDraw(ctx, state, R, view) {
  const z = view.z;
  for (const c of state.carts) {
    if (c.st === 'idle' || !c.path) continue;
    const k = Math.min(c.path.length - 1, Math.floor(c.pos)), f = c.pos - k;
    const a = c.path[k], b = c.path[Math.min(c.path.length - 1, k + 1)];
    const ax = a % MAP_W, ay = (a / MAP_W) | 0, bx = b % MAP_W, by = (b / MAP_W) | 0;
    const tx = ax + (bx - ax) * f + 0.5, ty = ay + (by - ay) * f + 0.5;
    const side = c.st === 'go' ? 0.12 : -0.12;
    const p = flatToScreen(R, view, tx + (by - ay) * side, ty - (bx - ax) * side);
    const horiz = Math.abs(bx - ax) >= Math.abs(by - ay);
    const cw = z * (horiz ? 0.5 : 0.32), ch = z * (horiz ? 0.32 : 0.5);
    rr(ctx, p.x - cw / 2, p.y - ch / 2, cw, ch, 3, '#7a5534', 'rgba(0,0,0,0.3)');
    if (c.st === 'go' && c.good) rr(ctx, p.x - cw * 0.3, p.y - ch * 0.3, cw * 0.6, ch * 0.6, 2, GOODS[c.good].color);
  }
}

function walkersDraw(ctx, state, R, view) {
  if (!state.walk) return;
  for (const w of state.walk) {
    if (w.pos < 0) continue;
    const k = Math.min(w.path.length - 1, Math.floor(w.pos)), f = w.pos - k;
    const a = w.path[k], b = w.path[Math.min(w.path.length - 1, k + 1)];
    const tx = (a % MAP_W) + ((b % MAP_W) - (a % MAP_W)) * f + 0.5 + w.off * 0.4;
    const ty = ((a / MAP_W) | 0) + (((b / MAP_W) | 0) - ((a / MAP_W) | 0)) * f + 0.5 + w.off * 0.3;
    const p = flatToScreen(R, view, tx, ty);
    ctx.fillStyle = w.arriving ? '#2b4b5a' : '#8c8c8c';
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(2, view.z * 0.09), 0, 7); ctx.fill();
  }
}

function ghostDraw(ctx, state, R, view, ui) {
  const z = view.z;
  if (ui.stroke && ui.stroke.length) {
    const plan = roadPlan(state, ui.stroke);
    const badSet = new Set(plan.bad.map((b) => b.i)), set = new Set(ui.stroke);
    roadsDraw(ctx, state, R, view, (x, y) => inMap(x, y) && set.has(tileIdx(x, y)), (x, y, pass) => (badSet.has(tileIdx(x, y)) ? (pass ? 'rgba(225,80,70,0.8)' : 'rgba(150,40,30,0.8)') : (pass ? 'rgba(250,236,200,0.95)' : 'rgba(90,170,90,0.9)')));
    const last = ui.stroke[ui.stroke.length - 1];
    const p = flatToScreen(R, view, (last % MAP_W) + 0.5, ((last / MAP_W) | 0) - 0.2);
    const afford = state.money >= plan.cost;
    const text = plan.bad.length ? plan.bad[0].why : (plan.add.length ? '$' + plan.cost + ' · ' + plan.add.length + ' tiles' + (afford ? '' : ' · not enough money') : 'Already a road');
    labelDraw(ctx, p.x, p.y - z * 0.4, text, !plan.bad.length && afford);
    return;
  }
  const g = ui.ghost;
  if (!g) return;
  if (g.remove) {
    const r = g.info;
    if (r.b) { const p = flatToScreen(R, view, r.b.x, r.b.y); rr(ctx, p.x, p.y, r.b.w * z, r.b.h * z, 4, 'rgba(225,80,70,0.35)', '#c0392b'); }
    else if (r.road !== undefined) { const p = flatToScreen(R, view, r.road % MAP_W, (r.road / MAP_W) | 0); rr(ctx, p.x, p.y, z, z, 4, 'rgba(225,80,70,0.35)', '#c0392b'); }
    const p = flatToScreen(R, view, g.x + 0.5, g.y - 0.2);
    labelDraw(ctx, p.x, p.y - z * 0.3, r.why || (g.armed ? 'Tap again to remove · +$' + r.refund : 'Remove · +$' + r.refund), !r.why);
    return;
  }
  const def = BUILDINGS[g.type];
  const p = flatToScreen(R, view, g.x, g.y);
  rr(ctx, p.x, p.y, def.w * z, def.h * z, 5, g.why ? PAL.bad : PAL.ok, g.why ? '#c0392b' : '#2e8b3e');
  iconDraw(ctx, def.icon, p.x + def.w * z / 2, p.y + def.h * z / 2, Math.min(def.w, def.h) * z * 0.5, 'rgba(255,255,255,0.95)');
  const n = bForecast(state, g.type);
  const text = g.why || (def.name + ' · $' + def.cost + ' · ' + (n >= 0 ? '+$' + n : '−$' + -n) + ' a month');
  labelDraw(ctx, p.x + def.w * z / 2, p.y - z * 0.35, text, !g.why);
}

function labelDraw(ctx, x, y, text, ok) {
  ctx.font = '600 14px system-ui, sans-serif';
  const tw = ctx.measureText(text).width + 18;

// "Opens at Village": on the locked land nearest the middle of the screen, clear of the bars.
function lockLabelsDraw(ctx, state, R, view) {
  const best = {};
  const t0 = flatToTile(R, view, 0, 150), t1 = flatToTile(R, view, R.w, R.h - 190);
  const mid = flatToTile(R, view, R.w / 2, R.h / 2);
  for (let y = Math.max(0, Math.floor(t0.y)); y < Math.min(MAP_H, Math.ceil(t1.y)); y++) {
    for (let x = Math.max(1, Math.floor(t0.x) + 2); x < Math.min(MAP_W - 1, Math.ceil(t1.x) - 2); x++) {
      const i = tileIdx(x, y), r = state.region[i];
      if (r <= state.stage || state.terrain[i] === SEA) continue;
      const d = Math.hypot(x + 0.5 - mid.x, y + 0.5 - mid.y);
      if (!best[r] || d < best[r].d) best[r] = { d, x, y };
    }
  }
  for (const r in best) {
    const p = flatToScreen(R, view, best[r].x + 0.5, best[r].y + 0.5);
    labelDraw(ctx, p.x, p.y, 'Opens at ' + STAGES[Math.min(+r, STAGES.length - 1)].name, true);

function flatDraw(R, state, view, ui) {
  renderResize(R);
  const ctx = R.ctx, z = view.z;
  ctx.setTransform(R.dpr, 0, 0, R.dpr, 0, 0);
  ctx.fillStyle = PAL.seaDeep; ctx.fillRect(0, 0, R.w, R.h);
  const T = terrainPaint(R, state);
  const o = flatToScreen(R, view, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(T, o.x, o.y, MAP_W * z, MAP_H * z);
  lockLabelsDraw(ctx, state, R, view);
  roadsDraw(ctx, state, R, view, (x, y) => isRoad(state, x, y));
  const sel = ui.sel && bById(state, ui.sel);
  for (const b of state.b) buildingDraw(ctx, state, b, R, view);
  if (sel) { const p = flatToScreen(R, view, sel.x, sel.y); ctx.lineWidth = 3; rr(ctx, p.x - 3, p.y - 3, sel.w * z + 6, sel.h * z + 6, 8, null, null); ctx.strokeStyle = '#167a7a'; ctx.stroke(); }
  cartsDraw(ctx, state, R, view);
  walkersDraw(ctx, state, R, view);
  // Bubbles: what a home lacks (red), or what it needs next to level up (white, when zoomed in).
  for (const b of state.b) {
    const top = flatToScreen(R, view, b.x + b.w / 2, b.y);
    if (top.x < -40 || top.y < -40 || top.x > R.w + 40 || top.y > R.h + 40) continue;
    if (b.type === 'casita' && b.res) {
      if (b.lacks.length) bubbleDraw(ctx, top.x, top.y + z * 0.1, NEED_ICONS[b.lacks[0]], z, true);
      else if (b.wants.length === 1 && z >= 26) bubbleDraw(ctx, top.x, top.y + z * 0.1, NEED_ICONS[b.wants[0]], z * 0.85, false);
    } else {
      const m = bProblemMark(state, b);
      if (m) bubbleDraw(ctx, top.x, top.y + z * 0.1, m.icon, z, m.warn, m.text);
    }
  }
  const now = ui.now || 0;
  for (const f of ui.floaters || []) {
    const age = (now - f.t0) / 1600;
    if (age < 0 || age > 1) continue;
    const p = flatToScreen(R, view, f.x, f.y);
    ctx.globalAlpha = 1 - age * age;
    ctx.font = '700 ' + (f.big ? 16 : 13) + 'px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.strokeText(f.text, p.x, p.y - age * 30);
    ctx.fillStyle = f.color; ctx.fillText(f.text, p.x, p.y - age * 30);
    ctx.globalAlpha = 1;
  }
  ghostDraw(ctx, state, R, view, ui);
}

// ---- src/render/view.js
// The renderer the game draws with: the illustrated isometric one (render/iso.js, style B, chosen 9 Oct 2026), or
// the flat top-down placeholder (render/topdown.js) when the page is opened with ?r=flat.
// Interface used by the UI and the tests:
//   renderCreate(canvas) -> R;  renderDraw(R, state, view, ui);  screenToTile(R, view, sx, sy);  tileToScreen(R, view, tx, ty)
//   renderPick(R, view, state, sx, sy) -> the building drawn under that screen point (or null)
// view: { cx, cy, z }: the tile at the centre of the screen and the zoom (flat: px per tile; iso: half-width of a tile).

function renderKind() {
  try { return /[?&]r=flat(&|$)/.test(window.location.search) ? 'flat' : 'iso'; } catch (e) { return 'iso'; }
}

function renderCreate(canvas) {
  const kind = renderKind();
  const R = kind === 'flat' ? flatCreate(canvas) : ISO.create(canvas);
  R.kind = kind;
  return R;
}

function renderDraw(R, state, view, ui) {
  if (R.kind === 'flat') flatDraw(R, state, view, ui); else ISO.draw(R, state, view, ui);
}

function tileToScreen(R, view, tx, ty) { return R.kind === 'flat' ? flatToScreen(R, view, tx, ty) : ISO.toScreen(R, view, tx, ty); }

function screenToTile(R, view, sx, sy) { return R.kind === 'flat' ? flatToTile(R, view, sx, sy) : ISO.toTile(R, view, sx, sy); }

function renderPick(R, view, state, sx, sy) {
  if (R.kind !== 'flat') return ISO.pick(R, view, state, sx, sy);
  const t = flatToTile(R, view, sx, sy);
  return bAt(state, Math.floor(t.x), Math.floor(t.y));
}

// Every building drawn under a screen point, front first (block 4: a second tap on the same spot cycles through them).
function renderPickAll(R, view, state, sx, sy) {
  if (R.kind !== 'flat') return ISO.pickAll(R, view, state, sx, sy);
  const b = renderPick(R, view, state, sx, sy);
  return b ? [b] : [];
}

// What the renderer's canvases hold now and its worst-case plan, in MB (iso only; the flat one keeps no caches).
function renderMem(R) { return R.kind === 'flat' ? null : ISO.mem(R); }

// The page went to the background: let go of the big screen-sized pictures (drawn again on return).
function renderTrim(R) { if (R.kind !== 'flat') ISO.trim(R); }

// A new island: the iso renderer forgets its caches (the flat one has none to forget).
function renderReset(R) { if (R.kind !== 'flat') ISO.reset(R); }

  const pop = popCount(s), sc = stageConds(s);
  const boat = shipSettlers(s);
  const key = [s.money, pop, s.happy, s.month, s.stage, s.res, boat, s.ver, sc.conds.map((c) => c.label + c.ok).join()].join('|');
  if (key !== APP.hudKey) {
    APP.hudKey = key;
    $('date').textContent = dateLabel(s.month);
    $('sMoney').innerHTML = statHtml('coin', fmtMoney(s.money));
    $('sMoney').classList.toggle('neg', s.money < 0);
    $('sPeople').innerHTML = statHtml('people', pop);
    $('sHappy').innerHTML = statHtml('smile', s.happy + '%');
    // The goal: each condition with ✓; the people line says how many the next boat can bring; the landmark its price.
    const lm = sc.conds.find((c) => c.landmark && !c.ok);
    const tapRes = (sc.next && sc.next.goal && s.money >= TUNE.palaceCost) || (lm && sc.next.landmark && sc.next.landmark.res && !resWhy(s));
    $('pill').innerHTML = sc.next ? esc(STAGES[s.stage].name) + ' → ' + esc(sc.next.name) + ': ' +
      sc.conds.map((c) => '<span class="' + (c.ok ? 'ok' : 'no') + '">' + (c.ok ? '✓ ' : '') + esc(c.label) + '</span>' +
        (/ people$/.test(c.label) && !c.ok ? ' <small>(next boat: up to ' + boat + ')</small>' : '')).join(' · ') +
      (tapRes ? ' · tap the residence' : '') :
      esc(STAGES[s.stage].name) + (s.palace ? ' · the Governor\'s palace stands: the island is complete' : '');
    barPoor();
  }
  if (APP.barStage !== s.stage) barBuild();
  barHeight();
}

// One toast at a time, at least 5 s each; while one shows, only the newest waits (block 4: toasts of 3.3 s stacked at 3x).
function toastShow(text) {
  if (APP.toasts.length && APP.toasts[APP.toasts.length - 1] === text) return;
  APP.toasts = [text];
}

function toastTick(now) {
  const el = $('toast');
  if (now < APP.toastUntil) return;
  if (!APP.toasts.length) { el.classList.remove('show'); return; }
  el.textContent = APP.toasts.shift();
  el.classList.add('show');
  APP.toastUntil = now + 5200;
}

function receiptShow(r) {
  const s = APP.state, el = $('receipt');
  const rows = receiptLines(s, r).map(([label, n]) => '<div class="row' + (label.startsWith('  ') ? ' sub' : '') + '"><span>' + esc(label.trim()) + '</span><span class="' + (n < 0 ? 'neg' : n > 0 ? 'pos' : '') + '">' + fmtSigned(n) + '</span></div>').join('');
  el.innerHTML = '<div class="head"><span>Payday · ' + esc(MONTHS[r.month % 12].slice(0, 3)) + '</span><span class="' + (r.result < 0 ? 'neg' : 'pos') + '">' + fmtSigned(r.result) + '</span></div>' +
    '<div class="rows">' + rows + '<div class="row sum"><span>Result</span><span class="' + (r.result < 0 ? 'neg' : 'pos') + '">' + fmtSigned(r.result) + '</span></div></div>';
  el.classList.add('show');
  el.classList.remove('open');
  APP.receiptUntil = performance.now() + 4500;
}

function receiptTick(now) {
  const el = $('receipt');
  if (el.classList.contains('show') && now > APP.receiptUntil) el.classList.remove('show', 'open');
}

// Rosa's line: a tool's own hint first (no spot for it: the step that makes one), else the island's line.
function guideMsg() { return APP.ui.hint || APP.state.guide.msg; }

function guideRender() {
  const m = guideMsg(), el = $('guide');
  if (!m) { el.classList.remove('show'); APP.guideShown = ''; return; }
  const key = m.text + '|' + (m.btn || 'OK');
  if (key !== APP.guideShown) {
    // A new line: her button ignores taps for a moment, so a finger already on its way never hits the new button
    // (block 4: the button turned from Home to Show under her finger).
    APP.guideShown = key; APP.guideT = performance.now();
    el.classList.remove('fresh'); void el.offsetWidth; el.classList.add('fresh');
  }
  $('guideText').textContent = m.text;
  $('guideAct').textContent = m.btn || 'OK';
  el.classList.add('show');
}

function guideAct() {
  const m = guideMsg();
  if (!m || performance.now() - (APP.guideT || 0) < 900) return;
  const a = m.act || {};
  if (m === APP.ui.hint) {
    // the tool's hint: its button picks the tool that makes a spot (the hint stays until a spot exists)
    if (a.tool) toolSet(a.tool, true); else APP.ui.hint = null;
    guideRender();
    return;
  }
  if (a.tool) toolSet(a.tool);
  else if (a.select) {
    const b = bById(APP.state, a.select);
    if (b) { viewFocus(b.x + b.w / 2, b.y + b.h / 2); cardOpen(b.id); if (a.roads) roadsShow(b.id); }
  } else if (a.desk) deskOpen();
  if (!a.tool && !a.select && !a.desk) { guideDismiss(APP.state); }
  guideRender();
}

// The tool's hint follows the island: it goes once the tool has a spot again.
function hintCheck() {
  const h = APP.ui.hint;
  if (!h || !h.forTool) return;
  if (spotsFor(APP.state, h.forTool).n) { APP.ui.hint = null; toastShow('Now the ' + BUILDINGS[h.forTool].name.toLowerCase() + ' fits: tap ' + toolLabel(h.forTool) + ' and the lit tiles.'); guideRender(); }
}

// "✓ Done" sits beside the build bar while a tool is armed (above it when the screen is too narrow).
function donePlace() {
  const el = $('done'), bar = $('bar').getBoundingClientRect(), gap = 10, w = el.offsetWidth || 110, ins = safeInsets();
  const beside = window.innerWidth - ins.r - bar.right >= w + 2 * gap;
  document.body.classList.toggle('doneup', !beside);
  if (beside) { el.style.left = (bar.right + gap) + 'px'; el.style.right = 'auto'; el.style.bottom = (window.innerHeight - bar.bottom) + 'px'; }
  else { el.style.left = 'auto'; el.style.right = (gap + ins.r) + 'px'; el.style.bottom = (window.innerHeight - bar.top + gap) + 'px'; }
}

// ---- src/ui/bar.js
// The build bar: six tabs (Roads · Homes · Food · Industry · Services · Harbor) along the bottom and the open tab's
// buttons above them. The last-used tab stays open (remembered on this device); tapping the open tab folds its
// buttons away. Locked buildings show the stage that opens them; a dot marks a tab with something new this stage.

const BAR_TAB_KEY = 'isla-nova-tab';

// The tab a tool lives in.
function barGroupOf(tool) {
  if (tool === 'road' || tool === 'paved' || tool === 'remove') return 'roads';
  if (tool === 'palace') return 'services';
  return BUILDINGS[tool] ? BUILDINGS[tool].group : '';
}

// The buttons of one tab: what she can build now first, then only the nearest stage's locked ones (so a tab is never a
// wall of grey); 'remove' stays last on the Roads tab.
function barTools(s, group) {
  const all = barToolsAll(s, group), stageOf = (t) => (t.id === 'paved' ? PAVED_STAGE : t.id === 'palace' ? STAGES.length - 1 : BUILDINGS[t.id] ? BUILDINGS[t.id].stage : 0);
  const open = all.filter((t) => !t.locked && t.id !== 'remove'), locked = all.filter((t) => t.locked);
  const next = locked.length ? Math.min(...locked.map(stageOf)) : -1;
  return open.concat(locked.filter((t) => stageOf(t) === next), all.filter((t) => t.id === 'remove'));
}

// Every button of one tab in the bar's order: { id, name, icon, cost, locked, done }.
function barToolsAll(s, group) {
  const tools = [];
  if (group === 'roads') {
    tools.push({ id: 'road', name: 'Road', icon: 'road', cost: '$' + TUNE.roadCost + '/tile' });
    tools.push({ id: 'paved', name: 'Paved road', icon: 'paved', cost: '$' + TUNE.pavedCost + '/tile', locked: s.stage < PAVED_STAGE ? STAGES[PAVED_STAGE].name : '', price: TUNE.pavedCost });
    tools.push({ id: 'remove', name: 'Remove', icon: 'remove', cost: '' });
  }
  for (const t of BUILD_ORDER) {
    const d = BUILDINGS[t];
    if (d.group !== group) continue;
    tools.push({ id: t, name: d.short || d.name, icon: d.icon, cost: fmtMoney(d.cost), locked: d.stage > s.stage ? STAGES[d.stage].name : '', price: d.cost });
  }
  if (group === 'services') {
    const last = STAGES.length - 1;
    tools.push({ id: 'palace', name: 'Palace', icon: 'palace', cost: s.palace ? 'built' : fmtMoney(TUNE.palaceCost), locked: s.stage < last ? STAGES[last].name : '', price: s.palace ? 0 : TUNE.palaceCost });
  }
  return tools;
}

// A tab is "new" when it holds something the current stage opened and has not been opened since.
function barTabNew(s, group) {
  if (!s.stage || (APP.ui.tabSeen || {})[group] === s.stage) return false;
  return barToolsAll(s, group).some((t) => !t.locked && ((BUILDINGS[t.id] && BUILDINGS[t.id].stage === s.stage) ||
    (t.id === 'paved' && s.stage === PAVED_STAGE) || (t.id === 'palace' && s.stage === STAGES.length - 1)));
}

function barTabRead() {
  const v = storeGet(BAR_TAB_KEY);
  return BAR_GROUPS.some((g) => g.id === v) ? v : 'roads';
}

function barBuild() {
  const s = APP.state, bar = $('bar');
  if (!APP.ui.tab) APP.ui.tab = barTabRead();
  if (!APP.ui.tabSeen) APP.ui.tabSeen = {};
  const tab = APP.ui.tab;
  APP.ui.tabSeen[tab] = s.stage;
  const tools = barTools(s, tab);
  const tray = APP.ui.trayClosed ? '' : '<div class="tray" role="toolbar">' + tools.map((t) => '<button class="tool' + (t.locked ? ' locked' : '') + (t.id === 'remove' ? ' remove' : '') +
    '" data-tool="' + t.id + '"' + (t.locked ? ' aria-disabled="true"' : '') + '>' + iconSvg(t.icon) + '<span>' + esc(t.name) + '</span><small>' +
    (t.locked ? esc(t.locked) : t.cost ? esc(t.cost) : '&nbsp;') + '</small></button>').join('') + '</div>';
  const tabs = '<div class="tabs" role="tablist">' + BAR_GROUPS.map((g) => '<button class="tab' + (g.id === tab ? ' on' : '') + (barTabNew(s, g.id) ? ' new' : '') +
    '" role="tab" data-tab="' + g.id + '" aria-selected="' + (g.id === tab) + '">' + iconSvg(g.icon) + '<span>' + esc(g.name) + '</span></button>').join('') + '</div>';
  bar.innerHTML = tray + tabs;
  bar.querySelectorAll('.tool').forEach((b) => b.addEventListener('click', () => barToolTap(b.dataset.tool, b.classList.contains('locked'))));
  bar.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => barTabTap(b.dataset.tab)));
  APP.barStage = s.stage;
  barMark();
  barPoor();
  barHeight();
}

function barTabTap(group) {
  if (group === APP.ui.tab) APP.ui.trayClosed = !APP.ui.trayClosed;
  else { APP.ui.tab = group; APP.ui.trayClosed = false; storeSet(BAR_TAB_KEY, group); }
  barBuild();
}

// Opens the tab that holds a tool (when Rosa's button or a key picks it).
function barShow(tool) {
  const g = barGroupOf(tool);
  if (!g || (g === APP.ui.tab && !APP.ui.trayClosed)) return;
  APP.ui.tab = g; APP.ui.trayClosed = false; storeSet(BAR_TAB_KEY, g);
  barBuild();
}

function barToolTap(id, locked) {
  const s = APP.state;
  if (locked) {
    const st = id === 'paved' ? PAVED_STAGE : id === 'palace' ? STAGES.length - 1 : BUILDINGS[id].stage;
    toastShow((id === 'paved' ? 'Paved roads' : id === 'palace' ? "The Governor's palace" : BUILDINGS[id].name) + ' opens at ' + STAGES[st].name + '.');
    return;
  }
  if (id === 'palace') {
    // The palace is the residence's last stage: its card has the button.
    const r = s.b.find((b) => b.type === 'residence');
    toolSet('look');
    if (r) { viewFocus(r.x + 1, r.y + 1); cardOpen(r.id); }
    return;
  }
  const cur = APP.ui.tool === 'road' ? (s._roadKind === 2 ? 'paved' : 'road') : APP.ui.tool;
  if (cur === id) { toolSet('look'); return; }
  toolSet(id);
}

// Picks a tool: 'look', 'road', 'paved' (the road tool laying paved road), 'remove' or a building type.
// keepHint: the tool was picked from a tool's hint (Rosa: "Lay a road along the beach first"); the hint stays on.
function toolSet(tool, keepHint) {
  if (tool === 'paved' || tool === 'road') { APP.state._roadKind = tool === 'paved' ? 2 : 1; tool = 'road'; }
  APP.ui.tool = tool;
  APP.ui.ghost = null; APP.ui.stroke = null; APP.ui.strokeBlock = null;
  if (tool !== 'look') { barShow(tool === 'road' && APP.state._roadKind === 2 ? 'paved' : tool); cardClose(); }
  // a building with no spot in the open land: Rosa names the one step that makes one
  if (!keepHint) {
    const h = BUILDINGS[tool] ? noSpotHint(APP.state, tool) : null;
    APP.ui.hint = h ? Object.assign({ key: 'nospot', forTool: tool }, h) : null;
  }
  document.body.classList.toggle('armed', tool !== 'look');
  barMark();
  guideRender();
  donePlace();
}

function barMark() {
  const s = APP.state, t = APP.ui.tool;
  const on = t === 'road' ? (s._roadKind === 2 ? 'paved' : 'road') : t;
  $('bar').querySelectorAll('.tool').forEach((b) => b.classList.toggle('on', b.dataset.tool === on));
}

// Prices she cannot pay yet show in red; a building with no spot in the open land says the step that makes one
// ("road by the sea first") instead of its price.
function barPoor() {
  const s = APP.state;
  $('bar').querySelectorAll('.tool').forEach((b) => {
    const id = b.dataset.tool, small = b.querySelector('small');
    const price = id === 'paved' ? TUNE.pavedCost : id === 'palace' ? (s.palace ? 0 : TUNE.palaceCost) : id === 'road' ? TUNE.roadCost : BUILDINGS[id] ? BUILDINGS[id].cost : 0;
    const locked = b.classList.contains('locked');
    const h = !locked && BUILDINGS[id] ? noSpotHint(s, id) : null;
    if (small && !small.dataset.cost) small.dataset.cost = small.textContent;
    if (small) small.textContent = h ? h.short : small.dataset.cost;
    b.classList.toggle('nospot', !!h);
    b.classList.toggle('poor', !locked && (!!h || (price > 0 && s.money < price)));
  });
}

// The panels above the bar sit on its real height (one row folded, two rows open).
function barHeight() {
  const h = $('bar').offsetHeight, w = $('bar').offsetWidth + 'x' + window.innerWidth;
  if (h && h !== APP.barH) { APP.barH = h; document.documentElement.style.setProperty('--bar-h', h + 'px'); }
  if (w !== APP.barW) { APP.barW = w; donePlace(); }
}

// ---- src/ui/cards.js
// Cards and sheets: the building card, the Governor's desk, the message log, the stage card, the year card, happiness.

function bStatus(s, b) {
  const def = BUILDINGS[b.type];
  if (!b.open) return { text: 'Closed: no wages, no output, half the upkeep.' };
  if (def.jobs && b.workers === 0) return { text: 'No workers. Half of the people work: build homes.' };
  if (def.kind === 'producer') {
    if (b.blocked === 'yard') return { text: yardText(s, b) };
    if (b.blocked === 'input') { const g = Object.keys(def.uses)[0]; return { text: 'No ' + GOODS[g].name.toLowerCase() + ': build ' + inputSource(g) + '.' }; }
  }
  if (def.jobs && b.workers < def.jobs) return { text: 'Short of workers (' + b.workers + '/' + def.jobs + '): works at ' + Math.round(100 * b.workers / def.jobs) + ' %. Build homes.' };
  if (def.kind === 'market' && !marketHomes(s, b.id).length) return { text: 'No homes in reach: within ' + TUNE.marketReach + ' tiles in a straight line and joined to it by road.' };
  // block 4 (the playtest): a market with empty shelves said "Working." in green
  if (def.kind === 'market' && marketFood(b) < 1) return { text: 'No food on the shelves: build a fruit grove or a fishing hut, joined to it by road.' };
  if (def.gives === 'light') return { text: 'Lit: the ship pays ' + Math.round(TUNE.lighthouseBonus * 100) + ' % more for everything (rum ' + money$(exportPrice(s, 'rum')) + ' instead of ' + money$(GOODS.rum.price) + '). One lighthouse is enough.', good: true };
  if (def.kind === 'service' && !serviceHomes(s, b.id).length) return { text: 'No homes in reach: within ' + bReach(def) + ' tiles in a straight line and joined to it by road.' };
  if (def.gives === 'opera') return { text: 'Homes within ' + bReach(def) + ' tiles pay ' + Math.round(TUNE.operaRent * 100) + ' % more rent.', good: true };
  if (b.type === 'quay') return { text: 'Two ships a month, each buying up to ' + def.buys + ' of a good; twice the settlers. The landmark of the ' + STAGES[STAGES.length - 1].name + '.', good: true };
  if (b.type === 'cathedral') return { text: 'A church for homes within ' + bReach(def) + ' tiles, and +' + TUNE.cathedralHappy + ' happiness for the island.', good: true };
  return { text: 'Working.', good: true };
}

function needList(s, h, level) {
  return LEVELS[level].needs.map((n) => '<span class="' + (homeHas(s, h, n) ? 'y">✓ ' : 'n">✗ ') + esc(NEED_NAMES[n]) + '</span>').join(' · ');
}

function cardHtml(s, b) {
  const def = BUILDINGS[b.type], x = bNumber(s, b);
  const head = '<button class="x" id="cardX" aria-label="Close">' + iconSvg('close') + '</button>';
  if (def.kind === 'fixed') {
    if (b.type === 'pier') {
      const q = quayOn(s);
      const t = 'Next boat: up to ' + shipSettlers(s) + ' settlers (' + TUNE.arrivalBase + ' + ' + Math.round(TUNE.arrivalPct * 100) + ' % of the people, at most ' + TUNE.arrivalCap +
        (q ? '; the steamship quay doubles it, at most ' + TUNE.quayArrivalCap : '; a steamship quay doubles it') + '). They come when homes have free beds and happiness is ' + TUNE.happyArrive +
        ' or more. The ship also brings flour and buys what the harbor holds.';
      return head + '<h3>' + iconSvg('anchor') + 'Pier</h3><p class="why">' + esc(t) + '</p>';
    }
    // The residence: each level is bought here and is the landmark of the next stage; the palace is the last goal.
    const last = STAGES.length - 1, next = resNext(s), name = s.palace ? "Governor's palace" : RESIDENCE[s.res || 0].name;
    let t, btn = '';
    if (s.palace) t = 'The last stage of the residence: +' + TUNE.palaceHappy + ' happiness for the island.';
    else if (next) {
      const lmFor = STAGES.findIndex((st) => st.landmark && st.landmark.res === (s.res || 0) + 1);
      t = name + '. Next: the ' + next.name + ', ' + money$(next.cost) + (lmFor > 0 ? ': the landmark ' + STAGES[lmFor].name + ' needs' : '') + (next.stage > s.stage ? ' (opens at ' + STAGES[next.stage].name + ')' : '') + '. The palace comes at ' + STAGES[last].name + '.';
      if (next.stage <= s.stage) btn = '<div class="btns"><button id="cardRes"' + (s.money < next.cost ? ' class="poor"' : '') + '>Build the ' + esc(next.name) + ' · ' + money$(next.cost) + '</button></div>';
    } else {
      t = name + ". Its last stage is the Governor's palace: " + money$(TUNE.palaceCost) + ', +' + TUNE.palaceHappy + ' happiness for the island' + (s.stage < last ? ' (opens at ' + STAGES[last].name + ').' : '.');
      if (s.stage >= last) btn = '<div class="btns"><button id="cardPalace"' + (s.money < TUNE.palaceCost ? ' class="poor"' : '') + '>Build the palace · ' + money$(TUNE.palaceCost) + '</button></div>';
    }
    return head + '<h3>' + iconSvg(s.palace ? 'palace' : 'home') + esc(name) + '</h3><p class="why">' + esc(t) + '</p>' + btn;
  }
  let h = head;
  if (def.kind === 'deco') {
    const homes = serviceHomes(s, b.id).length;
    h += '<h3>' + iconSvg(def.icon) + esc(def.name) + '</h3><div class="num">$0 a month</div><div class="why">no workers, no upkeep</div>';
    h += '<div class="line"><span>Homes within ' + def.reach + ' tiles</span><span>' + homes + '</span></div>';
    h += '<p class="note good">' + esc('Homes near a decoration are happier (up to +' + TUNE.decoHappy + ' for the island, by the share of homes near one). Townhouses and Mansions need one nearby. No road needed.') + '</p>';
    return h + cardButtons(s, b);
  }
  if (def.kind === 'home') {
    const lv = LEVELS[b.level], next = LEVELS[b.level + 1];
    h += '<h3>' + iconSvg('home') + esc(lv.name) + '</h3>';
    const opera = operaNear(s, b);
    h += '<div class="num ' + (x.n > 0 ? 'pos' : '') + '">' + fmtSigned(x.n) + ' a month</div><div class="why">rent from ' + b.res + ' / ' + lv.people + ' people' + (opera ? ' · +' + Math.round(TUNE.operaRent * 100) + ' %: the opera is near' : '') + '</div>';
    h += '<div class="line"><span>Needs</span><span>' + needList(s, b, b.level) + '</span></div>';
    if (next) h += '<div class="line"><span>To become a ' + esc(next.name) + ' (' + next.people + ' people, ' + money$(next.rent) + ')</span><span>' + (next.stage <= s.stage ? needList(s, b, b.level + 1) : 'opens at ' + esc(STAGES[next.stage].name)) + '</span></div>';
    const miss = b.miss || [], missNext = b.missNext || [];
    const rc = homeReach(s)[b.id];
    if (rc && rc.cut.length) {
      const names = [...new Set(rc.cut.map((id) => (BUILDINGS[(bById(s, id) || {}).type] || {}).name).filter(Boolean))].map((n) => n.toLowerCase());
      h += '<p class="note">' + esc('Near ' + listAnd(names.map((n) => 'a ' + n)) + ', but no road joins them.') + ' <button class="link" id="cardRoads">Show roads</button></p>';
    }
    if (APP.ui.downSeen && APP.ui.downSeen.id === b.id) h += '<p class="note">' + esc('It stepped down a level in ' + dateLabel(APP.ui.downSeen.m) + ': it lacked what is marked ✗ above.') + '</p>';
    if (b.res && miss.length) h += '<p class="note">Lacks ' + esc(miss.map((n) => NEED_NAMES[n]).join(', ')) + '. ' + (b.level > 1 ? 'After ' + TUNE.levelDownMonths + ' months it becomes a ' + LEVELS[b.level - 1].name.toLowerCase() + ' again.' : 'People leave when happiness falls below ' + TUNE.happyLeave + '.') + '</p>';
    else if (next && next.stage <= s.stage && missNext.length === 0 && b.res) h += '<p class="note good">Has everything: becomes a ' + esc(next.name) + ' after ' + levelUpMonths(b.level) + ' months like this' + (b.up ? ' (' + b.up + ' so far)' : '') + '.</p>';
  } else {
    h += '<h3>' + iconSvg(def.icon) + esc(def.name) + '</h3>';
    const parts = [];
    if (x.wages) parts.push('wages $' + x.wages);
    if (x.upkeep) parts.push('upkeep $' + x.upkeep);
    if (x.exports) parts.push('ship +$' + x.exports);
    if (x.imports) parts.push('flour −$' + x.imports);
    h += '<div class="num ' + (x.n < 0 ? 'neg' : 'pos') + '">' + fmtSigned(x.n) + ' a month</div><div class="why">' + esc(parts.join(' · ') || 'no costs') + '</div>';
    if (def.jobs) h += '<div class="line"><span>Workers</span><span>' + b.workers + ' / ' + def.jobs + '</span></div>';
    if (def.kind === 'producer') {
      const uses = def.uses ? ' from ' + Object.keys(def.uses).map((g) => def.uses[g] * def.rate + ' ' + GOODS[g].name.toLowerCase()).join(', ') : '';
      h += '<div class="line"><span>Makes a month</span><span>' + def.rate + ' ' + esc(GOODS[def.makes].name.toLowerCase()) + esc(uses) + '</span></div>';
      h += '<div class="line"><span>Yard</span><span>' + Math.floor(b.yard) + ' / ' + TUNE.yardCap + ' ' + esc(GOODS[def.makes].name.toLowerCase()) + '</span></div>';
      if (def.uses) for (const g in def.uses) h += '<div class="line"><span>' + esc(GOODS[g].name) + ' in stock</span><span>' + Math.floor(b.inp[g] || 0) + ' / ' + TUNE.inputCap + '</span></div>';
      h += '<div class="line"><span>Goes to</span><span>' + esc(GOOD_TAKER[def.makes]) + '</span></div>';
      const per = PER_PERSON[goodNeed(def.makes)];
      if (per) h += '<div class="line"><span>Enough for</span><span>about ' + Math.round(def.rate / per) + ' people (each eats 1 a month per ' + Math.round(1 / per) + ')</span></div>';
    }
    if (def.kind === 'market') {
      h += '<div class="line"><span>Homes in reach</span><span>' + marketHomes(s, b.id).length + '</span></div>';
      const shelf = Object.keys(b.stock).filter((g) => b.stock[g] >= 1);
      h += '<div class="line"><span>On the shelves</span><span>' + (shelf.length ? shelf.map((g) => Math.floor(b.stock[g]) + ' ' + GOODS[g].name.toLowerCase()).join(' · ') : '') +
        (marketFood(b) < 1 ? (shelf.length ? ' · ' : '') + '<span class="n">No food on the shelves</span>' : '') + '</span></div>';
    }
    if (def.kind === 'service' && def.gives !== 'light') h += '<div class="line"><span>Homes in reach (' + bReach(def) + ' tiles)</span><span>' + serviceHomes(s, b.id).length + '</span></div>';
    if (def.kind === 'harbor') {
      const wait = Object.keys(b.stock).filter((g) => b.stock[g] >= 1);
      h += '<div class="line"><span>For the ship</span><span>' + (wait.length ? wait.map((g) => Math.floor(b.stock[g]) + ' ' + GOODS[g].name.toLowerCase() + ' (' + money$(Math.floor(b.stock[g]) * exportPrice(s, g)) + ')').join(' · ') : 'nothing yet') + '</span></div>';
      h += '<div class="line"><span>The ship buys</span><span>up to ' + (def.buys || TUNE.shipBuys) + ' of each good' + (def.ships > 1 ? ', twice a month' : ' a month') + (lighthouseOn(s) ? ' · +' + Math.round(TUNE.lighthouseBonus * 100) + ' %: lighthouse' : '') + '</span></div>';
      h += '<div class="line"><span>Last month</span><span>sold ' + fmtMoney(b.lastSold || 0) + ' · flour ' + fmtMoney(b.lastBought || 0) + '</span></div>';
    }
    const st = bStatus(s, b);
    h += '<p class="note' + (st.good ? ' good' : '') + '">' + esc(st.text) + (cutOff(s, b) ? ' <button class="link" id="cardRoads">Show roads</button>' : '') + '</p>';
  }
  return h + cardButtons(s, b);
}

// Remove and Shut down, each with a second tap to confirm (block 4: "Close it" sat where a map tap landed and shut the
// fishing hut). Shut down says what it saves and sits apart from ✕ and Remove.
function cardButtons(s, b) {
  const def = BUILDINGS[b.type], refund = Math.floor(def.cost * TUNE.refund), cf = APP.ui.confirm && APP.ui.confirm.id === b.id ? APP.ui.confirm.what : '';
  let h = '<div class="btns"><button class="danger' + (cf === 'remove' ? ' sure' : '') + '" id="cardRemove">' +(cf === 'remove' ? 'Tap again to remove · +' + money$(refund) : 'Remove · +' + money$(refund)) + '</button></div>';
  if (def.jobs) {
    const x = bNumber(s, b), save = x.wages + Math.round(def.cost * TUNE.upkeepPct * (1 - TUNE.closedUpkeep));
    if (b.open) h += '<div class="btns"><button class="shut' + (cf === 'shut' ? ' sure' : '') + '" id="cardOpen">' + (cf === 'shut' ? 'Tap again to shut it down' : 'Shut down · saves ' + money$(save) + ' a month') + '</button></div>';
    else h += '<div class="btns"><button class="shut" id="cardOpen">Open it again</button></div>';
  }
  return h;
}

// A button that needs a second tap within 4 s: the first arms it (the card redraws its words), the second acts.
function cardConfirm(id, what, act) {
  const c = APP.ui.confirm;
  if (c && c.id === id && c.what === what && performance.now() < c.until) { APP.ui.confirm = null; act(); return; }
  APP.ui.confirm = { id, what, until: performance.now() + 4000 };
  clearTimeout(APP.confirmTimer);
  APP.confirmTimer = setTimeout(() => { APP.ui.confirm = null; APP.cardKey = ''; if (APP.ui.sel) cardRender(); }, 4000);
  cardRender();
}

// What the bubbles over homes and workplaces say: a small legend (on a tap of a bubble).
function legendOpen(bub) {
  const s = APP.state, el = $('pop'), seen = [], rows = [];
  const add = (need, warn) => {
    const k = need + (warn ? '!' : '');
    if (!need || seen.includes(k)) return;
    seen.push(k);
    const n = (warn ? s.lackCount : s.wantCount) || {};
    const fix = needFix(s, need);
    rows.push('<div class="lg"><span class="bub' + (warn ? ' warn' : '') + '">' + iconSvg(NEED_ICONS[need] || 'home') + '</span><span>' +
      esc((warn ? 'Lacks ' : 'To grow: ') + NEED_NAMES[need] + ' · ' + plural(n[need] || 0, 'home', 'homes') + '. ' + fix.text.charAt(0).toUpperCase() + fix.text.slice(1) + '.') + '</span></div>');
  };
  if (bub && bub.home) add(bub.need, bub.warn);
  for (const q of (APP.R && APP.R.bubbles) || []) if (q.home) add(q.need, q.warn);
  el.innerHTML = '<b>Bubbles over homes</b><div class="why" style="font-size:13px;color:var(--ink2)">Red: a home lacks it (a House or better steps down after ' + TUNE.levelDownMonths +
    ' months). Light: it needs it to grow. One bubble per home, one per street for the same thing.</div>' + rows.slice(0, 5).join('') +
    '<div class="why" style="font-size:13px;color:var(--ink2);margin-top:4px">Over workplaces: workers 2/4 (short of workers: build homes), a full yard (nobody takes the goods), a missing input.</div>';
  el.classList.add('show');
  // the click a touch sends after the tap lands where the legend now is: ignore it
  const t0 = performance.now();
  el.onclick = () => { if (performance.now() - t0 > 500) el.classList.remove('show'); };
  clearTimeout(APP.popTimer);
  APP.popTimer = setTimeout(() => el.classList.remove('show'), 9000);
}

function cardOpen(id) {
  if (APP.ui.sel !== id) { APP.ui.roadShow = 0; APP.ui.confirm = null; }
  APP.ui.sel = id;
  APP.cardKey = '';
  // a home's level-down mark goes once she has looked at it
  const s = APP.state;
  if (s.downs && s.downs[id] !== undefined) { APP.ui.downSeen = { id, m: s.downs[id] }; delete s.downs[id]; }
  cardRender();
  $('card').classList.add('show');
  document.body.classList.add('carded');
  cardReveal(id);
}

// The card covers the lower half (portrait, phone) or the right side (landscape): if the building is under it, the
// view moves so it stays in sight with what the map draws around it (its reach, its road pieces).
function cardReveal(id) {
  const s = APP.state, b = bById(s, id), card = $('card').getBoundingClientRect();
  if (!b || !card.width) return;
  const p = tileToScreen(APP.R, APP.view, b.x + b.w / 2, b.y + b.h / 2), z = APP.view.z, W = window.innerWidth;
  if (W <= 900) {
    const top = ($('pill').getBoundingClientRect().bottom || 120) + 20, target = (top + card.top) / 2;
    if (p.y > card.top - 30 || p.y < top) { const k = (p.y - target) / z; APP.view.cx += k; APP.view.cy += k; viewClamp(); }
  } else if (p.x > card.left - 30) {
    const k = (p.x - card.left / 2) / (2 * z); APP.view.cx += k; APP.view.cy -= k; viewClamp();
  }
}

function cardClose() { APP.ui.sel = 0; APP.ui.roadShow = 0; APP.ui.confirm = null; APP.ui.downSeen = null; $('card').classList.remove('show'); document.body.classList.remove('carded'); }

function cardRender() {
  const s = APP.state, b = APP.ui.sel && bById(s, APP.ui.sel);
  if (!b) { cardClose(); return; }
  const html = cardHtml(s, b);
  if (html === APP.cardKey) return;
  APP.cardKey = html;
  const el = $('card');
  el.innerHTML = html;
  $('cardX').addEventListener('click', cardClose);
  const op = $('cardOpen');
  const flip = () => { b.open = !b.open; jobsAssign(s); s.ver++; toastShow(BUILDINGS[b.type].name + (b.open ? ' is open again.' : ' is shut down: no wages, half the upkeep.')); cardRender(); };
  if (op) op.addEventListener('click', () => { if (b.open) cardConfirm(b.id, 'shut', flip); else flip(); });
  const rd = $('cardRoads');
  if (rd) rd.addEventListener('click', () => { if (APP.ui.roadShow === b.id) APP.ui.roadShow = 0; else roadsShow(b.id); });
  const rb = $('cardRes');
  if (rb) rb.addEventListener('click', () => { const r = resBuild(s); toastShow(r.ok ? 'The ' + RESIDENCE[s.res].name + ' is built.' : r.why + '.'); cardRender(); });
  const pal = $('cardPalace');
  if (pal) pal.addEventListener('click', () => {
    const r = palaceBuild(s);
    toastShow(r.ok ? "The Governor's palace is built: the island is a capital." : r.why + '.');
    cardRender();
  });
  const rm = $('cardRemove');
  if (rm) rm.addEventListener('click', () => cardConfirm(b.id, 'remove', () => { const r = removeAt(s, b.x, b.y); if (!r.why) { toastShow(BUILDINGS[b.type].name + ' removed: +$' + r.refund + '.'); cardClose(); } }));
}
