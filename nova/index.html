<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- iPad home-screen app (block 5): full screen, the map under a translucent status bar, its own name; the icon is drawn at boot (ios.js) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Isla Nueva">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="theme-color" content="#2793ad">
<title>Isla Nueva</title>
<style>
/* Paper and ink (style B, from nova/samples/b-iso2d): warm paper cards with an ink border, serif titles, coral and teal. */
:root {
  --ink: #3a2a1f; --ink2: #7a604b; --cream: #f8eed6; --paper: #f8eed6; --paper2: #f0e0bd; --panel: #f8eed6; --line: rgba(58, 42, 31, 0.18);
  --teal: #2e9a91; --teal2: #24786f; --coral: #df684c; --coral-soft: #f9d7c6; --red: #b5402c; --green: #2f7a45; --gold: #eab33e;
  --shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 4px rgba(58, 42, 31, 0.16), 0 3px 0 rgba(58, 42, 31, 0.30), 0 10px 24px rgba(30, 20, 10, 0.18);
  --serif: Palatino, "Palatino Linotype", "Book Antiqua", "GFS Baskerville", Charter, "Bitstream Charter", Georgia, serif;
  --sans: "Avenir Next", Avenir, "Trebuchet MS", "Segoe UI", Carlito, "DejaVu Sans", system-ui, sans-serif;
  --bar-h: 84px; --gap: 10px;
  /* safe areas (home indicator, rounded corners, a phone's notch in landscape): every edge element adds its side */
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
}
/* iOS Safari (block 5): no tap flash, no long-press callout or text selection, no page pinch or rubber band (the body is
   fixed and never scrolls; panels that scroll keep their scroll to themselves), buttons answer the first tap. */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overscroll-behavior: none; height: 100%; background: #2793ad; }
html, body { margin: 0; overflow: hidden; color: var(--ink); font: 15px/1.3 var(--sans); -webkit-user-select: none; user-select: none; }
body { position: fixed; inset: 0; width: 100%; height: 100%; overscroll-behavior: none; background: #2793ad; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; touch-action: manipulation; }
#sheet, #card, #pop, #bar .tray { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.ic { width: 22px; height: 22px; fill: currentColor; flex: none; }
#map { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; -webkit-user-select: none; user-select: none; }
/* warm light and a soft vignette over the map, like the paper sample (no blend modes: cheap on the iPad) */
#paper { position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background: radial-gradient(ellipse 120% 95% at 50% 46%, rgba(255, 236, 200, 0) 58%, rgba(110, 72, 40, 0.20) 100%),
    linear-gradient(135deg, rgba(255, 214, 140, 0.13), rgba(255, 236, 200, 0) 45%, rgba(90, 120, 170, 0.08)); }
.panel { background: var(--panel); border: 2px solid var(--ink); border-radius: 16px; box-shadow: var(--shadow); }

/* Top bar */
#top { position: fixed; top: calc(var(--gap) + var(--st)); left: calc(var(--gap) + var(--sl)); right: calc(var(--gap) + var(--sr));
  display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: start; pointer-events: none; z-index: 5; }
#top > * { pointer-events: auto; }
.brand { padding: 6px 16px 6px 14px; min-height: 54px; display: flex; flex-direction: column; justify-content: center; }
.brand b { font: italic 700 20px/1.05 var(--serif); letter-spacing: 0.01em; }
.brand span { font-size: 11.5px; color: var(--ink2); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; margin-top: 3px; }
.stats { justify-self: center; display: flex; align-items: center; padding: 2px 4px; min-height: 54px; }
.stat { display: flex; align-items: center; gap: 8px; padding: 6px 14px; font-weight: 700; font-size: 21px; min-height: 44px; border-radius: 12px;
  font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
.stat + .stat { border-left: 2px dotted rgba(58, 42, 31, 0.32); border-radius: 0; }
.stat .ic { width: 27px; height: 27px; stroke: var(--ink); stroke-width: 1.3px; paint-order: stroke; }
.stat.money .ic { fill: #f0c04a; } .stat.people .ic { fill: var(--teal); } .stat.happy .ic { fill: #f6d36b; }
.stat.neg { color: var(--red); }
.ctrl { display: flex; align-items: center; gap: 3px; padding: 4px; min-height: 54px; }
.ctrl button { min-width: 44px; height: 42px; border-radius: 11px; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.ctrl button .ic { width: 20px; height: 20px; }
.ctrl button.on { background: var(--coral); color: #fff7ea; box-shadow: inset 0 0 0 2px var(--ink), inset 0 -3px 0 rgba(0, 0, 0, 0.16); }
.ctrl button:not(.on):active { background: var(--paper2); }
.ctrl .sep { width: 0; height: 26px; border-left: 2px dotted rgba(58, 42, 31, 0.32); margin: 0 4px; }
#pill { position: fixed; top: calc(var(--gap) + 64px + var(--st)); left: calc(50% + (var(--sl) - var(--sr)) / 2); transform: translateX(-50%); z-index: 4;
  background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 5px 16px; font-weight: 600; font-size: 14px;
  box-shadow: 0 2px 0 rgba(58, 42, 31, 0.28), 0 6px 14px rgba(30, 20, 10, 0.14);
  white-space: nowrap; max-width: calc(100% - 20px - var(--sl) - var(--sr)); overflow: hidden; text-overflow: ellipsis; }
#pill .ok { color: var(--green); font-weight: 800; } #pill .no { color: #a8562a; font-weight: 800; }

/* Build bar */
#bar { position: fixed; bottom: calc(var(--gap) + var(--sb)); left: calc(50% + (var(--sl) - var(--sr)) / 2); transform: translateX(-50%); z-index: 5;
  display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 6px; width: max-content;
  min-width: min(560px, calc(100% - 2 * var(--gap) - var(--sl) - var(--sr))); max-width: calc(100% - 2 * var(--gap) - var(--sl) - var(--sr)); }
#bar .tray { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
#bar .tray::-webkit-scrollbar { display: none; }
#bar .tabs { display: flex; gap: 4px; }
#card .btns button.poor { color: var(--red); }
.tab { flex: 1 1 0; min-width: 56px; min-height: 56px; border-radius: 12px; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; position: relative; background: var(--paper2); color: var(--ink); padding: 0 6px; }
.tab .ic { width: 22px; height: 22px; fill: #7a604b; stroke: var(--ink); stroke-width: 1.2px; paint-order: stroke; stroke-linejoin: round; }
.tab.on { background: var(--coral-soft); box-shadow: inset 0 0 0 2px var(--ink); }
.tab.new::after { content: ''; position: absolute; top: 6px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); border: 1.5px solid var(--ink); }
.tool { flex: none; width: 72px; min-height: 68px; border-radius: 12px; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2px; font-size: 12.5px; font-weight: 700; position: relative; letter-spacing: 0.01em; }
.tool .ic { width: 28px; height: 28px; fill: #7a604b; stroke: var(--ink); stroke-width: 1.2px; paint-order: stroke; stroke-linejoin: round; }
.tool small { font-size: 11px; font-weight: 700; color: var(--ink2); }
.tool:not(.on):active { background: var(--paper2); }
.tool.on { background: var(--coral-soft); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink), 0 3px 0 var(--ink); }
.tool.on small { color: var(--ink2); }
.tool.locked { opacity: 0.42; } .tool.locked small { color: var(--ink); }
.tool.poor small { color: var(--red); } .tool.on.poor small { color: var(--red); }
.tool.remove { color: var(--red); } .tool.remove .ic { fill: var(--coral); }
.tool.remove.on { background: var(--coral); color: #fff7ea; } .tool.remove.on small { color: #fff7ea; }
.tool[data-tool="road"] .ic { fill: #d6ad74; } .tool[data-tool="casita"] .ic { fill: #ec8a6c; } .tool[data-tool="fishing"] .ic { fill: #5b8fb9; }
.tool[data-tool="grove"] .ic { fill: #f29a38; } .tool[data-tool="market"] .ic { fill: #df684c; } .tool[data-tool="cane"] .ic { fill: #8dbb4a; }
.tool[data-tool="distillery"] .ic { fill: #b8733d; } .tool[data-tool="bakery"] .ic { fill: #d6974f; } .tool[data-tool="chapel"] .ic { fill: #f8f2e4; }
.tool[data-tool="harbor"] .ic { fill: #3f7fa3; } .tool[data-tool="school"] .ic { fill: #3f74a8; } .tool[data-tool="clinic"] .ic { fill: #d9534f; }
.tool[data-tool="tobacco"] .ic { fill: #a8b84e; } .tool[data-tool="cigars"] .ic { fill: #8a5a3c; } .tool[data-tool="lumber"] .ic { fill: #4f8d4a; }
.tool[data-tool="sawmill"] .ic { fill: #c99a5e; }
.tool.new::after { content: ''; position: absolute; top: 6px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); border: 1.5px solid var(--ink); }

/* Lower area: toast, guide, receipt */
#lower { position: fixed; left: calc(var(--gap) + var(--sl)); right: calc(var(--gap) + var(--sr)); bottom: calc(var(--bar-h) + 2 * var(--gap) + var(--sb));
  display: flex; align-items: flex-end; gap: 10px; pointer-events: none; z-index: 4; }
#lower > * { pointer-events: auto; }
#guide { display: none; align-items: center; gap: 10px; padding: 10px 10px 10px 12px; max-width: 460px; }
#guide.show { display: flex; }
#guide .who { width: 42px; height: 42px; border-radius: 50%; background: var(--coral-soft); color: #8a3a22; border: 2px solid var(--ink);
  font: italic 700 20px/38px var(--serif); text-align: center; flex: none; }
#guide p { margin: 0; font-size: 15px; flex: 1; }
#guide .act { background: var(--teal); color: #fff7ea; border-radius: 11px; padding: 0 15px; min-height: 44px; font-weight: 800; flex: none;
  box-shadow: inset 0 0 0 2px var(--ink), inset 0 -3px 0 rgba(0, 0, 0, 0.16); }
#guide .x { width: 40px; height: 44px; display: flex; align-items: center; justify-content: center; flex: none; }
#guide .x .ic { width: 16px; fill: var(--ink2); }
.spacer { flex: 1; }
#receipt { display: none; padding: 9px 14px; min-width: 220px; max-width: 320px; }
#receipt.show { display: block; }
#receipt .head { display: flex; justify-content: space-between; gap: 12px; font-weight: 800; min-height: 28px; align-items: center; font-variant-numeric: tabular-nums; }
#receipt .head span:first-child { font: italic 700 17px var(--serif); }
#receipt .rows { display: none; margin-top: 6px; font-size: 14px; font-variant-numeric: tabular-nums; }
#receipt.open .rows { display: block; }
#receipt .row { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
#receipt .row.sub { color: var(--ink2); }
#receipt .row.sum { border-top: 2px dotted rgba(58, 42, 31, 0.35); margin-top: 4px; padding-top: 4px; font-weight: 800; }
.pos { color: var(--green); } .neg { color: var(--red); }
#toast { position: fixed; left: calc(50% + (var(--sl) - var(--sr)) / 2); transform: translateX(-50%); bottom: calc(var(--bar-h) + 2 * var(--gap) + 128px + var(--sb));
  background: rgba(58, 42, 31, 0.94); color: #fbf3df; border-radius: 12px; padding: 9px 16px; font-weight: 600; font-size: 14px;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.18), 0 8px 18px rgba(30, 20, 10, 0.2);
  max-width: min(520px, calc(100% - 20px)); text-align: center; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 6; }
#toast.show { opacity: 1; }
/* Block 4: "✓ Done" beside the build bar while a tool is armed (placed by donePlace) */
#done { position: fixed; z-index: 5; display: none; min-height: 56px; min-width: 104px; padding: 0 18px; border-radius: 14px; align-items: center; justify-content: center;
  gap: 6px; background: var(--teal); color: #fff7ea; font-weight: 800; font-size: 17px; border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink), 0 8px 18px rgba(30, 20, 10, 0.2); }
body.armed #done { display: flex; }
body.armed.doneup #lower { bottom: calc(var(--bar-h) + 2 * var(--gap) + 66px + var(--sb)); }
#guide.fresh { animation: guideIn 0.6s ease-out; }
#guide.fresh .act { animation: actWait 0.9s steps(1, end); }
@keyframes guideIn { from { transform: translateY(8px); opacity: 0.2; } to { transform: none; opacity: 1; } }
@keyframes actWait { from { opacity: 0.45; } to { opacity: 1; } }
.tool.nospot small { color: var(--red); font-size: 10px; line-height: 1.05; text-align: center; white-space: normal; }
#card .btns button.shut { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(58, 42, 31, 0.45); color: var(--ink2); font-weight: 700; font-size: 14px; }
#card .btns button.shut.sure, #card .btns button.danger.sure { background: var(--red); color: #fff7ea; }
#card .btns + .btns { margin-top: 8px; }
#card .link { min-height: 40px; padding: 0 12px; margin-top: 6px; border-radius: 10px; background: var(--paper); font-weight: 800; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); display: inline-flex; align-items: center; }
#pop .lg { display: flex; gap: 8px; align-items: center; padding: 5px 0; border-top: 2px dotted rgba(58, 42, 31, 0.2); font-size: 13.5px; }
#pop .bub { flex: none; width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--paper2); border: 1.5px solid var(--ink); }
#pop .bub.warn { background: #fff4ea; border-color: #c4553f; }
#pop .bub .ic { width: 20px; height: 20px; }

/* Building card */
#card, #sheet { background: var(--paper); }
#card { position: fixed; z-index: 7; display: none; padding: 14px 16px; width: 310px; right: calc(var(--gap) + var(--sr));
  top: calc(var(--gap) + 112px + var(--st)); max-height: calc(100% - 232px - var(--st) - var(--sb)); overflow-y: auto; }
#card.show { display: block; }
#card h3 { margin: 0 0 2px; font: italic 700 20px var(--serif); display: flex; align-items: center; gap: 8px; padding-right: 36px; }
#card h3 .ic { fill: var(--coral); stroke: var(--ink); stroke-width: 1.2px; paint-order: stroke; }
#card .x { position: absolute; top: 6px; right: 6px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
#card .x .ic { width: 18px; fill: var(--ink2); }
#card .num { font-size: 23px; font-weight: 800; margin: 6px 0 0; font-variant-numeric: tabular-nums; }
#card .why { font-size: 13px; color: var(--ink2); margin-bottom: 8px; }
#card .line { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-top: 2px dotted rgba(58, 42, 31, 0.22); font-size: 14px; }
#card .note { margin: 8px 0 0; padding: 8px 10px; border-radius: 10px; background: var(--coral-soft); color: #7e2e1c; font-size: 14px; border: 1.5px solid rgba(58, 42, 31, 0.25); }
#card .note.good { background: #e3efcf; color: #2a5a2c; }
#card .btns { display: flex; gap: 8px; margin-top: 12px; }
#card .btns button { flex: 1; min-height: 44px; border-radius: 11px; font-weight: 800; background: var(--paper2); box-shadow: inset 0 0 0 2px var(--ink), 0 2px 0 var(--ink); }
#card .btns .danger { background: var(--coral-soft); color: var(--red); }
.y { color: var(--green); font-weight: 700; } .n { color: var(--red); font-weight: 700; }

/* Sheets and cards */
#veil { position: fixed; inset: 0; background: rgba(40, 28, 18, 0.35); z-index: 8; display: none; }
#veil.show { display: block; }
#sheet { position: fixed; z-index: 9; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(540px, calc(100% - 20px - var(--sl) - var(--sr)));
  max-height: calc(100% - 40px - var(--st) - var(--sb)); overflow-y: auto; padding: 18px; display: none; }
#sheet.show { display: block; }
#sheet h2 { margin: 0 0 4px; font: italic 700 24px var(--serif); }
#sheet h4 { margin: 14px 0 6px; font-size: 15px; }
#sheet .sub { color: var(--ink2); font-size: 14px; margin: 0 0 6px; }
#sheet .x { position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
#sheet .x .ic { fill: var(--ink2); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button, .exp button { border-radius: 12px; background: var(--paper2); padding: 8px; min-height: 56px; text-align: left; box-shadow: inset 0 0 0 1.5px rgba(58, 42, 31, 0.35); }
.seg button b, .exp button b { display: block; font-size: 15px; }
.seg button span, .exp button span { font-size: 12px; color: var(--ink2); }
.seg button.on, .exp button.on { background: var(--teal); color: #fff7ea; box-shadow: inset 0 0 0 2px var(--ink), 0 2px 0 var(--ink); }
.seg button.on span, .exp button.on span { color: #e3f4f1; }
.exp { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.log p { margin: 0; padding: 7px 0; border-top: 2px dotted rgba(58, 42, 31, 0.2); font-size: 14px; }
.log p i { color: var(--ink2); font-style: normal; font-size: 12px; display: block; }
#stagecard { text-align: center; }
#stagecard .big { font: italic 700 38px var(--serif); margin: 4px 0; }
#stagecard ul { text-align: left; margin: 10px auto; padding-left: 20px; max-width: 360px; }
.go { display: block; width: 100%; min-height: 50px; border-radius: 12px; background: var(--teal); color: #fff7ea; font-weight: 800; font-size: 16px; margin-top: 12px;
  box-shadow: inset 0 0 0 2px var(--ink), 0 3px 0 var(--ink); }
#yearcard { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); top: calc(var(--gap) + 106px + var(--st));
  padding: 12px 16px; display: none; width: min(420px, calc(100% - 20px)); }
#yearcard.show { display: block; }
#yearcard b { font: italic 700 20px var(--serif); }
#yearcard p { margin: 3px 0 0; font-size: 14px; }
#pop { position: fixed; z-index: 7; display: none; padding: 10px 14px; left: 50%; transform: translateX(-50%); top: calc(var(--gap) + 106px + var(--st)); width: min(330px, calc(100% - 20px)); }
#pop.show { display: block; }
#pop .line { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }

/* Portrait iPad and phone */
@media (max-width: 900px) {
  .tool { width: 72px; }
  body.carded #lower, body.carded #toast { display: none; }
  #card { left: calc(var(--gap) + var(--sl)); right: calc(var(--gap) + var(--sr)); width: auto; top: auto; bottom: calc(var(--bar-h) + 2 * var(--gap) + var(--sb)); max-height: 46vh; max-height: 46dvh; }
}
@media (max-width: 600px) {
  :root { --gap: 8px; }
  #top { grid-template-columns: 1fr auto; }
  .brand { grid-column: 1; padding: 6px 12px; min-height: 50px; }
  .brand b { display: none; }
  .brand span { font: italic 700 16px/1.15 var(--serif); color: var(--ink); letter-spacing: 0; text-transform: none; margin: 0; }
  .ctrl { grid-column: 2; grid-row: 1; min-height: 50px; }
  .ctrl button { min-width: 40px; }
  .ctrl .sep { margin: 0 2px; }
  .stats { grid-column: 1 / 3; grid-row: 2; justify-self: stretch; justify-content: space-around; min-height: 48px; }
  .stat { font-size: 18px; padding: 4px 8px; }
  #pill { top: calc(var(--gap) + 116px + var(--st)); font-size: 13px; white-space: normal; text-align: center; border-radius: 14px; width: calc(100% - 16px - var(--sl) - var(--sr)); }
  #yearcard, #pop { top: calc(var(--gap) + 156px + var(--st)); }
  .tool { width: 66px; }
  #bar { width: calc(100% - 2 * var(--gap) - var(--sl) - var(--sr)); }
  .tab { min-width: 0; padding: 0 2px; font-size: 11px; }
  #lower { flex-direction: column; align-items: stretch; }
  #guide { max-width: none; }
  #receipt { align-self: flex-end; }
  #toast { bottom: auto; top: calc(var(--gap) + 156px + var(--st)); }
}

/* The title screen (block 5): the island behind, one paper card in front; also where the home-screen app opens. */
body.titled #top, body.titled #pill, body.titled #lower, body.titled #bar, body.titled #done, body.titled #toast, body.titled #card,
body.titled #yearcard, body.titled #pop { display: none !important; }
#title { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
  padding: calc(16px + var(--st)) calc(16px + var(--sr)) calc(16px + var(--sb)) calc(16px + var(--sl));
  background: radial-gradient(ellipse 70% 62% at 50% 50%, rgba(40, 28, 18, 0.06), rgba(40, 28, 18, 0.34)); }
body.titled #title { display: flex; }
#title .tcard { width: min(440px, 100%); padding: 26px 28px 24px; text-align: center; position: relative; animation: titleIn 0.45s ease-out; }
@keyframes titleIn { from { transform: translateY(14px); } to { transform: none; } }
/* the card beside the town (landscape: on the left; portrait and phone: low), the island in the open part */
@media (min-aspect-ratio: 1/1) { #title { justify-content: flex-start; padding-left: calc(max(16px, 6vw) + var(--sl)); } }
@media (max-aspect-ratio: 1/1) { #title { align-items: flex-end; padding-bottom: calc(max(16px, 7vh) + var(--sb)); } }

// The island: seeded generation of terrain, the bay with its pier, the Governor's hut and the land regions.

const MAP_W = 48, MAP_H = 48;

function rngNext(state) {
  // mulberry32 on state.rng so a saved game continues the same sequence
  let t = (state.rng = (state.rng + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

function hash2(seed, x, y) {
  let h = (seed | 0) ^ Math.imul(x, 374761393) ^ Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function valueNoise(seed, x, y, scale) {
  const gx = x / scale, gy = y / scale, x0 = Math.floor(gx), y0 = Math.floor(gy);
  const fx = gx - x0, fy = gy - y0, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const a = hash2(seed, x0, y0), b = hash2(seed, x0 + 1, y0), c = hash2(seed, x0, y0 + 1), d = hash2(seed, x0 + 1, y0 + 1);
  return (a + (b - a) * sx) + ((c + (d - c) * sx) - (a + (b - a) * sx)) * sy;
}

function tileIdx(x, y) { return y * MAP_W + x; }
function inMap(x, y) { return x >= 0 && y >= 0 && x < MAP_W && y < MAP_H; }

// Returns { terrain[], region[], pier:{x,y}, stub:[idx], residence:{x,y} }.
function mapGenerate(seed) {
  const terrain = new Array(MAP_W * MAP_H).fill(SEA);
  const bayX = 5, bayY = 30, bayR = 7.5;
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      const dx = (x + 0.5 - 25) / 21, dy = (y + 0.5 - 23.5) / 20.5;
      const d = Math.sqrt(dx * dx + dy * dy) + (valueNoise(seed, x, y, 7) - 0.5) * 0.28;
      const inBay = Math.hypot(x + 0.5 - bayX, (y + 0.5 - bayY) * 1.1) < bayR;
      if (d < 1 && !inBay) terrain[tileIdx(x, y)] = GRASS;
    }
  }
  // Beach: land touching the sea.
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    if (terrain[tileIdx(x, y)] !== GRASS) continue;
    for (const [nx, ny] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]) {
      if (!inMap(nx, ny) || terrain[tileIdx(nx, ny)] === SEA) { terrain[tileIdx(x, y)] = BEACH; break; }
    }
  }
  // The pier: the first land tile east of the bay's centre line.
  let sx = bayX;
  while (sx < MAP_W && terrain[tileIdx(sx, bayY)] === SEA) sx++;
  terrain[tileIdx(sx, bayY)] = BEACH;
  const pier = { x: sx - 3, y: bayY };
  for (let i = 1; i <= 3; i++) terrain[tileIdx(sx - i, bayY)] = SEA;
  const stub = [];
  for (let i = 0; i < 4; i++) stub.push(tileIdx(sx + i, bayY));
  // Hills with forest in the north-east; small woods elsewhere (kept off the first streets).
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    const i = tileIdx(x, y);
    if (terrain[i] !== GRASS) continue;
    const hill = Math.hypot(x - 35, y - 13) < 8 + (valueNoise(seed + 7, x, y, 4) - 0.5) * 4;
    const wood = valueNoise(seed + 3, x, y, 5) > 0.72;
    const nearTown = Math.abs(x - sx - 6) < 9 && Math.abs(y - bayY) < 8;
    if (hill) terrain[i] = valueNoise(seed + 11, x, y, 3) > 0.35 ? FOREST : HILL;
    else if (wood && !nearTown) terrain[i] = FOREST;
  }
  // The Governor's hut on a low hill north-east of the pier.
  const residence = { x: sx + 4, y: bayY - 5 };
  for (let y = residence.y - 1; y <= residence.y + 2; y++) for (let x = residence.x - 1; x <= residence.x + 2; x++) {
    if (inMap(x, y) && terrain[tileIdx(x, y)] !== SEA && terrain[tileIdx(x, y)] !== BEACH) terrain[tileIdx(x, y)] = HILL;
  }
  // Land regions: 0 opens at the start (22 x 22 around the bay), 1 at Village, 2 at Town (the middle east),
  // 3 at City (the east coast), 4 at Port city (the north-east hills), 5 at Capital (the north beyond the woods).
  const region = new Array(MAP_W * MAP_H).fill(5);
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    const ix = x - sx, iy = y - bayY;
    let r = 5;
    if (ix >= -10 && ix <= 11 && iy >= -11 && iy <= 10) r = 0;
    else if (ix >= -14 && ix <= 15 && iy >= -15 && iy <= 14) r = 1;
    else if (ix <= 21 && iy >= -18) r = 2;
    else if (iy >= -5) r = 3;
    else if (iy >= -18) r = 4;
    region[tileIdx(x, y)] = r;
  }
  mapPassage(terrain, region, stub[0]);
  return { terrain, region, pier, stub, residence };
}

// Every land region must be reachable by road from the pier (block 3: the forest belt in the north sealed off the
// Capital's land on the default island). Where a region's grass cannot be reached, a short clearing is cut through
// the forest, from the nearest reachable tile, along a straight L that does not cross the sea.
function mapPassage(terrain, region, start) {
  const n = MAP_W * MAP_H;
  const reach = () => {
    const seen = new Uint8Array(n), q = [start];
    seen[start] = 1;
    for (let h = 0; h < q.length; h++) {
      const i = q[h], x = i % MAP_W, y = (i / MAP_W) | 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy, j = tileIdx(nx, ny);
        if (!inMap(nx, ny) || seen[j] || terrain[j] === SEA || terrain[j] === FOREST) continue;
        seen[j] = 1; q.push(j);
      }
    }
    return seen;
  };
  for (let guard = 0; guard < 6; guard++) {
    const seen = reach();
    const lost = [];
    for (let i = 0; i < n; i++) if (terrain[i] === GRASS && !seen[i]) lost.push(i);
    if (!lost.length) return;
    let best = null;
    for (const g of lost) for (let i = 0; i < n; i++) {
      if (!seen[i]) continue;
      const d = Math.abs(g % MAP_W - i % MAP_W) + Math.abs(((g / MAP_W) | 0) - ((i / MAP_W) | 0));
      if (best && d >= best.d) continue;
      const path = [], gx = g % MAP_W, gy = (g / MAP_W) | 0;
      let x = i % MAP_W, y = (i / MAP_W) | 0;
      while (x !== gx) { x += Math.sign(gx - x); path.push(tileIdx(x, y)); }
      while (y !== gy) { y += Math.sign(gy - y); path.push(tileIdx(x, y)); }
      if (path.some((k) => terrain[k] === SEA)) continue;
      best = { d, path };
    }
    if (!best) return;
    for (const k of best.path) if (terrain[k] === FOREST) terrain[k] = GRASS;
  }
}

// ---- src/sim/roads.js
// Roads: the road grid, breadth-first distances and paths along it, and what each building can reach.

const DIRS4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];

// state.road[i]: 0 none, 1 dirt road, 2 paved road (City on; carts go twice as fast on it).
function isRoad(state, x, y) { return inMap(x, y) && state.road[tileIdx(x, y)] > 0; }

function isPaved(state, x, y) { return inMap(x, y) && state.road[tileIdx(x, y)] === 2; }

// The road tiles orthogonally next to a building: where carts and people enter it.
function bEntrances(state, b) {
  const out = [];
  for (let y = b.y - 1; y <= b.y + b.h; y++) for (let x = b.x - 1; x <= b.x + b.w; x++) {
    const side = (x === b.x - 1 || x === b.x + b.w) !== (y === b.y - 1 || y === b.y + b.h);
    if (side && isRoad(state, x, y)) out.push(tileIdx(x, y));
  }
  return out;
}

// Caches derived from roads and buildings; dropped whenever state.ver changes and never saved.
function simCache(state) {
  if (!state._c || state._c.ver !== state.ver) state._c = { ver: state.ver, bfs: {}, occ: null, reach: null };
  return state._c;
}

// Distances (in road tiles) and parents from a building's entrances over the whole network.
function roadBfs(state, b) {
  const c = simCache(state);
  if (c.bfs[b.id]) return c.bfs[b.id];
  const n = MAP_W * MAP_H, dist = new Int16Array(n).fill(-1), par = new Int32Array(n).fill(-1);
  const q = bEntrances(state, b);
  for (const i of q) dist[i] = 0;
  for (let h = 0; h < q.length; h++) {
    const i = q[h], x = i % MAP_W, y = (i / MAP_W) | 0;
    for (const [dx, dy] of DIRS4) {
      const nx = x + dx, ny = y + dy;
      if (!isRoad(state, nx, ny)) continue;
      const j = tileIdx(nx, ny);
      if (dist[j] >= 0) continue;
      dist[j] = dist[i] + 1; par[j] = i; q.push(j);
    }
  }
  return (c.bfs[b.id] = { dist, par });
}

// Road distance from building a to building b (Infinity if not connected) and the entrance used.
function roadDist(state, a, b) {
  const { dist } = roadBfs(state, a);
  let best = Infinity, at = -1;
  for (const e of bEntrances(state, b)) if (dist[e] >= 0 && dist[e] < best) { best = dist[e]; at = e; }
  return { d: best, at };
}

// The tile path from a's entrance to b's entrance, or null.
function roadPath(state, a, b) {
  const { d, at } = roadDist(state, a, b);
  if (!isFinite(d)) return null;
  const { par } = roadBfs(state, a), path = [];
  for (let i = at; i >= 0; i = par[i]) path.push(i);
  return path.reverse();
}

// How far (straight-line tiles from its edge, any direction) a market, service or decoration reaches homes.
function bReach(def) { return def.kind === 'market' ? TUNE.marketReach : (def.reach || TUNE.serviceReach); }

// Road networks (block 4): every road tile carries the id of the connected piece it belongs to (0: no road).
function roadNets(state) {
  const c = simCache(state);
  if (c.nets) return c.nets;
  const n = MAP_W * MAP_H, net = new Int32Array(n);
  let k = 0;
  for (let i = 0; i < n; i++) {
    if (!state.road[i] || net[i]) continue;
    net[i] = ++k;
    const q = [i];
    for (let h = 0; h < q.length; h++) {
      const x = q[h] % MAP_W, y = (q[h] / MAP_W) | 0;
      for (const [dx, dy] of DIRS4) {
        const nx = x + dx, ny = y + dy;
        if (!isRoad(state, nx, ny)) continue;
        const j = tileIdx(nx, ny);
        if (!net[j]) { net[j] = k; q.push(j); }
      }
    }
  }
  return (c.nets = net);
}

// The road pieces a building (or a footprint {x, y, w, h}) touches.
function bNets(state, b) {
  const c = simCache(state), key = b.id ? b.id : null;
  if (!c.bn) c.bn = {};
  if (key && c.bn[key]) return c.bn[key];
  const net = roadNets(state), out = [];
  for (const e of bEntrances(state, b)) if (!out.includes(net[e])) out.push(net[e]);
  if (key) c.bn[key] = out;
  return out;
}

// Whether a road joins two buildings (they touch the same road piece).
function roadJoined(state, a, b) {
  const na = bNets(state, a);
  return na.length > 0 && bNets(state, b).some((k) => na.includes(k));
}

// For every home: the markets and services within reach (lists of ids per thing a service gives, e.g. svc.church),
// the decorations within reach (deco: ids), whether a paved road touches it, and `cut`: markets and services near
// enough but with no road joining them (the card and Rosa say so; the map shows the two road pieces).
// Reach is straight-line tiles (footDist) for all three; markets and services also need the road link, decorations
// do not. Computed once per change of roads or buildings.
function homeReach(state) {
  const c = simCache(state);
  if (c.reach) return c.reach;
  const reach = {};
  const homes = state.b.filter((b) => b.type === 'casita');
  for (const h of homes) {
    const ent = bEntrances(state, h);
    reach[h.id] = { road: ent.length > 0, paved: ent.some((i) => state.road[i] === 2), markets: [], svc: {}, deco: [], cut: [] };
  }
  for (const s of state.b) {
    const def = BUILDINGS[s.type];
    if (def.kind === 'deco') {
      for (const h of homes) if (footDist(s, h) <= def.reach) reach[h.id].deco.push(s.id);
      continue;
    }
    if (def.kind !== 'market' && def.kind !== 'service') continue;
    if (def.gives === 'light') continue;
    const lim = bReach(def);
    for (const h of homes) {
      if (footDist(s, h) > lim) continue;
      if (!roadJoined(state, s, h)) { reach[h.id].cut.push(s.id); continue; }
      if (def.kind === 'market') reach[h.id].markets.push(s.id);
      else (reach[h.id].svc[def.gives] = reach[h.id].svc[def.gives] || []).push(s.id);
    }
  }
  return (c.reach = reach);
}

// Tiles in a straight line between two footprints (the larger of across and down, 0 when they touch or overlap):
// a home 3 tiles from a market's edge in any direction is 3 away.
function footDist(a, b) {
  const dx = Math.max(a.x - (b.x + b.w - 1), 0, b.x - (a.x + a.w - 1)), dy = Math.max(a.y - (b.y + b.h - 1), 0, b.y - (a.y + a.h - 1));
  return Math.max(dx, dy);
}

// Decorations: the same straight-line distance (kept under its block-3 name for the tests).
function decoDist(d, h) { return footDist(d, h); }

// The homes a service or market reaches.
function serviceHomes(state, sid) {
  const out = [];
  const reach = homeReach(state);
  for (const h of state.b) {
    if (h.type !== 'casita' || !reach[h.id]) continue;
    const r = reach[h.id];
    if (r.markets.includes(sid) || r.deco.includes(sid) || Object.keys(r.svc).some((k) => r.svc[k].includes(sid))) out.push(h);
  }
  return out;
}

// Tile -> building id map.
function occMap(state) {
  const c = simCache(state);
  if (c.occ) return c.occ;
  const occ = new Int32Array(MAP_W * MAP_H).fill(0);
  for (const b of state.b) for (let y = b.y; y < b.y + b.h; y++) for (let x = b.x; x < b.x + b.w; x++) occ[tileIdx(x, y)] = b.id;
  return (c.occ = occ);
}

function bById(state, id) {
  const c = simCache(state);
  if (!c.byId) { c.byId = {}; for (const b of state.b) c.byId[b.id] = b; }
  return c.byId[id] || null;
}

function bAt(state, x, y) {
  if (!inMap(x, y)) return null;
  const id = occMap(state)[tileIdx(x, y)];
  return id ? bById(state, id) : null;
}

// ---- src/sim/place.js
// Placement rules (each refusal is a short reason the ghost shows), building, roads and removal.

function tileOpenAt(state, i) { return state.region[i] <= state.stage; }

function regionStageName(state, i) { return (STAGES[state.region[i]] || STAGES[STAGES.length - 1]).name; }

function nearTerrain(state, b, code) {
  for (let y = b.y - 1; y <= b.y + b.h; y++) for (let x = b.x - 1; x <= b.x + b.w; x++) {
    const inside = x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h;
    const side = (x === b.x - 1 || x === b.x + b.w) !== (y === b.y - 1 || y === b.y + b.h);
    if (!inside && side && inMap(x, y) && state.terrain[tileIdx(x, y)] === code) return true;
  }
  return false;
}

// '' when the building fits at (x, y); otherwise the reason in a few words.
function canPlace(state, type, x, y, opts) {
  const def = BUILDINGS[type];
  if (!def || def.kind === 'fixed') return 'Cannot be built';
  if (def.stage > state.stage) return 'Opens at ' + STAGES[def.stage].name;
  const b = { x, y, w: def.w, h: def.h };
  const occ = occMap(state);
  let beach = 0;
  for (let ty = y; ty < y + def.h; ty++) for (let tx = x; tx < x + def.w; tx++) {
    if (!inMap(tx, ty)) return 'Off the island';
    const i = tileIdx(tx, ty), t = state.terrain[i];
    if (t === SEA) return 'Cannot build on the sea';
    if (!tileOpenAt(state, i)) return 'Land opens at ' + regionStageName(state, i);
    if (occ[i] || state.road[i]) return 'Something is in the way';
    if (t === FOREST) return 'Forest in the way';
    if (t === BEACH) beach++;
    // Decorations may stand on the beach too (palms on the shore, a bandstand on the promenade).
    if (t === BEACH && def.site !== 'beach' && def.site !== 'coast' && def.kind !== 'deco') return 'Too sandy: build on grass';
  }
  if (def.site === 'beach' && (beach < def.w * def.h || !nearTerrain(state, b, SEA))) return 'Must be on the beach by the sea';
  if (def.site === 'coast' && !nearTerrain(state, b, SEA)) return 'Must be on the coast';
  if (def.site === 'forest' && !nearTerrain(state, b, FOREST)) return 'Must be next to forest';
  // Decorations need no road: they fill any spare tile near homes.
  if (!(opts && opts.noRoad) && def.kind !== 'deco' && bEntrances(state, b).length === 0) return 'Needs a road next to it';
  if (!(opts && opts.free) && state.money < def.cost) return 'Not enough money ($' + def.cost + ')';
  return '';
}

function newBuilding(state, type, x, y) {
  const def = BUILDINGS[type];
  const b = { id: state.nextId++, type, x, y, w: def.w, h: def.h, open: true, workers: 0, built: state.month };
  if (def.kind === 'home') Object.assign(b, { level: 1, res: 0, pantry: {}, dry: {}, occTicks: 0, miss: [], missNext: [], lacks: [], wants: [], up: 0, down: 0 });
  if (def.kind === 'producer') Object.assign(b, { yard: 0, inp: {}, incoming: {}, prog: 0, made: 0, blocked: '' });
  if (def.kind === 'market') Object.assign(b, { stock: {}, incoming: {}, served: 0 });
  if (def.kind === 'harbor') Object.assign(b, { stock: {}, incoming: {}, flour: 0, sold: 0, bought: 0, soldUnits: {} });
  return b;
}

function placeBuilding(state, type, x, y) {
  const why = canPlace(state, type, x, y);
  if (why) return { ok: false, why };
  const def = BUILDINGS[type], b = newBuilding(state, type, x, y);
  state.money -= def.cost;
  state.b.push(b);
  // One cart per producer; a harbor has three (they take flour to the bakeries), the steamship quay four.
  if (def.kind === 'producer' || def.kind === 'harbor') for (let k = 0; k < (def.carts || 1); k++) state.carts.push({ id: b.id + k * 7, home: b.id, st: 'idle', good: '', n: 0, dest: 0, path: null, pos: 0 });
  state.ver++;
  simEvent(state, { kind: 'built', id: b.id });
  return { ok: true, b };
}

// Road tiles: '' or the reason for one tile.
function canRoad(state, x, y) {
  if (!inMap(x, y)) return 'Off the island';
  const i = tileIdx(x, y), t = state.terrain[i];
  if (t === SEA) return 'Cannot build on the sea';
  if (t === FOREST) return 'Forest in the way';
  if (!tileOpenAt(state, i)) return 'Land opens at ' + regionStageName(state, i);
  if (occMap(state)[i]) return 'Something is in the way';
  return '';
}

// The road the road tool lays now: 1 dirt, 2 paved (chosen on the build bar; not saved).
function roadKindNow(state, kind) { return kind || (state._roadKind === 2 && state.stage >= PAVED_STAGE ? 2 : 1); }

function roadTileCost(kind) { return kind === 2 ? TUNE.pavedCost : TUNE.roadCost; }

// Plans a stroke: which tiles are new (or dirt to pave), which are blocked (and why), and the cost of the new ones.
function roadPlan(state, tiles, kind) {
  kind = roadKindNow(state, kind);
  const add = [], bad = [];
  for (const i of tiles) {
    const x = i % MAP_W, y = (i / MAP_W) | 0;
    if (state.road[i] >= kind) continue;
    const why = state.road[i] ? '' : canRoad(state, x, y);
    if (why) bad.push({ i, why }); else if (!add.includes(i)) add.push(i);
  }
  return { add, bad, cost: add.length * roadTileCost(kind), kind };
}

// Builds the buildable tiles of a stroke, as many as the money allows.
function placeRoad(state, tiles, kind) {
  const plan = roadPlan(state, tiles, kind), each = roadTileCost(plan.kind);
  let built = 0;
  for (const i of plan.add) {
    if (state.money < each) break;
    state.road[i] = plan.kind; state.money -= each; built++;
  }
  if (built) state.ver++;
  return { built, cost: built * each, why: plan.bad.length ? plan.bad[0].why : (built < plan.add.length ? 'Not enough money' : '') };
}

// The Governor's residence grows when bought on its card: house (Village), villa (Town), mansion (City). Each is the
// landmark in the goal of the next stage. '' when the next level can be bought now, else the reason.
function resNext(state) { return RESIDENCE[(state.res || 0) + 1] || null; }

function resWhy(state) {
  const next = resNext(state);
  if (!next) return 'Already built';
  if (next.stage > state.stage) return 'Opens at ' + STAGES[next.stage].name;
  if (state.money < next.cost) return 'Not enough money (' + money$(next.cost) + ')';
  return '';
}

function resBuild(state) {
  const why = resWhy(state);
  if (why) return { ok: false, why };
  const next = resNext(state);
  state.money -= next.cost;
  state.res = (state.res || 0) + 1;
  const r = state.b.find((b) => b.type === 'residence');
  if (r && !state.palace) r.level = state.res;
  state.ver++;
  simLog(state, "The " + next.name + ' stands on the hill.');
  simEvent(state, { kind: 'residence', id: r ? r.id : 0, level: state.res });
  return { ok: true };
}

// The Governor's palace: the residence's last stage, bought at Capital on the residence's card.
function palaceWhy(state) {
  if (state.palace) return 'Already built';
  if (state.stage < STAGES.length - 1) return 'Opens at ' + STAGES[STAGES.length - 1].name;
  if (state.money < TUNE.palaceCost) return 'Not enough money (' + money$(TUNE.palaceCost) + ')';
  return '';
}

function palaceBuild(state) {
  const why = palaceWhy(state);
  if (why) return { ok: false, why };
  state.money -= TUNE.palaceCost;
  state.palace = state.month;
  const res = state.b.find((b) => b.type === 'residence');
  if (res) res.level = STAGES.length;
  state.ver++;
  simLog(state, "The Governor's palace stands on the hill. The island is a capital.");
  simEvent(state, { kind: 'palace', id: res ? res.id : 0 });
  return { ok: true };
}

// What the remove tool would take at (x, y): { what, refund, why }.
function removeInfo(state, x, y) {
  const b = bAt(state, x, y);
  if (b) {
    if (BUILDINGS[b.type].kind === 'fixed') return { why: 'Cannot remove the ' + BUILDINGS[b.type].name.toLowerCase() };
    return { b, refund: Math.floor(BUILDINGS[b.type].cost * TUNE.refund) };
  }
  if (isRoad(state, x, y)) { const i = tileIdx(x, y); return { road: i, refund: state.stub.includes(i) ? 0 : Math.floor(roadTileCost(state.road[i]) * TUNE.refund) }; }
  return { why: 'Nothing to remove' };
}

function removeAt(state, x, y) {
  const r = removeInfo(state, x, y);
  if (r.why) return r;
  if (r.b) {
    const b = r.b;
    state.b = state.b.filter((o) => o !== b);
    // Cargo heading to the removed building goes back to its yard; the building's own cart disappears.
    for (const c of state.carts) if (c.dest === b.id && c.st === 'go') cartAbort(state, c);
    state.carts = state.carts.filter((c) => c.home !== b.id);
    for (const o of state.b) if (o.incoming) for (const g in o.incoming) if (o.incoming[g] < 0) o.incoming[g] = 0;
  } else {
    state.road[r.road] = 0;
  }
  state.money += r.refund;
  state.ver++;
  return r;
}

// ---- src/sim/economy.js
// Work, production, yards, carts on the roads, markets feeding homes, the harbor and its ship.

function popCount(state) {
  let n = 0;
  for (const b of state.b) if (b.res) n += b.res;
  return n;
}

function countType(state, type) { return state.b.filter((b) => b.type === type).length; }

// Jobs: every open building first gets one worker (food first: fishing, groves, markets; then build order),
// then they fill up building by building in the same order. So a small village still runs both hut and market.
// Half the people work, rounded up (block 4: rounded down, the first boat's 3 settlers gave one worker, so the fishing
// hut ran and the market stood empty: nobody ate, happiness fell, nobody came).
function workforceOf(pop) { return Math.ceil(pop / 2); }

function jobsAssign(state) {
  const pop = popCount(state);
  let free = workforceOf(pop), jobs = 0;
  const list = state.b.filter((b) => BUILDINGS[b.type].jobs)
    .sort((a, b) => ((BUILDINGS[a.type].food ? 0 : 1) - (BUILDINGS[b.type].food ? 0 : 1)) || (a.id - b.id));
  for (const b of list) {
    b.workers = b.open && free > 0 ? 1 : 0;
    free -= b.workers;
    if (b.open) jobs += BUILDINGS[b.type].jobs;
  }
  for (const b of list) {
    const more = b.open ? Math.min(free, BUILDINGS[b.type].jobs - b.workers) : 0;
    b.workers += more; free -= more;
  }
  state.workforce = workforceOf(pop);
  state.jobs = jobs;
  state.jobless = free;
}

function outputMult(state) { return LEVERS.wages[state.lev.wages].output; }

function prodTick(state, b) {
  const def = BUILDINGS[b.type];
  b.blocked = '';
  if (!b.open) { b.blocked = 'closed'; return; }
  if (!b.workers) { b.blocked = 'workers'; return; }
  if (b.yard >= TUNE.yardCap) { b.blocked = 'yard'; return; }
  if (def.uses) for (const g in def.uses) if ((b.inp[g] || 0) < def.uses[g] - 1e-9) { b.blocked = 'input'; return; }
  b.prog += def.rate * (b.workers / def.jobs) * outputMult(state) / TUNE.ticksPerMonth;
  if (b.prog >= 1) {
    b.prog -= 1; b.yard += 1; b.made += 1;
    if (def.uses) for (const g in def.uses) b.inp[g] = Math.max(0, (b.inp[g] || 0) - def.uses[g]);
  }
}

// The goods a home takes: those its level needs, and those of the next level once that level is open.
function homeWants(state, h) {
  const c = simCache(state), key = h.level;
  if (!c.hw) c.hw = {};
  const hit = c.hw[key];
  if (hit) return hit;
  const out = LEVELS[h.level].needs.filter((n) => NEED_GOODS.includes(n));
  const next = LEVELS[h.level + 1];
  if (next && next.stage <= state.stage) for (const n of next.needs) if (NEED_GOODS.includes(n) && !out.includes(n)) out.push(n);
  return (c.hw[key] = out);
}

// Goods a month at full occupancy (for a next-level good: half of what that level eats).
function eatRate(h, g) {
  const own = LEVELS[h.level].eats[g];
  if (own) return own;
  const next = LEVELS[h.level + 1];
  return next && next.eats[g] ? next.eats[g] * 0.5 : 0;
}

function goodNeed(g) { return GOODS[g] && GOODS[g].food ? 'food' : g; }

function marketHomes(state, mid) {
  const c = simCache(state);
  if (!c.mh) {
    c.mh = {};
    const reach = homeReach(state);
    for (const hid in reach) for (const m of reach[hid].markets) (c.mh[m] = c.mh[m] || []).push(bById(state, +hid));
  }
  return c.mh[mid] || [];
}

function marketWants(state, m, g) {
  const need = goodNeed(g);
  if (!NEED_GOODS.includes(need)) return false;
  return marketHomes(state, m.id).some((h) => homeWants(state, h).includes(need));
}

// How many units of g building d can still take (counting carts already on their way).
function roomFor(state, d, g) {
  const def = BUILDINGS[d.type];
  if (!d.open) return 0;
  if (def.kind === 'producer' && def.uses && def.uses[g] !== undefined) return TUNE.inputCap - (d.inp[g] || 0) - (d.incoming[g] || 0);
  if (def.kind === 'market' && d.workers > 0 && marketWants(state, d, g)) return TUNE.marketCap - (d.stock[g] || 0) - (d.incoming[g] || 0);
  if (def.kind === 'harbor' && d.workers > 0 && state.exp[g]) return (def.cap || TUNE.harborCap) - (d.stock[g] || 0) - (d.incoming[g] || 0);
  return 0;
}

// The island first: markets (so homes eat before the cannery takes fish), then workshops; the ship takes the rest.
// Within each: where a full cart load fits, then the nearest by road (block 3: before, only the nearest, so a harbor's
// carts took one sack at a time to the bakery next door and the bakeries across town never got flour).
function consumerFind(state, src, g) {
  let best = null;
  for (const d of state.b) {
    if (d === src) continue;
    const room = Math.floor(roomFor(state, d, g) + 1e-9);
    if (room < 1) continue;
    const kind = BUILDINGS[d.type].kind;
    const cls = kind === 'market' ? 0 : kind === 'harbor' ? 2 : 1;
    const dist = roadDist(state, src, d).d;
    if (!isFinite(dist)) continue;
    const part = room < TUNE.cartLoad ? 1 : 0;
    if (!best || cls < best.cls || (cls === best.cls && (part < best.part || (part === best.part && dist < best.dist)))) best = { d, room, cls, dist, part };
  }
  return best;
}

// Why a producer's goods do not leave: 'none' (nothing takes them), 'unreached' (no road to a taker), 'full'.
function takerState(state, b) {
  const g = BUILDINGS[b.type].makes;
  let exists = false, reached = false;
  for (const d of state.b) {
    if (d === b) continue;
    const def = BUILDINGS[d.type];
    const could = (def.uses && def.uses[g] !== undefined) || (def.kind === 'market' && NEED_GOODS.includes(goodNeed(g))) || (def.kind === 'harbor' && state.exp[g]);
    if (!could) continue;
    exists = true;
    if (isFinite(roadDist(state, b, d).d)) reached = true;
  }
  return !exists ? 'none' : !reached ? 'unreached' : 'full';
}

function cartSource(state, b) {
  const def = BUILDINGS[b.type];
  if (def.kind === 'harbor') return { g: 'flour', have: Math.floor(b.flour + 1e-9) };
  return { g: def.makes, have: b.yard };
}

function cartDispatch(state, c, b) {
  if (!b.open) return;
  const { g, have } = cartSource(state, b);
  if (have < 1) return;
  const best = consumerFind(state, b, g);
  b.noTaker = !best;
  if (!best) return;
  const path = roadPath(state, b, best.d);
  if (!path) return;
  const n = Math.min(TUNE.cartLoad, have, best.room);
  if (BUILDINGS[b.type].kind === 'harbor') b.flour -= n; else b.yard -= n;
  best.d.incoming[g] = (best.d.incoming[g] || 0) + n;
  Object.assign(c, { st: 'go', good: g, n, dest: best.d.id, path, pos: 0, ver: state.ver });
}

function cartPathOk(state, c) {
  for (const i of c.path) if (!state.road[i]) return false;
  return true;
}

// Cargo goes back to where it came from; the cart is home again.
function cartAbort(state, c) {
  const src = bById(state, c.home), dest = bById(state, c.dest);
  if (c.st === 'go') {
    if (dest && dest.incoming) dest.incoming[c.good] = Math.max(0, (dest.incoming[c.good] || 0) - c.n);
    if (src) { if (BUILDINGS[src.type].kind === 'harbor') src.flour += c.n; else src.yard += c.n; }
  }
  Object.assign(c, { st: 'idle', good: '', n: 0, dest: 0, path: null, pos: 0 });
}

function cartDeliver(state, c) {
  const d = bById(state, c.dest);
  if (!d) { cartAbort(state, c); return; }
  d.incoming[c.good] = Math.max(0, (d.incoming[c.good] || 0) - c.n);
  if (BUILDINGS[d.type].kind === 'producer') d.inp[c.good] = (d.inp[c.good] || 0) + c.n;
  else d.stock[c.good] = (d.stock[c.good] || 0) + c.n;
  simEvent(state, { kind: 'drop', id: d.id, good: c.good, n: c.n });
}

function cartTick(state, c) {
  const b = bById(state, c.home);
  if (!b) return;
  if (c.st === 'idle') {
    if ((state.mt + c.id) % 4 === 0) cartDispatch(state, c, b);
    return;
  }
  if (c.ver !== state.ver) {
    if (!cartPathOk(state, c)) { cartAbort(state, c); return; }
    c.ver = state.ver;
  }
  const at = c.path[Math.min(c.path.length - 1, Math.floor(c.pos))];
  c.pos += TUNE.cartSpeed * (state.road[at] === 2 ? TUNE.pavedSpeed : 1);
  if (c.pos < c.path.length - 1) return;
  if (c.st === 'go') {
    cartDeliver(state, c);
    Object.assign(c, { st: 'back', n: 0, path: c.path.slice().reverse(), pos: 0 });
  } else {
    Object.assign(c, { st: 'idle', good: '', dest: 0, path: null, pos: 0 });
  }
}

function pantryCap(h, g) { return Math.max(0.5, TUNE.pantryMonths * eatRate(h, g)); }

function marketTick(state, m) {
  if (!m.open || !m.workers) return;
  const homes = marketHomes(state, m.id);
  const n = homes.length;
  for (let k = 0; k < n; k++) {
    const h = homes[(k + state.tick) % n];
    if (!h.res) continue;
    for (const need of homeWants(state, h)) {
      let gap = pantryCap(h, need) - (h.pantry[need] || 0);
      if (gap <= 1e-6) continue;
      const goods = need === 'food' ? ['fish', 'fruit'].sort((a, b) => (m.stock[b] || 0) - (m.stock[a] || 0)) : [need];
      for (const g of goods) {
        const take = Math.min(gap, m.stock[g] || 0);
        if (take <= 0) continue;
        m.stock[g] -= take; h.pantry[need] = (h.pantry[need] || 0) + take; gap -= take; m.served += take;
      }
    }
  }
}

function homeTick(state, h) {
  if (!h.res) return;
  h.occTicks++;
  const occ = h.res / LEVELS[h.level].people;
  for (const need of homeWants(state, h)) {
    const left = (h.pantry[need] || 0) - eatRate(h, need) * occ / TUNE.ticksPerMonth;
    h.pantry[need] = Math.max(0, left);
    if (left <= 0) h.dry[need] = (h.dry[need] || 0) + 1;
  }
}

// Flour: the harbor orders what the bakeries can take; it is paid on payday as an import.
// With two harbors, flour already waiting at either one counts.
function harborOrder(state, hb) {
  if (!hb.open || !hb.workers) return;
  let want = 0;
  for (const b of state.b) {
    const def = BUILDINGS[b.type];
    if (def.uses && def.uses.flour && b.open) want += TUNE.inputCap - (b.inp.flour || 0) - (b.incoming.flour || 0);
    if (def.kind === 'harbor') want -= b.flour;
  }
  const buy = Math.max(0, Math.ceil(want));
  if (buy <= 0) return;
  hb.flour += buy;
  hb.bought += buy * GOODS.flour.cost;
  state.monthImports.flour = (state.monthImports.flour || 0) + buy;
}

// An open, staffed lighthouse: the ship pays 10 % more for everything.
function lighthouseOn(state) { return state.b.some((b) => BUILDINGS[b.type].gives === 'light' && b.open && b.workers > 0); }

function exportPrice(state, g) { return Math.round(GOODS[g].price * (lighthouseOn(state) ? 1 + TUNE.lighthouseBonus : 1)); }

// The steamship quay: two ships a month (one at mid-month, one at the month's end).
function quayOn(state) { return state.b.some((b) => BUILDINGS[b.type].ships > 1 && b.open && b.workers > 0); }

// The monthly ship buys what waits at the harbor and is set to export (mid: only the steamship's mid-month call).
// The money is paid on payday with the rest.
function shipSail(state, mid) {
  for (const hb of state.b) {
    const def = BUILDINGS[hb.type];
    if (def.kind !== 'harbor' || !hb.open) continue;
    if (mid && !(def.ships > 1 && hb.workers > 0)) continue;
    for (const g in hb.stock) {
      // Each ship buys up to a set number of each good (the harbor's ship 6, the steamship 12); the rest waits.
      const n = Math.min(Math.floor(hb.stock[g] + 1e-9), def.buys || TUNE.shipBuys);
      if (!n || !state.exp[g]) continue;
      hb.stock[g] -= n;
      hb.sold += n * exportPrice(state, g);
      hb.soldUnits[g] = (hb.soldUnits[g] || 0) + n;
      state.exported[g] = (state.exported[g] || 0) + n;
      state.monthExported[g] = (state.monthExported[g] || 0) + n;
    }
  }
}

// ---- src/sim/people.js
// People: what each home has, levels up and down, arrivals and departures, happiness and its reasons.

function serviceOk(state, id) {
  const s = id && bById(state, id);
  return !!(s && s.open && s.workers > 0);
}

// Services a home needs in reach (a building whose "gives" is the need).
const SERVICE_NEEDS = ['church', 'school', 'clinic', 'park'];

function homeHas(state, h, need) {
  const r = homeReach(state)[h.id];
  if (!r) return false;
  if (need === 'road') return r.road;
  if (need === 'paved') return r.paved;
  if (need === 'deco') return r.deco.length > 0;
  if (need === 'market') return r.markets.some((m) => serviceOk(state, m));
  if (SERVICE_NEEDS.includes(need)) return (r.svc[need] || []).some((id) => serviceOk(state, id));
  if (!h.occTicks) return (h.pantry[need] || 0) > 0 || (need === 'food' && homeHas(state, h, 'market') && marketHasFood(state, r));
  return (h.dry[need] || 0) <= TUNE.dryShare * h.occTicks;
}

function marketHasFood(state, r) {
  return r.markets.some((id) => { const m = bById(state, id); return m && marketFood(m) > 0; });
}

// Food on a market's shelves (fish and fruit).
function marketFood(m) { return (m.stock.fish || 0) + (m.stock.fruit || 0); }

// The needs of a level this home is missing right now.
function homeMissing(state, h, level) {
  const lv = LEVELS[level];
  return lv ? lv.needs.filter((n) => !homeHas(state, h, n)) : [];
}

// Months a home must have everything before it moves up from this level (longer at the higher levels).
function levelUpMonths(level) { return TUNE.levelUpMonths[level] || 2; }

// Month end for one home: what it lacks (h.miss), what its next level still needs (h.missNext), and whether it
// moves up or down a level. h.lacks / h.wants are what the map shows above it (see bubblesPick).
function homeMonth(state, h) {
  h.miss = homeMissing(state, h, h.level);
  const next = LEVELS[h.level + 1];
  h.missNext = next && next.stage <= state.stage ? homeMissing(state, h, h.level + 1) : [];
  if (h.res > 0 && next && next.stage <= state.stage && h.missNext.length === 0) h.up++; else h.up = 0;
  if (h.res > 0 && h.miss.length && h.level > 1) h.down++; else h.down = 0;
  if (h.up >= levelUpMonths(h.level)) {
    h.level++; h.up = 0; h.down = 0;
    state.stats.levelUps++;
    simEvent(state, { kind: 'levelup', id: h.id, level: h.level });
  } else if (h.down >= TUNE.levelDownMonths) {
    h.level--; h.down = 0;
    const cap = LEVELS[h.level].people;
    if (h.res > cap) { walkersSpawn(state, h, h.res - cap, false); h.res = cap; }
    // A mark stays over it until she taps it (state.downs: home id -> month); Rosa explains the first one.
    if (!state.downs) state.downs = {};
    state.downs[h.id] = state.month;
    const text = 'A ' + LEVELS[h.level + 1].name.toLowerCase() + ' became a ' + LEVELS[h.level].name.toLowerCase() + ' again: it lacked ' + h.miss.map((n) => NEED_NAMES[n]).join(', ') + '.';
    simEvent(state, { kind: 'leveldown', id: h.id, level: h.level, text });
    simLog(state, text);
    if (!state.guide.seen.down) state.guide.pendDown = { id: h.id, text };
  }
  h.dry = {}; h.occTicks = 0;
}

// Fewer bubbles: every home shows at most one bubble, its most important missing thing (the first of its needs in the
// level's order: road, market, food, bread, church, ...); when more than 3 homes show the same thing, only one home
// per small area (6 x 6 tiles) carries it, and Rosa says the count once ("8 homes lack bread · build a bakery").
// Sets h.lacks and h.wants (what the renderer draws: red = lacks, white = one thing short of the next level) and
// state.lackCount / state.wantCount { need: homes } (every home that misses it, bubble or not).
function bubblesPick(state) {
  const homes = homesOccupied(state);
  const pick = (field, out, skip) => {
    const count = {}, by = {};
    for (const h of homes) {
      for (const n of h[field] || []) count[n] = (count[n] || 0) + 1;
      const top = skip && skip(h) ? null : (h[field] || [])[0];
      if (top) (by[top] = by[top] || []).push(h);
    }
    const shown = {};
    for (const n in by) {
      const list = by[n];
      if (list.length <= TUNE.bubbleAll) { for (const h of list) shown[h.id] = n; continue; }
      const cells = {};
      for (const h of list) {
        const key = Math.floor(h.x / TUNE.bubbleCell) + ',' + Math.floor(h.y / TUNE.bubbleCell);
        if (!cells[key]) { cells[key] = 1; shown[h.id] = n; }
      }
    }
    for (const h of state.b) if (h.type === 'casita') h[out] = h.res && shown[h.id] ? [shown[h.id]] : [];
    return count;
  };
  state.lackCount = pick('miss', 'lacks');
  // A home that lacks something shows only that (red), not its next level's need.
  state.wantCount = pick('missNext', 'wants', (h) => (h.miss || []).length > 0);
}

function freeBeds(state) {
  let n = 0;
  for (const h of state.b) if (h.type === 'casita') n += LEVELS[h.level].people - h.res;
  return n;
}

function homesOccupied(state) { return state.b.filter((b) => b.type === 'casita' && b.res > 0); }

// How many settlers the boat can bring this month: 4 + 2 % of the people, at most 12; with a steamship quay twice
// that, at most 24. Steady, not exponential (block 3; was 4 + 5 % without a cap).
function shipSettlers(state) {
  const q = quayOn(state);
  return Math.min(q ? TUNE.quayArrivalCap : TUNE.arrivalCap, (TUNE.arrivalBase + Math.floor(TUNE.arrivalPct * popCount(state))) * (q ? 2 : 1));
}

// Arrivals with the boat (happiness >= 50 and free beds); departures when happiness < 35.
function peopleMonth(state) {
  const pop = popCount(state);
  state.lastMoves = { came: 0, left: 0 };
  // While the first market and food building have not stood a full month, settlers come whatever the happiness (they
  // bring their own food) and nobody leaves: the island is still being laid out (block 4, the playtest's first minutes).
  if (state.happy >= TUNE.happyArrive || !foodStood(state)) {
    let n = Math.min(freeBeds(state), shipSettlers(state));
    state.lastMoves.came = n;
    for (const h of state.b) {
      if (n <= 0) break;
      if (h.type !== 'casita') continue;
      const k = Math.min(n, LEVELS[h.level].people - h.res);
      if (k <= 0) continue;
      // Settlers bring provisions for their first month; an empty home is judged from next month on.
      if (!h.res) { h.miss = []; h.lacks = []; }
      h.pantry.food = (h.pantry.food || 0) + LEVELS[h.level].eats.food * k / LEVELS[h.level].people;
      h.res += k; n -= k;
      walkersSpawn(state, h, k, true);
    }
  } else if (state.happy < TUNE.happyLeave && pop > 0 && foodStood(state)) {
    let n = Math.max(1, Math.round(TUNE.leavePct * pop));
    state.lastMoves.left = n;
    const homes = homesOccupied(state).sort((a, b) => (b.miss.length - a.miss.length) || (b.id - a.id));
    for (const h of homes) {
      if (n <= 0) break;
      const k = Math.min(n, h.res);
      h.res -= k; n -= k;
      walkersSpawn(state, h, k, false);
    }
  }
  if (state.lastMoves.came) simLog(state, plural(state.lastMoves.came, 'settler', 'settlers') + ' arrived.');
  if (state.lastMoves.left) simLog(state, plural(state.lastMoves.left, 'person', 'people') + ' left the island (happiness ' + state.happy + ').');
}

// "1 person", "3 people".
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

// Nobody leaves before the island had a fair chance to eat (block 4, the playtest: people left in the first minute,
// while she was still placing the market): a market and a food building must both have stood a full month.
function foodStood(state) {
  const old = (b) => b.built <= state.month - 1;
  return state.b.some((b) => b.type === 'market' && old(b)) && state.b.some((b) => BUILDINGS[b.type].food && BUILDINGS[b.type].makes && old(b));
}

// Happiness: 50 plus a few visible parts. Returns { value, parts: [{label, v}] }.
function happyCalc(state) {
  const parts = [];
  const homes = homesOccupied(state);
  if (homes.length) {
    const fed = homes.filter((h) => !(h.miss || []).includes('food')).length / homes.length;
    const food = fed === 1 ? 15 : fed >= 0.75 ? 5 : fed >= 0.5 ? -10 : -25;
    parts.push({ label: fed === 1 ? 'Every home has food' : 'Homes without food', v: food });
    const met = homes.filter((h) => (h.miss || []).every((n) => n === 'food')).length / homes.length;
    parts.push({ label: 'Homes have what their level needs', v: Math.round(10 * met) });
    if (state.stage >= 1) {
      const ch = homes.filter((h) => homeHas(state, h, 'church')).length / homes.length;
      parts.push({ label: ch > 0 ? 'A church nearby' : 'No church nearby', v: Math.round(10 * ch) });
    }
    const deco = homes.filter((h) => homeHas(state, h, 'deco')).length / homes.length;
    if (deco > 0) parts.push({ label: 'Decorations near homes', v: Math.round(TUNE.decoHappy * deco) });
    if (state.b.some((b) => b.type === 'cathedral' && b.open && b.workers > 0)) parts.push({ label: 'The cathedral', v: TUNE.cathedralHappy });
    if (state.palace) parts.push({ label: "The Governor's palace", v: TUNE.palaceHappy });
  }
  const rent = LEVERS.rent[state.lev.rent].happy, wages = LEVERS.wages[state.lev.wages].happy;
  if (rent) parts.push({ label: 'Rent ' + state.lev.rent, v: rent });
  if (wages) parts.push({ label: 'Wages ' + state.lev.wages, v: wages });
  if (state.workforce > 0) {
    const u = state.jobless / state.workforce;
    if (state.jobs === 0) parts.push({ label: 'No jobs at all', v: -20 });
    else if (u > 0.2) parts.push({ label: plural(state.jobless, 'person', 'people') + ' without work', v: -10 });
    else if (state.jobless > 0) parts.push({ label: plural(state.jobless, 'person', 'people') + ' without work', v: -3 });
  }
  const value = Math.max(0, Math.min(100, 50 + parts.reduce((s, p) => s + p.v, 0)));
  return { value, parts };
}

// The three biggest reasons, largest effect first.
function happyReasons(state) {
  return happyCalc(state).parts.filter((p) => p.v !== 0).sort((a, b) => Math.abs(b.v) - Math.abs(a.v)).slice(0, 3);
}

// Walking people: drawn only, never saved, never part of the rules.
function walkersSpawn(state, h, n, arriving) {
  const pier = state.b.find((b) => b.type === 'pier');
  if (!pier || !state.walk) return;
  const path = roadPath(state, pier, h);
  if (!path || !path.length) return;
  for (let k = 0; k < Math.min(n, 6); k++) {
    if (state.walk.length > 60) return;
    state.walk.push({ path: arriving ? path : path.slice().reverse(), pos: -k * 1.2, off: ((h.id * 7 + k * 3) % 10) / 10 - 0.45, arriving });
  }
}

function walkersTick(state) {
  if (!state.walk) return;
  for (const w of state.walk) w.pos += 0.12;
  state.walk = state.walk.filter((w) => w.pos < w.path.length - 1);
}

// ---- src/sim/payday.js
// Payday: every building has one number a month; the month's result is their sum.

// { n, rent, wages, upkeep, exports, imports } for one building at this moment of the month.
function bNumber(state, b) {
  const def = BUILDINGS[b.type];
  const out = { n: 0, rent: 0, wages: 0, upkeep: 0, exports: 0, imports: 0 };
  if (def.kind === 'home') {
    const lv = LEVELS[b.level];
    out.rent = Math.round(lv.rent * LEVERS.rent[state.lev.rent].mult * b.res / lv.people * (operaNear(state, b) ? 1 + TUNE.operaRent : 1));
  } else if (def.jobs) {
    out.wages = Math.round(b.workers * wageNow(state) * LEVERS.wages[state.lev.wages].mult);
    out.upkeep = Math.round(def.cost * TUNE.upkeepPct * (b.open ? 1 : TUNE.closedUpkeep));
    if (def.kind === 'harbor') { out.exports = b.sold; out.imports = b.bought; }
  }
  out.n = out.rent + out.exports - out.wages - out.upkeep - out.imports;
  return out;
}

// An open, staffed opera house within its reach: the home pays 10 % more rent.
function operaNear(state, h) {
  const r = homeReach(state)[h.id];
  return !!(r && (r.svc.opera || []).some((id) => serviceOk(state, id)));
}

// What a building would add a month if built now (shown on the build bar and the ghost).
function bForecast(state, type) {
  const def = BUILDINGS[type];
  if (def.kind === 'home') return Math.round(LEVELS[1].rent * LEVERS.rent[state.lev.rent].mult);
  if (!def.jobs) return 0;
  return -(Math.round(def.jobs * wageNow(state) * LEVERS.wages[state.lev.wages].mult) + Math.round(def.cost * TUNE.upkeepPct));
}

// A worker's monthly wage at "fair": it rises with each stage (TUNE.stageWage).
function wageNow(state) { return TUNE.stageWage[Math.min(state.stage, TUNE.stageWage.length - 1)]; }

function paydayRun(state) {
  const r = { month: state.month, rent: 0, exports: 0, wagesUpkeep: 0, imports: 0, result: 0, lines: [] };
  for (const b of state.b) {
    const x = bNumber(state, b);
    if (BUILDINGS[b.type].kind === 'fixed') continue;
    r.rent += x.rent; r.exports += x.exports; r.wagesUpkeep += x.wages + x.upkeep; r.imports += x.imports;
    r.result += x.n;
    r.lines.push({ id: b.id, n: x.n });
    if (x.n) simEvent(state, { kind: 'money', id: b.id, n: x.n });
    if (b.sold !== undefined) { b.lastSold = b.sold; b.lastBought = b.bought; b.sold = 0; b.bought = 0; b.soldUnits = {}; }
  }
  r.soldUnits = Object.assign({}, state.monthExported);
  state.money += r.result;
  state.lastReceipt = r;
  state.history.push({ m: state.month, money: state.money, pop: popCount(state), result: r.result, happy: state.happy, stage: state.stage });
  if (state.history.length > 240) state.history.shift();
  simEvent(state, { kind: 'payday', receipt: r });
  return r;
}

// The month in at most eight lines, for the receipt.
function receiptLines(state, r) {
  const lines = [['Rent from homes', r.rent], ['Exports (the ship)', r.exports], ['Wages and upkeep', -r.wagesUpkeep]];
  if (r.imports) lines.push(['Imports (flour)', -r.imports]);
  const top = r.lines.filter((l) => l.n < 0).sort((a, b) => a.n - b.n).slice(0, 3);
  for (const l of top) { const b = bById(state, l.id); if (b) lines.push(['  ' + BUILDINGS[b.type].name, l.n]); }
  return lines.slice(0, 7);
}

// ---- src/sim/stages.js
// Stages: Settlement -> Village -> Town -> City -> Port city -> Capital (then the palace). The pill shows the next one.

function homesAtLevel(state, level) { return state.b.filter((b) => b.type === 'casita' && b.level >= level && b.res > 0).length; }

function allHomesFed(state) {
  const homes = homesOccupied(state);
  return homes.length > 0 && homes.every((h) => !(h.miss || []).includes('food'));
}

// { stage, next, conds: [{ label, ok }] } for the next stage. After the last stage the goal is the Governor's palace
// (next.goal: it is bought on the residence's card, not reached); after the palace next is null.
function stageConds(state) {
  const next = STAGES[state.stage + 1];
  if (!next) {
    if (state.palace) return { next: null, conds: [] };
    return { next: { name: "the Governor's palace", goal: true }, conds: [{ label: money$(Math.min(state.money, TUNE.palaceCost)) + ' / ' + money$(TUNE.palaceCost), ok: state.money >= TUNE.palaceCost }] };
  }
  const conds = [];
  const pop = popCount(state);
  if (next.people) conds.push({ label: pop + ' / ' + next.people + ' people', ok: pop >= next.people });
  if (next.allFed) conds.push({ label: 'every home has food', ok: allHomesFed(state) });
  if (next.houses) { const n = homesAtLevel(state, 2); conds.push({ label: Math.min(n, next.houses) + ' / ' + next.houses + ' Houses', ok: n >= next.houses }); }
  if (next.rum) conds.push({ label: 'rum exported', ok: (state.exported.rum || 0) > 0 });
  if (next.villas) { const n = homesAtLevel(state, 3); conds.push({ label: Math.min(n, next.villas) + ' / ' + next.villas + ' Villas', ok: n >= next.villas }); }
  if (next.townhouses) { const n = homesAtLevel(state, 4); conds.push({ label: Math.min(n, next.townhouses) + ' / ' + next.townhouses + ' Townhouses', ok: n >= next.townhouses }); }
  if (next.mansions) { const n = homesAtLevel(state, 5); conds.push({ label: Math.min(n, next.mansions) + ' / ' + next.mansions + ' Mansions', ok: n >= next.mansions }); }
  // The landmark: the residence's next level (bought on its card) or a building; its price shows until it stands.
  const lm = next.landmark;
  if (lm && lm.res) { const ok = (state.res || 0) >= lm.res; conds.push({ label: RESIDENCE[lm.res].name + (ok ? '' : ' ' + money$(RESIDENCE[lm.res].cost)), ok, landmark: true }); }
  if (lm && lm.b) { const ok = countType(state, lm.b) > 0; conds.push({ label: 'a ' + BUILDINGS[lm.b].name.toLowerCase() + (ok ? '' : ' ' + money$(BUILDINGS[lm.b].cost)), ok, landmark: true }); }
  return { next, conds };
}

// What a stage opens, for the stage card: its buildings, the home level, paved roads, the palace.
function stageOpens(stage) {
  const list = BUILD_ORDER.filter((t) => BUILDINGS[t].stage === stage).map((t) => BUILDINGS[t].name);
  if (stage === PAVED_STAGE) list.push('Paved road (carts twice as fast)');
  const lv = LEVELS.findIndex((l) => l && l.stage === stage && stage > 0);
  if (lv > 0) list.push('Homes can become ' + LEVELS[lv].name + 's (' + LEVELS[lv].people + ' people)');
  const res = RESIDENCE.find((r) => r.stage === stage && r.cost);
  if (res) list.push('The ' + res.name + ' (' + money$(res.cost) + ', on the residence\'s card): the landmark for ' + STAGES[stage + 1].name);
  const lmB = STAGES[stage + 1] && STAGES[stage + 1].landmark && STAGES[stage + 1].landmark.b;
  if (lmB) list.push('The ' + BUILDINGS[lmB].name.toLowerCase() + ' is the landmark for ' + STAGES[stage + 1].name);
  if (stage === STAGES.length - 1) list.push("The Governor's palace (" + money$(TUNE.palaceCost) + ')');
  return list;
}

function stageCheck(state) {
  const { next, conds } = stageConds(state);
  if (!next || next.goal || conds.length === 0 || !conds.every((c) => c.ok)) return false;
  state.stage++;
  state.stageMonth[state.stage] = state.month;
  state.ver++;
  simLog(state, next.name + '! New: ' + stageOpens(state.stage).join(', ') + ', and new land.');
  simEvent(state, { kind: 'stage', stage: state.stage });
  guideStageHint(state);
  return true;
}

// ---- src/sim/guide.js
// The guide (Rosa): three first steps, then one line only when a problem has lasted two months: cause, fix, one button.

const GUIDE_INTRO = [
  { key: 'i-road', text: 'Draw a road from the pier: drag along the ground.', btn: 'Road', act: { tool: 'road' },
    done: (s) => s.road.reduce((a, v) => a + v, 0) > s.stub.length + 2 },
  { key: 'i-homes', text: 'Build three homes along the road. Settlers come at the end of the month.', btn: 'Home', act: { tool: 'casita' },
    done: (s) => countType(s, 'casita') >= 3 },
  { key: 'i-food', text: 'Homes need food: a fishing hut on the beach and a market near the homes.', btn: 'Fishing hut', act: { tool: 'fishing' },
    done: (s) => countType(s, 'fishing') + countType(s, 'grove') >= 1 && countType(s, 'market') >= 1 },
];

function guideSay(state, msg) {
  if (state.guide.msg && state.guide.msg.key === msg.key && state.guide.msg.text === msg.text) return;
  state.guide.msg = msg;
  simLog(state, msg.text);
  simEvent(state, { kind: 'guide' });
}

function guideIntro(state) {
  const g = state.guide;
  while (g.step < GUIDE_INTRO.length && GUIDE_INTRO[g.step].done(state)) g.step++;
  if (g.step < GUIDE_INTRO.length) {
    const s = GUIDE_INTRO[g.step];
    const busy = g.msg && !g.msg.key.startsWith('i-');
    if (!busy && (!g.msg || g.msg.key !== s.key) && !(g.snooze[s.key] > state.month)) guideSay(state, { key: s.key, text: s.text, btn: s.btn, act: s.act });
  } else if (g.msg && g.msg.key.startsWith('i-')) {
    g.msg = null;
    if (!g.seen.paydayHint) { g.seen.paydayHint = 1; guideSay(state, { key: 'hint-payday', text: 'Good. Each home pays rent on payday, at the end of the month. More homes, more settlers.', btn: 'OK', act: {} }); }
  }
}

// The biggest monthly cost on the last receipt (only = 'closable': skipping markets and food buildings).
function biggestCost(state, only) {
  const r = state.lastReceipt;
  if (!r) return null;
  const lines = r.lines.filter((l) => l.n < 0 && bById(state, l.id) && (only !== 'closable' || closable(bById(state, l.id))));
  const worst = lines.sort((a, b) => a.n - b.n)[0];
  const b = worst && bById(state, worst.id);
  return b ? { b, n: -worst.n } : null;
}

// Rosa never suggests closing a market or a food building (block 4: in the playtest she advised closing the market
// that fed everyone): closing them starves the homes. Food buildings are everything on the build bar's Food tab
// (block 5: she still told Tugba to close a bakery with a full yard; bakery, ranch and butcher have no def.food).
function foodBuilding(b) { const def = BUILDINGS[b.type]; return !!(def.food || def.group === 'food'); }
function closable(b) { const def = BUILDINGS[b.type]; return !(def.kind === 'market' || foodBuilding(b)); }

// "rum, cigars and coffee"
function listAnd(a) { return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }

function money$(n) { return (n < 0 ? '−$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US'); }

const GOOD_TAKER = { fish: 'a market', fruit: 'a market', cane: 'a rum distillery', rum: 'a harbor or a market', bread: 'a market',
  tobacco: 'a cigar workshop', cigars: 'a harbor or a market', logs: 'a sawmill', planks: 'a harbor', beans: 'a coffee roastery',
  coffee: 'a harbor or a market', cattle: 'a butcher', meat: 'a market', tins: 'a harbor' };
// Where a workshop's input comes from (flour: its price is read at use time).
function inputSource(g) {
  const src = { cane: 'a cane field', tobacco: 'a tobacco field', logs: 'a lumber camp', beans: 'a coffee finca', cattle: 'a cattle ranch',
    fish: 'a fishing hut (the markets get fish first)', flour: 'a harbor (the ship brings flour at $' + GOODS.flour.cost + ')' };
  return src[g] || 'its supplier';
}
// The building that makes a good (for the guide's button).
function makerOf(g) { return BUILD_ORDER.find((t) => BUILDINGS[t].makes === g) || ''; }

// The cause and the fix for a full yard, in one line.
function yardText(s, b) {
  const def = BUILDINGS[b.type], g = GOODS[def.makes].name.toLowerCase(), name = def.name.toLowerCase();
  const why = takerState(s, b);
  if (why === 'none') return 'The ' + name + '’s yard is full: nobody takes the ' + g + '. Build ' + GOOD_TAKER[def.makes] + ' on its road.';
  if (why === 'unreached') return 'The ' + name + ' has no road to ' + GOOD_TAKER[def.makes] + '. Join its road to theirs (Show marks both).';
  const cart = s.carts.find((c) => c.home === b.id);
  if (cart && cart.st !== 'idle' && cart.path && cart.path.length > 14) {
    return 'The ' + name + '’s cart is on a long road (' + (cart.path.length - 1) + ' tiles) and its yard is full. ' +
      (s.stage >= PAVED_STAGE ? 'Pave the road: carts go twice as fast.' : 'Build the ' + GOOD_TAKER[def.makes].replace(/^an? /, '') + ' closer.');
  }
  const cost = -bNumber(s, b).n;
  const exp = EXPORTABLE.includes(def.makes) && !s.exp[def.makes] && countHarbors(s) ? ', or export ' + g + ' at the desk' : '';
  if (foodBuilding(b)) return 'The ' + name + ' makes more ' + g + ' than the island eats: its yard is full. More homes will eat it' + exp + '.';
  return 'The ' + name + ' makes more ' + g + ' than the island uses: its yard is full. Close it to save $' + cost + ' a month' + exp + '.';
}

function countHarbors(s) { return s.b.filter((b) => BUILDINGS[b.type].kind === 'harbor').length; }

// "8 homes lack bread · build a bakery": the cause of a need many homes miss, and its one fix (a tool to build).
function needFix(s, need) {
  const name = (t) => BUILDINGS[t].name.toLowerCase();
  if (NEED_GOODS.includes(need) && need !== 'food') {
    const maker = makerOf(need), def = BUILDINGS[maker];
    const raw = def.uses ? Object.keys(def.uses)[0] : '';
    if (raw && raw !== 'flour' && !countType(s, makerOf(raw)) && countType(s, maker)) return { text: 'the ' + name(maker) + ' needs ' + inputSource(raw), tool: makerOf(raw) };
    if (raw === 'flour' && !countHarbors(s)) return { text: 'a bakery needs flour from a harbor', tool: 'harbor' };
    if (!countType(s, maker)) return { text: 'build ' + (raw && raw !== 'flour' ? inputSource(raw) + ' and a ' + name(maker) : 'a ' + name(maker)), tool: raw && raw !== 'flour' ? makerOf(raw) : maker };
    return { text: 'build another ' + name(maker) + ', or a market nearer', tool: maker };
  }
  if (need === 'paved') return { text: 'pave the street in front of them', tool: 'paved' };
  if (need === 'deco') return { text: 'place a garden, palms or a fountain near them (no road needed)', tool: 'garden' };
  if (need === 'food') return { text: 'build another fishing hut or fruit grove', tool: 'grove' };
  const t = NEED_FIX[need];
  return { text: 'build a ' + (t === 'chapel' ? 'chapel' : name(t)) + ' near them', tool: t };
}

// The most common thing homes miss (field 'miss' or 'missNext'), skipping food, market and road (said elsewhere).
function topNeed(s, field) {
  const by = {};
  for (const h of homesOccupied(s)) for (const n of h[field] || []) if (!['food', 'market', 'road'].includes(n)) by[n] = (by[n] || 0) + 1;
  let best = null;
  for (const n in by) if (!best || by[n] > by[best]) best = n;
  return best ? { need: best, n: by[best] } : null;
}

// Each check returns null or a message; the first one that has lasted two months is said.
const GUIDE_PROBLEMS = [
  { key: 'red', check(s) {
    if (s.money >= 0) return null;
    // Below zero nothing can be bought: the levers are closing a workshop (never a market or a food building) and rent.

      btn: 'Show', act: { select: c.b.id } };
