// ---- src/ui/space.js
// The map explains space (block 4, the playtest's verdict): what the renderer draws over the ground while she builds
// or looks, worked out here from the rules and handed over as APP.ui.space each frame.
//   valid: while a building tool is armed, the tiles where its footprint can go (softly lit; the rest dimmed). When
//          there are none in the open land, Rosa says the one step that creates one and the tool's button shows it.
//   reach: while a market, service or decoration is selected or being placed, its reach (a square of straight-line
//          tiles around it) and the homes in it: in reach, near but no road joins them, or just out of reach.
//   roads: for a building whose goods have no road to a taker (or a home near a market on another road), its own
//          road piece in red and the network it should join in green (the card's and Rosa's Show button).

// Anchors (x, y) where `type` fits now, ignoring money; cached per change of roads, buildings or stage.
function spotsFor(s, type, opts) {
  const key = s.ver + '|' + s.stage + '|' + type + (opts && opts.noRoad ? '|nr' : '');
  APP.spots = APP.spots || {};
  const hit = APP.spots[type + (opts && opts.noRoad ? '|nr' : '')];
  if (hit && hit.key === key) return hit;
  const def = BUILDINGS[type], tiles = new Uint8Array(MAP_W * MAP_H), anchors = [];
  const o = Object.assign({ free: true }, opts || {});
  for (let y = 0; y <= MAP_H - def.h; y++) for (let x = 0; x <= MAP_W - def.w; x++) {
    if (canPlace(s, type, x, y, o) !== '') continue;
    anchors.push([x, y]);
    for (let ty = y; ty < y + def.h; ty++) for (let tx = x; tx < x + def.w; tx++) tiles[tileIdx(tx, ty)] = 1;
  }
  const r = { key, tiles, anchors, n: anchors.length };
  APP.spots[type + (opts && opts.noRoad ? '|nr' : '')] = r;
  return r;
}

// When a tool has no spot at all: the one step that makes one, as Rosa's line and a few words for the button.
function noSpotHint(s, type) {
  const def = BUILDINGS[type];
  if (!def || def.kind === 'fixed' || def.stage > s.stage || spotsFor(s, type).n) return null;
  const name = def.name.toLowerCase();
  const withRoad = spotsFor(s, type, { noRoad: true }).n > 0;
  if (!withRoad) {
    const next = STAGES[s.stage + 1];
    return { short: 'no room', text: 'There is no room left for a ' + name + ' in the open land' + (next ? ': new land opens at ' + next.name + '.' : '.') + ' The Remove tool clears a spot.', btn: 'OK', act: {} };
  }
  if (def.site === 'coast') return { short: 'beach road first', text: 'Lay a road along the beach first: the ' + name + ' stands on the coast, next to a road.', btn: 'Road', act: { tool: 'road' } };
  if (def.site === 'beach') return { short: 'beach road first', text: 'Lay a road down to the beach first: the ' + name + ' stands on the sand by the sea, next to a road.', btn: 'Road', act: { tool: 'road' } };
  if (def.site === 'forest') return { short: 'forest road first', text: 'Lay a road to the edge of the forest first: the ' + name + ' stands next to the trees, by a road.', btn: 'Road', act: { tool: 'road' } };
  return { short: 'road first', text: 'Lay a road into open grass first: the ' + name + ' needs a road next to it.', btn: 'Road', act: { tool: 'road' } };
}

// A tap or a finger at (sx, sy) with a building tool: the nearest footprint that fits, within 2 tiles of the finger
// (a 2 x 2 market snaps beside the road instead of over it). { x, y, why }: why is '' when it can be built here.
function snapFoot(type, sx, sy) {
  const s = APP.state, def = BUILDINGS[type], t = screenToTile(APP.R, APP.view, sx, sy);
  const cx = Math.round(t.x - def.w / 2), cy = Math.round(t.y - def.h / 2);
  const sp = spotsFor(s, type);
  let best = null;
  if (sp.n) {
    const fx = Math.floor(t.x), fy = Math.floor(t.y);
    for (let y = fy - def.h - 2; y <= fy + 2; y++) for (let x = fx - def.w - 2; x <= fx + 2; x++) {
      if (!inMap(x, y) || !sp.tiles[tileIdx(x, y)]) continue;
      if (canPlace(s, type, x, y, { free: true }) !== '') continue;
      // distance from the finger to the footprint (0 inside), then to its centre
      const gx = Math.max(x - t.x, 0, t.x - (x + def.w)), gy = Math.max(y - t.y, 0, t.y - (y + def.h));
      const edge = Math.max(gx, gy);
      if (edge > 2) continue;
      const d = edge * 4 + Math.hypot(x + def.w / 2 - t.x, y + def.h / 2 - t.y);
      if (!best || d < best.d) best = { x, y, d };
    }
  }
  if (!best) return { x: cx, y: cy, why: canPlace(s, type, cx, cy) || 'No room here' };
  return { x: best.x, y: best.y, why: s.money < def.cost ? 'Not enough money (' + money$(def.cost) + ')' : '' };
}

// The reach picture of a market, service or decoration standing (b) or planned (ghost {type, x, y}).
function reachPicture(s, b) {
  const def = BUILDINGS[b.type];
  if (!def || !(def.kind === 'market' || def.kind === 'service' || def.kind === 'deco') || def.gives === 'light') return null;
  const R = bReach(def), foot = { x: b.x, y: b.y, w: def.w, h: def.h };
  const homes = [];
  for (const h of s.b) {
    if (h.type !== 'casita') continue;
    const d = footDist(foot, h);
    if (d > R + 2) continue;
    let st = d > R ? 'out' : 'in';
    if (st === 'in' && def.kind !== 'deco' && !roadJoined(s, foot, h)) st = 'cut';
    homes.push({ id: h.id, x: h.x, y: h.y, st, d });
  }
  return { x0: b.x - R, y0: b.y - R, x1: b.x + def.w + R, y1: b.y + def.h + R, homes, R, deco: def.kind === 'deco', name: def.name };
}

// Road tiles of the given network ids.
function netTiles(s, ids) {
  const net = roadNets(s), out = [];
  if (!ids.length) return out;
  for (let i = 0; i < net.length; i++) if (net[i] && ids.includes(net[i])) out.push(i);
  return out;
}

// The two road pieces to join: { own: [tiles], net: [tiles], b, why } for a building whose goods have no road to a
// taker, or a home near a market or service on another road. null when nothing is cut off.
function roadsPicture(s, id) {
  const b = bById(s, id);
  if (!b) return null;
  const def = BUILDINGS[b.type], mine = bNets(s, b);
  let targets = [];
  if (def.kind === 'home') {
    const r = homeReach(s)[b.id];
    if (r) for (const tid of r.cut) { const t = bById(s, tid); if (t) targets.push(t); }
  } else if (def.kind === 'producer') {
    const g = def.makes;
    for (const d of s.b) {
      if (d === b) continue;
      const dd = BUILDINGS[d.type];
      if ((dd.uses && dd.uses[g] !== undefined) || (dd.kind === 'market' && NEED_GOODS.includes(goodNeed(g))) || (dd.kind === 'harbor' && s.exp[g])) targets.push(d);
    }
  }
  if (!targets.length) {
    // Anything else: join the pier's network (where the settlers and the ship come in).
    const pier = s.b.find((o) => o.type === 'pier');
    if (pier) targets.push(pier);
  }
  const tn = [];
  for (const t of targets) for (const k of bNets(s, t)) if (!tn.includes(k) && !mine.includes(k)) tn.push(k);
  if (!tn.length && mine.length) return null;
  return { b, own: netTiles(s, mine), net: netTiles(s, tn), noRoad: !mine.length };
}

// Shows the two road pieces: the view moves to the gap between them (the nearest pair of tiles).
function roadsShow(id) {
  const s = APP.state, q = roadsPicture(s, id);
  APP.ui.roadShow = id;
  if (!q || !q.net.length) return;
  const own = q.own.length ? q.own : [tileIdx(q.b.x, q.b.y)];
  let best = null;
  for (const a of own) for (const b of q.net) {
    const d = Math.abs(a % MAP_W - b % MAP_W) + Math.abs(((a / MAP_W) | 0) - ((b / MAP_W) | 0));
    if (!best || d < best.d) best = { a, b, d };
  }
  // the card covers the lower half (portrait, phone) or the right side (landscape): put the gap in the open part
  const narrow = window.innerWidth <= 900, z = APP.view.z;
  let cx = (best.a % MAP_W + best.b % MAP_W) / 2 + 0.5, cy = (((best.a / MAP_W) | 0) + ((best.b / MAP_W) | 0)) / 2 + 0.5;
  if (narrow) { const k = 0.2 * window.innerHeight / z; cx += k; cy += k; } else { const k = 170 / (2 * z); cx += k; cy -= k; }
  viewFocus(cx, cy);
}

// Whether a building is cut off (its card offers the Show button).
function cutOff(s, b) {
  const def = BUILDINGS[b.type];
  if (def.kind === 'home') { const r = homeReach(s)[b.id]; return !!(r && r.cut.length && !r.markets.length); }
  if (def.kind === 'producer') return b.blocked === 'yard' && takerState(s, b) === 'unreached';
  return false;
}

// Each frame: what the renderer should draw over the ground.
function spaceUpdate() {
  const s = APP.state, ui = APP.ui, out = { key: '' };
  const tool = ui.tool;
  if (BUILDINGS[tool]) {
    const sp = spotsFor(s, tool);
    out.valid = sp;
    out.key += 'v' + sp.key;
  }
  // reach: the ghost of a market, service or decoration, else the selected one
  const g = ui.ghost && ui.ghost.type ? ui.ghost : null;
  const src = g ? { type: g.type, x: g.x, y: g.y } : (ui.sel ? bById(s, ui.sel) : null);
  const rp = src && reachPicture(s, src);
  if (rp) { out.reach = rp; out.key += '|r' + src.type + src.x + ',' + src.y + ':' + s.ver; }
  if (ui.roadShow) {
    const rs = roadsPicture(s, ui.roadShow);
    if (rs) { out.roads = rs; out.key += '|s' + ui.roadShow + ':' + s.ver; } else ui.roadShow = 0;
  }
  ui.space = out;
}

// ---- src/ui/input.js
// Touch first: tap to place, drag to draw roads, one finger pans only when no tool is armed (block 4: a pan with the
// road tool drew a road), two fingers always pan and pinch. With a building tool a finger shows the ghost where it
// would go (snapped to the nearest spot that fits); a tap builds there. "✓ Done" (or Esc, or a right-click) disarms.

const ZOOM_MIN = 14, ZOOM_MAX = 72, TAP_MOVE = 10;

function viewClamp() {
  const v = APP.view;
  v.z = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, v.z));
  v.cx = Math.max(0, Math.min(MAP_W, v.cx));
  v.cy = Math.max(0, Math.min(MAP_H, v.cy));
}

function viewFocus(tx, ty) { APP.view.cx = tx; APP.view.cy = ty; viewClamp(); }

function tileAt(sx, sy) {
  const t = screenToTile(APP.R, APP.view, sx, sy);
  return { x: Math.floor(t.x), y: Math.floor(t.y) };
}

// The tile a tap on a building means: in the isometric view a building's walls and roof stand over the tiles behind
// it, so the renderer says which building is drawn under the finger; otherwise the ground tile.
function targetAt(sx, sy) {
  const b = renderPick(APP.R, APP.view, APP.state, sx, sy);
  return b ? { x: b.x, y: b.y, b } : tileAt(sx, sy);
}

// Why a road cannot go on tile (x, y), in her words: "A house is in the way", "The market is in the way".
function roadBlockWhy(s, x, y, why) {
  const b = bAt(s, x, y);
  if (!b) return why;
  return b.type === 'casita' ? 'A house is in the way' : 'The ' + (BUILDINGS[b.type].short || BUILDINGS[b.type].name).toLowerCase() + ' is in the way';
}

// The stroke from its first tile to the finger: one clean L, one tile wide (block 4: a slanted drag drew a two-wide
// staircase). The first leg runs along the axis the finger first moved along; the stroke stops at anything in the way
// (block 4: it silently skipped a house's tile and left a hidden gap) and APP.ui.strokeBlock says what and where.
function strokeTo(x, y) {
  const s = APP.state, ui = APP.ui, a = ui.strokeA, ax = a % MAP_W, ay = (a / MAP_W) | 0;
  if (x === ax && y === ay) ui.strokeAxis = '';
  else if (!ui.strokeAxis) ui.strokeAxis = Math.abs(x - ax) >= Math.abs(y - ay) ? 'x' : 'y';
  ui.strokeBlock = null;
  const why0 = s.road[a] ? '' : canRoad(s, ax, ay);
  if (why0) { ui.stroke = []; ui.strokeBlock = { i: a, why: roadBlockWhy(s, ax, ay, why0) }; return; }
  const tiles = [a];
  let cx = ax, cy = ay;
  const legs = ui.strokeAxis === 'y' ? [['y', y], ['x', x]] : [['x', x], ['y', y]];
  for (const [axis, target] of legs) {
    while ((axis === 'x' ? cx : cy) !== target) {
      if (axis === 'x') cx += Math.sign(target - cx); else cy += Math.sign(target - cy);
      if (!inMap(cx, cy)) { ui.stroke = tiles; return; }
      const why = s.road[tileIdx(cx, cy)] ? '' : canRoad(s, cx, cy);
      if (why) { ui.stroke = tiles; ui.strokeBlock = { i: tileIdx(cx, cy), why: roadBlockWhy(s, cx, cy, why) }; return; }
      tiles.push(tileIdx(cx, cy));
    }
  }
  ui.stroke = tiles;
}

function ghostUpdate(sx, sy, held) {
  const s = APP.state, tool = APP.ui.tool;
  if (BUILDINGS[tool]) {
    const f = snapFoot(tool, sx, sy);
    APP.ui.ghost = { type: tool, x: f.x, y: f.y, why: f.why, held: !!held };
  } else if (tool === 'remove') {
    const t = targetAt(sx, sy), info = removeInfo(s, t.x, t.y);
    const armed = APP.ui.ghost && APP.ui.ghost.remove && APP.ui.ghost.armed && APP.ui.ghost.x === t.x && APP.ui.ghost.y === t.y;
    APP.ui.ghost = { remove: true, x: t.x, y: t.y, info, armed };
  }
}

// The bubble drawn nearest to a screen point (within a finger's width), or null.
function bubbleAt(sx, sy) {
  let best = null;
  for (const q of (APP.R && APP.R.bubbles) || []) { const d = Math.hypot(q.x - sx, q.y - sy); if (d < 20 && (!best || d < best.d)) best = Object.assign({ d }, q); }
  return best;
}

function tapAt(sx, sy) {
  const s = APP.state, tool = APP.ui.tool;
  $('pop').classList.remove('show');
  if (tool === 'look') {
    // a bubble: its home's card and a small legend of what the bubbles say
    const bub = bubbleAt(sx, sy);
    if (bub) { cardOpen(bub.id); legendOpen(bub); APP.ui.lastTap = null; return; }
    // a roof drawn over other buildings: a tap on the one already selected picks the next one drawn under the finger
    // (so a second tap on the same spot cycles through them, even after the card moved the view)
    const list = renderPickAll(APP.R, APP.view, s, sx, sy);
    let b = list[0] || null;
    if (b && list.length > 1) {
      const k = list.findIndex((o) => o.id === APP.ui.sel);
      if (k >= 0) b = list[(k + 1) % list.length];
    }
    if (b) cardOpen(b.id); else cardClose();
    return;
  }
  if (BUILDINGS[tool]) {
    // the nearest footprint that fits within two tiles of the finger
    const f = snapFoot(tool, sx, sy);
    const r = f.why ? { ok: false, why: f.why } : placeBuilding(s, tool, f.x, f.y);
    if (r.ok) {
      APP.ui.ghost = null;
      floaterAdd(f.x + BUILDINGS[tool].w / 2, f.y + BUILDINGS[tool].h / 2, '−$' + BUILDINGS[tool].cost, '#c0392b', false, r.b && r.b.id);
      guideIntro(s); guideRender();
    } else {
      APP.ui.ghost = { type: tool, x: f.x, y: f.y, why: r.why };
    }
    return;
  }
  if (tool === 'remove') {
    const t = targetAt(sx, sy), g = APP.ui.ghost;
    if (g && g.remove && g.armed && g.x === t.x && g.y === t.y) {
      const r = removeAt(s, t.x, t.y);
      if (!r.why) { floaterAdd(r.b ? r.b.x + r.b.w / 2 : t.x + 0.5, r.b ? r.b.y + r.b.h / 2 : t.y + 0.5, '+$' + r.refund, '#2e8b3e'); if (r.b && r.b.id === APP.ui.sel) cardClose(); }
      APP.ui.ghost = null;
    } else {
      const info = removeInfo(s, t.x, t.y);
      APP.ui.ghost = { remove: true, x: t.x, y: t.y, info, armed: !info.why };
    }
  }
}

function inputInit(canvas) {
  const ptrs = new Map();
  let gesture = null;
  const pos = (e) => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

  const down = (e) => {
    try { if (e.real) canvas.setPointerCapture(e.pointerId); } catch (err) { /* touch fallback: no capture */ }
    const p = pos(e);
    ptrs.set(e.pointerId, p);
    APP.gesturing = true;
    if (e.button === 2) return;
    if (ptrs.size === 2) {
      // A second finger: cancel any stroke and start a pinch.
      APP.ui.stroke = null; APP.ui.strokeBlock = null;
      const [a, b] = [...ptrs.values()];
      gesture = { kind: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y), z0: APP.view.z, mid: screenToTile(APP.R, APP.view, (a.x + b.x) / 2, (a.y + b.y) / 2) };
      return;
    }
    gesture = { kind: 'press', x0: p.x, y0: p.y, grab: screenToTile(APP.R, APP.view, p.x, p.y), moved: false };
    if (APP.ui.tool === 'road') {
      const t = tileAt(p.x, p.y);
      if (inMap(t.x, t.y)) { APP.ui.strokeA = tileIdx(t.x, t.y); APP.ui.strokeAxis = ''; strokeTo(t.x, t.y); gesture.kind = 'road'; }
    } else if (BUILDINGS[APP.ui.tool] && e.pointerType !== 'mouse') {
      // a finger with a building tool: the ghost follows it (snapped); lifting after a drag leaves it there
      gesture.kind = 'place';
      ghostUpdate(p.x, p.y);
    }
  };

  const move = (e) => {
    const p = pos(e);
    if (!ptrs.has(e.pointerId)) {
      if (e.pointerType === 'mouse') ghostUpdate(p.x, p.y);
      return;
    }
    ptrs.set(e.pointerId, p);
    if (!gesture) return;
    if (gesture.kind === 'pinch' && ptrs.size >= 2) {
      const [a, b] = [...ptrs.values()];
      APP.view.z = gesture.z0 * Math.hypot(a.x - b.x, a.y - b.y) / Math.max(1, gesture.d0);
      viewClamp();
      // Keep the point between the fingers under the fingers.
      const m = screenToTile(APP.R, APP.view, (a.x + b.x) / 2, (a.y + b.y) / 2);
      APP.view.cx += gesture.mid.x - m.x; APP.view.cy += gesture.mid.y - m.y;
      viewClamp();
      return;
    }
    if (gesture.kind === 'road') {
      const t = tileAt(p.x, p.y);
      strokeTo(t.x, t.y);
      return;
    }
    if (gesture.kind === 'place') {
      if (Math.hypot(p.x - gesture.x0, p.y - gesture.y0) > TAP_MOVE) gesture.moved = true;
      ghostUpdate(p.x, p.y);
      return;
    }
    if (gesture.kind === 'press' || gesture.kind === 'pan') {
      // one finger pans only when no tool is armed (a mouse may still drag the map with a building tool)
      const canPan = APP.ui.tool === 'look' || (e.pointerType === 'mouse' && BUILDINGS[APP.ui.tool]);
      if (Math.hypot(p.x - gesture.x0, p.y - gesture.y0) > TAP_MOVE) gesture.kind = canPan ? 'pan' : 'drift';
      if (gesture.kind === 'pan') {
        // Keep the point she grabbed under her finger (works for any projection).
        const t = screenToTile(APP.R, APP.view, p.x, p.y);
        APP.view.cx += gesture.grab.x - t.x; APP.view.cy += gesture.grab.y - t.y;
        viewClamp();
      }
      if (e.pointerType === 'mouse' && BUILDINGS[APP.ui.tool]) ghostUpdate(p.x, p.y);
    }
  };

  const end = (e) => {
    const p = pos(e);
    ptrs.delete(e.pointerId);
    APP.gesturing = ptrs.size > 0;
    if (!gesture) return;
    if (gesture.kind === 'pinch') { if (ptrs.size === 0) gesture = null; return; }
    if (gesture.kind === 'road') {
      const st = APP.ui.stroke, blk = APP.ui.strokeBlock;
      if (st && st.length) {
        const r = placeRoad(APP.state, st);
        if (r.built) { floaterAdd((st[st.length - 1] % MAP_W) + 0.5, ((st[st.length - 1] / MAP_W) | 0) + 0.5, '−$' + r.cost, '#c0392b'); guideIntro(APP.state); guideRender(); }
        if (r.why) toastShow(r.why + (r.built ? ' (built ' + r.built + ' tiles)' : ''));
        else if (blk && r.built) toastShow('The road stops there: ' + blk.why.charAt(0).toLowerCase() + blk.why.slice(1) + '.');
      }
      if (blk && !(st && st.length > 1)) toastShow(blk.why + '.');
      APP.ui.stroke = null; APP.ui.strokeBlock = null;
    } else if (gesture.kind === 'place' && e.type === 'pointerup') {
      if (gesture.moved) ghostUpdate(p.x, p.y, true); else tapAt(p.x, p.y);
    } else if (gesture.kind === 'press' && e.type === 'pointerup') {
      tapAt(p.x, p.y);
    }
    gesture = null;
  };
  const cancel = (e) => { ptrs.delete(e.pointerId); APP.gesturing = ptrs.size > 0; APP.ui.stroke = null; APP.ui.strokeBlock = null; gesture = null; };
  if (window.PointerEvent) {
    const real = (f) => (e) => { e.real = true; f(e); };
    canvas.addEventListener('pointerdown', real(down));
    canvas.addEventListener('pointermove', real(move));
    canvas.addEventListener('pointerup', real(end));
    canvas.addEventListener('pointercancel', real(cancel));
  } else {
    // Block 5: an iPad without Pointer Events (iOS 12 and older): each touch becomes the same pointer the code expects.
    const each = (f, type) => (te) => {
      te.preventDefault();
      for (const t of te.changedTouches) f({ pointerId: t.identifier + 1, clientX: t.clientX, clientY: t.clientY, pointerType: 'touch', button: 0, type });
    };
    canvas.addEventListener('touchstart', each(down, 'pointerdown'), { passive: false });
    canvas.addEventListener('touchmove', each(move, 'pointermove'), { passive: false });
    canvas.addEventListener('touchend', each(end, 'pointerup'), { passive: false });
    canvas.addEventListener('touchcancel', each(cancel, 'pointercancel'), { passive: false });
    canvas.addEventListener('mousedown', (e) => down({ pointerId: 0, clientX: e.clientX, clientY: e.clientY, pointerType: 'mouse', button: e.button, type: 'pointerdown' }));
    window.addEventListener('mousemove', (e) => move({ pointerId: 0, clientX: e.clientX, clientY: e.clientY, pointerType: 'mouse', button: e.button, type: 'pointermove' }));
    window.addEventListener('mouseup', (e) => end({ pointerId: 0, clientX: e.clientX, clientY: e.clientY, pointerType: 'mouse', button: e.button, type: 'pointerup' }));
  }
  canvas.addEventListener('contextmenu', (e) => { e.preventDefault(); toolSet('look'); });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const p = pos(e), before = screenToTile(APP.R, APP.view, p.x, p.y);
    APP.view.z *= Math.exp(-e.deltaY * 0.0015);
    viewClamp();
    const after = screenToTile(APP.R, APP.view, p.x, p.y);
    APP.view.cx += before.x - after.x; APP.view.cy += before.y - after.y;
    viewClamp();
  }, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (APP.titleOn) return;
    if (e.key === 'Escape') { if ($('sheet').classList.contains('show')) sheetClose(); else { toolSet('look'); cardClose(); } }
    if (e.key === ' ') { speedSet(APP.speed ? 0 : 1); e.preventDefault(); }
  });
}

// ---- src/ui/ios.js
// iPad Safari and the home-screen app (block 5). Known iOS behaviour this guards against, none of it testable without
// a real iPad (see nova/README.md, "Not verified"):
// - Safari pinches the whole page (gesturestart / gesturechange) even with user-scalable=no; a double tap zooms.
// - A long press on the canvas offers "Save image"; a long press on text selects it (CSS: -webkit-touch-callout, user-select).
// - The page rubber-bands when a finger drags outside a scrolling panel (CSS: overscroll-behavior, a fixed body; here:
//   touchmove is cancelled unless it scrolls a panel).
// - :active styles only show on iOS when the document has a touchstart listener.
// - After a rotation iOS can leave the page scrolled and report the old innerHeight for a moment: the layout is read
//   again a little later. The map keeps its centre tile (view.cx / cy) through any resize.
// - Old iPads without Pointer Events: input.js maps touch events to the same handlers.

function iosInit() {
  const stop = (e) => { e.preventDefault(); };
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, stop, { passive: false });
  document.addEventListener('dblclick', stop, { passive: false });
  document.addEventListener('contextmenu', stop);
  document.addEventListener('selectstart', stop);
  document.addEventListener('touchstart', () => {}, { passive: true });
  // a drag may scroll a panel that can scroll; anything else would move the page
  document.addEventListener('touchmove', (e) => {
    if (e.touches && e.touches.length > 1) { e.preventDefault(); return; }
    if (!iosScrollable(e.target)) e.preventDefault();
  }, { passive: false });
  const relayout = () => {
    try { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); } catch (e) { /* ignore */ }
    APP.barW = ''; APP.barH = 0; APP.insets = null;
    if (APP.state) { barHeight(); donePlace(); }
  };
  window.addEventListener('resize', () => { relayout(); setTimeout(relayout, 120); setTimeout(relayout, 450); });
  window.addEventListener('orientationchange', () => { setTimeout(relayout, 60); setTimeout(relayout, 450); });
  iconAdd();
}

// A panel that scrolls in the direction a finger can move it (the sheet, the card, the build bar's tray, the legend).
function iosScrollable(el) {
  for (let n = el; n && n !== document.body; n = n.parentElement) {
    if (n.id === 'map') return false;
    if (n.scrollHeight > n.clientHeight + 1 || n.scrollWidth > n.clientWidth + 1) {
      const st = getComputedStyle(n);
      if (/(auto|scroll)/.test(st.overflowY + st.overflowX)) return true;
    }
  }
  return false;
}

// The safe-area insets in px (read from a hidden probe padded with env(); 0 outside iOS).
function safeInsets() {
  if (APP.insets) return APP.insets;
  const el = $('safe');
  let r = { t: 0, r: 0, b: 0, l: 0 };
  if (el) { const st = getComputedStyle(el); r = { t: parseFloat(st.paddingTop) || 0, r: parseFloat(st.paddingRight) || 0, b: parseFloat(st.paddingBottom) || 0, l: parseFloat(st.paddingLeft) || 0 }; }
  APP.insets = r;
  return r;
}

// The home-screen icon: drawn here once (a PNG data URL; iOS reads apple-touch-icon when "Add to Home Screen" is tapped).
// Paper-and-ink: teal sea with wave lines, a sand and grass island, a palm, an ink ring.
function iconAdd() {
  try {
    if (document.querySelector('link[rel="apple-touch-icon"]')) return;
    const N = 180, c = document.createElement('canvas'); c.width = N; c.height = N;
    const g = c.getContext('2d');
    g.fillStyle = '#2793ad'; g.fillRect(0, 0, N, N);
    g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = 3; g.lineCap = 'round';
    for (const [x, y, l] of [[30, 40, 26], [128, 30, 22], [24, 142, 20], [140, 150, 28], [100, 58, 14]]) { g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + l / 2, y - 5, x + l, y); g.stroke(); }
    g.beginPath(); g.ellipse(92, 112, 62, 30, -0.12, 0, Math.PI * 2); g.fillStyle = '#9fe0d6'; g.globalAlpha = 0.45; g.fill(); g.globalAlpha = 1;
    g.beginPath(); g.ellipse(92, 110, 52, 24, -0.12, 0, Math.PI * 2); g.fillStyle = '#f1dcaa'; g.fill(); g.strokeStyle = '#3a2a1f'; g.lineWidth = 3; g.stroke();
    g.beginPath(); g.ellipse(98, 106, 34, 15, -0.12, 0, Math.PI * 2); g.fillStyle = '#9cc46a'; g.fill();
    g.strokeStyle = '#7a4f2e'; g.lineWidth = 6; g.beginPath(); g.moveTo(86, 108); g.quadraticCurveTo(80, 76, 92, 50); g.stroke();
    g.fillStyle = '#4f9a45'; g.strokeStyle = '#2f5e2c'; g.lineWidth = 2;
    for (const a of [-2.6, -1.9, -1.2, -0.5, 0.2]) { g.beginPath(); g.moveTo(92, 50); g.quadraticCurveTo(92 + Math.cos(a) * 30, 50 + Math.sin(a) * 30 - 12, 92 + Math.cos(a) * 44, 50 + Math.sin(a) * 44 + 8); g.quadraticCurveTo(92 + Math.cos(a) * 22, 50 + Math.sin(a) * 22, 92, 50); g.fill(); g.stroke(); }
    g.beginPath(); g.arc(70, 104, 6, 0, Math.PI * 2); g.fillStyle = '#df684c'; g.fill(); g.strokeStyle = '#3a2a1f'; g.lineWidth = 2; g.stroke();
    const link = document.createElement('link');
    link.rel = 'apple-touch-icon'; link.href = c.toDataURL('image/png');
    document.head.appendChild(link);
    c.width = 0; c.height = 0;
  } catch (e) { /* no icon: iOS uses a screenshot */ }
}

// ---- src/ui/title.js
// The title screen (block 5): the island drawn behind, "Isla Nueva", Continue (with the save's date, people and stage)
// and New island (a second step when a save exists: the island being replaced is kept as SAVE_KEY + '-prev').
// The home-screen app opens here. The clock is stopped while it shows.

function titleOpen(hasSave) {
  APP.titleOn = true;
  APP.titleHasSave = hasSave;
  APP.titleSpeed = APP.speed || 1;
  speedSet(0);
  toolSet('look');
  cardClose();
  document.body.classList.add('titled');
  titleView();
  titleRender('main');
}

// The view behind the title: the town (or the bay of a new island), a little farther out than play.
function titleView() {
  const s = APP.state, homes = s.b.filter((b) => b.type === 'casita');
  viewHome();
  if (homes.length >= 6) {
    let x = 0, y = 0;
    for (const h of homes) { x += h.x; y += h.y; }
    APP.view.cx = x / homes.length; APP.view.cy = y / homes.length;
  }
  // the island's part in the open: landscape, right of the card (+18 % of the width); portrait, above it (-20 % of the height)
  const w = window.innerWidth, h = window.innerHeight, z = APP.view.z;
  if (w >= h) { const k = 0.09 * w / z; APP.view.cx -= k; APP.view.cy += k; } else { const k = 0.2 * h / z; APP.view.cx += k; APP.view.cy += k; }
  viewClamp();
}

// "today, 21:40" / "yesterday, 9:05" / "8 Oct, 21:40"
function titleWhen(t) {
  if (!t) return '';
  const d = new Date(t), now = new Date(), hm = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const k = Math.round((day(now) - day(d)) / 864e5);
  return (k === 0 ? 'today' : k === 1 ? 'yesterday' : d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3)) + ', ' + hm;
}

function titleRender(mode) {
  const el = $('title'), has = APP.titleHasSave;
  const palm = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 36c-1-8-1-15 1-22" fill="none" stroke="#7a4f2e" stroke-width="2.6" stroke-linecap="round"/>' +
    '<path d="M21 14c-5-5-11-5-15-2 5-1 9 0 15 2zm0 0c4-6 10-7 14-5-5 0-9 2-14 5zm0 0c-2-6-1-10 2-12-1 4-1 8-2 12zm0 0c6-1 11 2 13 6-4-3-8-5-13-6zm0 0c-6 0-10 3-12 7 3-4 7-6 12-7z" fill="#4f9a45" stroke="#2f5e2c" stroke-width="1.1" stroke-linejoin="round"/>' +
    '<path d="M6 36h28" stroke="#3a2a1f" stroke-width="1.6" stroke-linecap="round"/></svg>';
  let h = '<div class="tcard panel"><div class="kick">A Caribbean island · 1902</div><h1>Isla Nueva</h1><div class="rule">' + palm + '</div>';
  if (mode === 'ask') {
    const m = saveSummary();
    h += '<p class="ask">Start a new island? Your ' + esc(m.stage) + ' of ' + plural(m.people, 'person', 'people') + ' (' + esc(m.date) + ') is kept aside on this device as a backup.</p>' +
      '<button class="tbtn warn" id="tNewYes">Start a new island</button><button class="tbtn" id="tBack">Keep my island</button>';
  } else if (has) {
    const m = saveSummary(), when = titleWhen(m.savedAt);
    h += '<button class="tbtn main" id="tGo">Continue<small>' + esc(m.stage + ' · ' + plural(m.people, 'person', 'people') + ' · ' + m.date) + '</small></button>' +
      '<button class="tbtn" id="tNew">New island</button>' + (when ? '<div class="foot">Saved ' + esc(when) + ' · the game saves itself at every payday</div>' : '');
  } else {
    h += '<button class="tbtn main" id="tGo">New island<small>Governor of a small bay: roads, homes, a market</small></button>' +
      '<div class="foot">The game saves itself at every payday</div>';
  }
  if (APP.loadNote && mode !== 'ask') h += '<p class="note">' + esc(APP.loadNote) + '</p>';
  el.innerHTML = h + '</div>';
  const on = (id, f) => { const b = $(id); if (b) b.addEventListener('click', f); };
  on('tGo', titleClose);
  on('tNew', () => titleRender('ask'));
  on('tBack', () => titleRender('main'));
  on('tNewYes', titleNew);
}

function titleClose() {
  APP.titleOn = false;
  APP.loadNote = '';
  document.body.classList.remove('titled');
  $('title').innerHTML = '';
  viewHome();
  if (APP.titleHasSave) titleView();
  APP.barW = ''; APP.hudKey = '';
  barBuild();
  guideRender();
  speedSet(APP.titleSpeed || 1);
}

// A new island in place of the saved one (kept as SAVE_KEY + '-prev').
function titleNew() {
  const old = storeGet(SAVE_KEY);
  if (old) storeSet(SAVE_KEY + '-prev', old);
  APP.state = newGame(1902);
  renderReset(APP.R);
  APP.ui.floaters = []; APP.ui.hint = null; APP.ui.downSeen = null; APP.ui.confirm = null; APP.ui.space = null;
  APP.titleHasSave = false;
  APP.acc = 0;
  titleClose();
  gameSave();
}

// ---- src/ui/main.js
// The app: load or start an island, run the clock (pause / 1x / 2x / 3x), turn sim events into what she sees, autosave.
// Block 5 (iPad): the title screen first, the loop and the clock stop while the page is hidden, saving never throws,
// a save that cannot be read is kept aside and a new island starts with a note.

// A floater with a building id rises from that building's roof (block 5: they rose from the tile's back corner, which
// on screen is often the building behind, e.g. the Governor's residence); x, y are used when it has none.
function floaterAdd(x, y, text, color, big, id) {
  APP.ui.floaters.push({ x, y, text, color, big, id: id || 0, t0: performance.now() });
  if (APP.ui.floaters.length > 80) APP.ui.floaters.shift();
}

function eventsHandle() {
  const s = APP.state, evs = s.ev.splice(0), downs = [];
  for (const e of evs) {
    const b = e.id && bById(s, e.id);
    if (e.kind === 'money' && b) floaterAdd(b.x + b.w / 2, b.y + b.h / 2, fmtSigned(e.n), e.n < 0 ? '#c0392b' : '#2e8b3e', false, b.id);
    else if (e.kind === 'payday') { receiptShow(e.receipt); gameSave(); }
    else if (e.kind === 'levelup' && b) { floaterAdd(b.x + 0.5, b.y + 0.5, LEVELS[e.level].name + '!', '#167a7a', true, b.id); toastShow('A home became a ' + LEVELS[e.level].name.toLowerCase() + ': more people, more rent.'); }
    else if (e.kind === 'leveldown' && b) { floaterAdd(b.x + 0.5, b.y + 0.5, LEVELS[e.level].name + ' again', '#c0392b', true, b.id); downs.push(e); }
    else if (e.kind === 'stage') { stageCardOpen(e.stage); APP.R.terrainKey = ''; }
    else if (e.kind === 'year') yearCardShow(e.year);
    else if (e.kind === 'residence' && b) { floaterAdd(b.x + b.w / 2, b.y + b.h / 2, RESIDENCE[e.level].name + '!', '#167a7a', true, b.id); toastShow('The ' + RESIDENCE[e.level].name + ' stands on the hill.'); }
    else if (e.kind === 'palace' && b) { floaterAdd(b.x + b.w / 2, b.y + b.h / 2, "Governor's palace!", '#167a7a', true, b.id); APP.R.terrainKey = ''; barBuild(); }
    else if (e.kind === 'guide') guideRender();
    else if (e.kind === 'log' && /settlers? arrived|left the island/.test(e.text)) toastShow(e.text);
  }
  // Homes that stepped down this month: one toast (Rosa explains the first one; a ↓ mark stays on each until tapped).
  if (downs.length && s.guide.seen.down && !(s.guide.msg && s.guide.msg.key === 'hint-down' && downs.length === 1)) {
    toastShow(downs.length === 1 ? downs[0].text + ' The ↓ mark shows where.' : downs.length + ' homes stepped down a level: they lacked what their cards mark ✗. The ↓ marks show where.');
  }
}

// Saves the island (every payday, when the page is hidden or closed). Never throws: a full storage or a private window
// says so once in a toast and the game goes on. Not while the title screen shows a fresh island nobody has played.
function gameSave() {
  if (!APP.state || APP.titleOn) return false;
  let txt = '';
  try { const o = saveGame(APP.state); o.savedAt = Date.now(); txt = JSON.stringify(o); } catch (e) { return false; }
  if (storeSet(SAVE_KEY, txt)) { APP.saveFail = 0; return true; }
  // storage full: the kept-aside broken save and the previous island make room for the island being played
  storeDel(SAVE_KEY + '-broken'); storeDel(SAVE_KEY + '-prev');
  if (storeSet(SAVE_KEY, txt)) return true;
  if (!APP.saveFail) toastShow('The island could not be saved on this device (storage full or a private window). The game goes on.');
  APP.saveFail = 1;
  return false;
}

// The saved island, or null. A save that cannot be read, or that breaks the first month, is kept aside under
// SAVE_KEY + '-broken' (never deleted) and APP.loadNote says so on the title screen; a new island starts.
function gameLoad() {
  const raw = storeGet(SAVE_KEY);
  if (!raw) return null;
  try {
    const s = loadGame(raw);
    if (!Array.isArray(s.terrain) || s.terrain.length !== MAP_W * MAP_H || !Array.isArray(s.road) || s.road.length !== MAP_W * MAP_H) throw new Error('map');
    if (s.b.some((b) => !BUILDINGS[b.type])) throw new Error('unknown building');
    // one month on a copy: a save whose numbers break the simulation is caught here, not as a frozen screen
    const t = simClone(s); t.ev = []; t.walk = [];
    simRunMonths(t, 1);
    return s;
  } catch (e) {
    if (storeSet(SAVE_KEY + '-broken', raw)) storeDel(SAVE_KEY);
    APP.loadNote = 'The saved island could not be opened (' + String(e && e.message || e).slice(0, 60) + '). It is kept aside on this device, and a new island starts.';
    return null;
  }
}

// What the title screen says about a save: its month, people, stage and when it was saved.
function saveSummary() {
  const s = APP.state;
  return { date: dateLabel(s.month), people: popCount(s), stage: STAGES[s.stage].name, savedAt: APP.savedAt || 0 };
}

function viewHome() {
  const p = APP.state.b.find((b) => b.type === 'pier');
  const w = window.innerWidth, h = window.innerHeight;
  APP.view.z = Math.max(20, Math.min(44, Math.min(w / 30, (h - 200) / 18)));
  // The isometric view: z is half a tile's width; start one zoom level closer so homes read at a glance.
  if (APP.R && APP.R.kind === 'iso') APP.view.z = Math.min(50, APP.view.z * 1.2);
  APP.view.cx = p.x + 3 + Math.min(6, w / APP.view.z / 2 - 3);
  APP.view.cy = p.y + 0.5 - (w > h ? 1.5 : 1);
  viewClamp();
}

// The loop runs while the page is visible; hidden, it stops (no frames, no clock) and resumes where it was.
function loopStart() {
  if (APP.raf) return;
  APP.last = 0;
  APP.raf = requestAnimationFrame(frame);
}

function loopStop() {
  if (APP.raf) cancelAnimationFrame(APP.raf);
  APP.raf = 0;
}

function frame(now) {
  APP.raf = requestAnimationFrame(frame);
  try { frameRun(now); } catch (e) {
    // one bad frame must not stop the game: the error is shown once in the console and the next frame tries again
    if (!APP.frameErr) { APP.frameErr = 1; console.error(e); }
  }
}

function frameRun(now) {
  const s = APP.state;
  const dt = Math.min(0.25, (now - (APP.last || now)) / 1000);
  APP.last = now;
  APP.ui.now = now;
  if (APP.speed > 0) {
    const tickSec = TUNE.secondsPerMonth / TUNE.ticksPerMonth;
    APP.acc += dt * APP.speed;
    let n = 0;
    while (APP.acc >= tickSec && n < 40) { simTick(s); APP.acc -= tickSec; n++; }
    if (n >= 40) APP.acc = 0;
  }
  eventsHandle();
  hudUpdate();
  hintCheck();
  spaceUpdate();
  if (APP.ui.sel && (s.tick % 5 === 0 || !APP.cardKey)) cardRender();
  toastTick(now);
  receiptTick(now);
  APP.ui.floaters = APP.ui.floaters.filter((f) => now - f.t0 < 1700);
  renderDraw(APP.R, s, APP.view, APP.ui);
}

// ?new: a new island at once (the old save is kept as SAVE_KEY + '-prev'); ?play: the saved island at once (tests);
// otherwise the title screen. The address is cleaned afterwards, so a home-screen icon never starts with ?new.
function boot() {
  const params = new URLSearchParams(location.search), fresh = params.has('new'), play = params.has('play');
  if (fresh) { const old = storeGet(SAVE_KEY); if (old) storeSet(SAVE_KEY + '-prev', old); }
  const saved = fresh ? null : gameLoad();
  if (saved) { try { APP.savedAt = JSON.parse(storeGet(SAVE_KEY)).savedAt || 0; } catch (e) { APP.savedAt = 0; } }
  APP.state = saved || newGame(+(params.get('seed') || 1902));
  APP.R = renderCreate($('map'));
  iosInit();
  hudInit();
  speedSet(1);
  viewHome();
  inputInit($('map'));
  guideRender();
  window.addEventListener('pagehide', () => { gameSave(); });
  window.addEventListener('pageshow', () => { if (!document.hidden) loopStart(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { gameSave(); loopStop(); renderTrim(APP.R); } else loopStart();
  });
  if (!fresh && !play) titleOpen(!!saved);
  else if (APP.loadNote) toastShow(APP.loadNote);
  try { if (location.search && history.replaceState) history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* file: or sandbox */ }
  loopStart();
}

if (typeof window !== 'undefined' && typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
}

</script>
